<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизнь</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a0a0a;color:#ddd;font-family:'Courier New',monospace;min-height:100vh}
  #app{min-height:100vh;transition:opacity .2s ease}
  #app.fade-out{opacity:0}
  .scene{position:relative;min-height:100vh;padding:4rem 2rem;background:#111 center/cover no-repeat;animation:fadeIn .3s ease}
  .scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:0}
  .scene>*{position:relative;z-index:1}
  .scene-inner{max-width:720px;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .text{font-size:1.15rem;line-height:1.7;margin-bottom:1rem;min-height:3em;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:pre-line}
  .after-text{font-size:1.05rem;line-height:1.75;color:#c8c8c8;font-style:italic;white-space:pre-line}
  .status{font-size:.85rem;color:#888;margin-bottom:1.5rem;letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:.6rem}
  .status .low{color:#c33}
  .choices button{display:block;width:100%;margin:.5rem 0;padding:.85rem 1.1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:1rem;text-align:left;transition:background .2s,transform .1s,border-color .2s}
  .choices button:hover{background:rgba(40,40,40,.95);transform:translateX(4px);border-color:#555}
  .name-input{width:100%;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;font-family:inherit;font-size:1.1rem;margin-bottom:1rem}
  .name-input:focus{outline:none;border-color:#666}
  .death-screen{min-height:100vh;padding:6rem 2rem;text-align:center;max-width:720px;margin:0 auto;animation:fadeIn .5s ease;display:flex;flex-direction:column;justify-content:center}
  .counter{color:#666;font-size:.9rem;margin-top:2rem}
  .death-screen button{margin:2rem auto 0;padding:.8rem 2rem;background:transparent;color:#eee;border:1px solid #555;cursor:pointer;font-family:inherit;font-size:1rem}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px)}}
  .shake{animation:shake .25s 3}
  @media (max-width:600px){.scene{padding:2rem 1rem}.text{font-size:1rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BG = {
  home:"linear-gradient(135deg,#1a1510,#0a0805)", corridor:"linear-gradient(135deg,#1a1a22,#0d0d12)",
  corridor_night:"linear-gradient(135deg,#05050a,#1a0a0a)", street:"linear-gradient(135deg,#0f1218,#05070a)",

  hospital:"linear-gradient(135deg,#141a1a,#0a1010)", forest:"linear-gradient(135deg,#0a120a,#050805)",
  road:"linear-gradient(135deg,#1a1a1a,#0a0a0a)", rooftop:"linear-gradient(135deg,#0a0a14,#05050a)",
  psych:"linear-gradient(135deg,#1a0a1a,#0a050a)", park:"linear-gradient(135deg,#0a1a10,#050a08)",

const state = {
  name:"", gender:"boy",
  y:2015, m:9, d:1, age:7, day:0,
  fear:0, guilt:0, stamina:10, karma:0, mental:10,

  deathCause:null, deathAge:null, killer:null,

  thingLevel:0, thingNextDay:180,
  recentScenes:[],

  timeOfDay: "morning",

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const fmtDate = () => `${state.d} ${MONTHS[state.m-1]} ${state.y}`;
const flag = n => !!state.flags[n];
const rel  = n => state.relations[n] ?? 0;
const setRel = (n,d) => { state.relations[n] = Math.max(-10,Math.min(10,rel(n)+d)); };
const setMental = d => { state.mental = Math.max(1,Math.min(10,state.mental+d)); };
const schedule = (days,event) => state.timers.push({day:state.day+days,event});
const checkTimers = () => {
  const due = state.timers.filter(t=>t.day<=state.day);
  state.timers = state.timers.filter(t=>t.day>state.day);
  return due;
};
const starStr = n => "★".repeat(n)+"☆".repeat(10-n);
const g  = (m,f) => state.gender === "girl" ? f : m;
const F = () => state.gender === "girl" ? "Саша" : "Лена";
const fHe = () => state.gender === "girl" ? "он" : "она";
const fHeCap = () => state.gender === "girl" ? "Он" : "Она";
const fE = () => state.gender === "girl" ? "его" : "её";
const fGender = () => state.gender === "girl" ? "мальчик" : "девочка";
const fHair = () => state.gender === "girl" ? "взлохмаченными волосами" : "двумя косичками";
const fClothes = () => state.gender === "girl" ? "костюм" : "платье";
const fA = () => state.gender === "girl" ? "" : "а";

const U = () => state.gender === "girl" ? "Вадим" : "Света";
const uHe = () => state.gender === "girl" ? "он" : "она";
const uHeCap = () => state.gender === "girl" ? "Он" : "Она";
const uE = () => state.gender === "girl" ? "его" : "её";
const uA = () => state.gender === "girl" ? "" : "а";

const isWeekend = () => [0, 6].includes(new Date(state.y, state.m-1, state.d).getDay());
const isRaining = () => state.flags.weather_rain;

const pickScene = (pool) => {
  const valid = pool.filter(id => {
    const s = scenes[id];
    if(!s) return false;
    if(typeof s === "function") return true;
    if(s.when && !s.when()) return false;
    if(s.time && s.time !== state.timeOfDay && s.time !== "any") return false;
    return true;
  });

  let avail = valid.filter(s => !state.recentScenes.includes(s));
  if(!avail.length){
    const last = state.recentScenes[state.recentScenes.length - 1];
    avail = valid.filter(s => s !== last);
  }
  if(!avail.length) return "neutral_empty_day";

  const pick = avail[Math.floor(Math.random()*avail.length)];
  state.recentScenes.push(pick);
  if(state.recentScenes.length > 5) state.recentScenes.shift();
  return pick;
};

function lenaProtect(){
  state.flags.lena_protect_count = (state.flags.lena_protect_count||0) + 1;
  setRel("lena", +1);
  if (state.flags.lena_protect_count >= 4 && !flag("lena_dead")) {
    state.flags.lena_dead = true;
    return "lena_death";
  }
  return null;
}

let audioCtx=null;
const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){
  try{
    const ctx=getCtx();
    if(ctx.state==="suspended")ctx.resume();
    if(name==="glitch"){
      const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=ctx.createBufferSource();s.buffer=buf;
      const gn=ctx.createGain();
      gn.gain.setValueAtTime(.4,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
      s.connect(gn).connect(ctx.destination);s.start();
    }
    if(name==="heartbeat"){
      const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain();
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15);
        gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25);
      };
      const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35);
    }
  }catch(e){}
}

  {q:"Столица Франции?", correct:"Париж", wrong:["Лондон","Берлин","Мадрид"], subject:"географии"},
  {q:"В каком году началась Великая Отечественная война?", correct:"1941", wrong:["1939","1945","1914"], subject:"истории"},
  {q:"Кто написал «Войну и мир»?", correct:"Толстой", wrong:["Достоевский","Пушкин","Чехов"], subject:"литературе"},
  {q:"Сколько будет 15 плюс 27?", correct:"42", wrong:["41","43","52"], subject:"математике"},
  {q:"Самая длинная река в мире?", correct:"Амазонка", wrong:["Нил","Волга","Енисей"], subject:"географии"},
  {q:"Сколько цветов в радуге?", correct:"7", wrong:["6","8","5"], subject:"окружающему миру"},
];

function buildTeacherScene(){
  const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  const answers = [q.correct, ...q.wrong].sort(()=>Math.random()-0.5);
  return {
    bg:"school",
    text:`Марина Павловна стучит указкой по доске. В классе двадцать три человека. Все смотрят в журнал.\n\n«${state.name}», — говорит она, не поднимая глаз. «К доске».\n\nКласс затихает. Кто-то хихикает. У тебя потеют ладони. Вопрос по ${q.subject}: ${q.q}`,
    choices: answers.map(a => ({
      text: a,
      effects: ()=>{
        if(a === q.correct){ setMental(+1); setRel("teacher", +1); }
        else { setMental(-2); state.guilt += 1; }
      },
      next: a === q.correct ? "teacher_correct" : "teacher_wrong",
    }))
  };
}

    {text:`«${state.name}»`, effects:()=>{setRel("lena",+3);state.flags.lena_friend=true;state.flags.lena_met=true;}, next:"first_day_class", after:`«Красивое имя. У меня была кошка с таким именем». Ты смеёшься.`}
  ]},

first_day_class: { bg:"school", text:`Класс. Одиннадцать детей. Учительница — высокая, в очках. «${g("Новенький","Новенькая")}? Садись с ${F()}».`,
  next:"first_day_after"},

first_day_after: { bg:"school", text:`Последний урок закончился. ${F()} ждёт тебя у скамейки. «Ну что, ты как?»`,
  choices:[
    {text:"«Спасибо, что помог${fA()}»", effects:()=>{setRel("lena",+2);}, next:"next_day", after:`Вы расходитесь. Дома мать спросит, как всё прошло. Ты скажешь: «Нормально».`}
  ]},

first_day_alone: { bg:"school", text:`Ты идёшь по коридору один. Урок уже начался. Тебя находят.`, next:"next_day"},

home_age6: { bg:"home", time:"evening", when:()=>!flag("home_seen"), text:`${fmtDate()}.\n\nДома тихо. Мать на кухне. Отец не вернулся.\n\nИз подвала доносится шорох.`,
  choices:[
    {text:"Пойти в подвал", effects:()=>{state.fear+=2;state.flags.basement_seen=true;state.flags.home_seen=true;}, next:"basement_age6", after:`Скрип ступеней. Шорох прекращается.`},
    {text:"Спрятаться под одеяло", effects:()=>{state.fear+=1;state.flags.home_seen=true;}, next:"next_day", after:`Ты засыпаешь под шорох.`}
  ]},

basement_age6: { bg:"basement", text:`Темно. Что-то шевелится в углу.`,
  choices:[
    {text:"Подойти ближе", effects:()=>{state.fear+=4;}, next:"next_day", after:`Оно смотрит. Нет лица, но ты знаешь — оно улыбается.`},
    {text:"Бежать наверх", next:"next_day"}
  ]},

teacher_correct: { bg:"school", text:`Марина Павловна кивает. «Правильно». ${F()} шепчет: «Молодец».`, next:"next_day"},
teacher_wrong: { bg:"school", text:`Класс смеётся. «Двоечник!» — кричит Дима. Ты возвращаешься на место.`, next:"next_day"},

dima_bully: { bg:"school", time:"day", when:()=>state.age>=8 && state.age<=14 && !flag("dima_met"), text:`${fmtDate()}.\n\nДима подходит к твоей парте. «Ты чё такой тихий?»`,
  choices:[
    {text:"Молчать", effects:()=>{setMental(-1);state.flags.dima_met=true;}, next:"next_day", after:`Он забирает учебник.`},
    {text:"Дать отпор", effects:()=>{state.karma-=1; state.stamina-=2;}, next:"dima_fight", after:`Ты говоришь «Отойди». Он толкает тебя.`}
  ]},

dima_fight: { bg:"school", text:`Ты толкаешь в ответ. Он падает. Входит учительница.`, next:"next_day"},

exam9_choice: { bg:"school", when:()=>state.age>=15 && !flag("exam9_done"), text:`${fmtDate()}. Тебе пятнадцать. ОГЭ позади.`,
  choices:[
    {text:"Остаться в школе", effects:()=>{state.flags.exam9_done=true;state.flags.school_10_11=true;}, next:"next_day"},
    {text:"Уйти в колледж", effects:()=>{state.flags.exam9_done=true;}, next:"next_day"}
  ]},

psych_ward: { bg:"psych", text:`Тебя забрали. Белые стены.`,
  choices:[
    {text:"Сотрудничать", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Бунтовать", effects:()=>{if(Math.random()<.5)die("psych_kill",state.age);}, next:"next_day"}
  ]},

psych_final_choice: { bg:"psych", text:`Прошло двенадцать дней. Врач: «Завтра — последняя процедура». Ночью решётка приоткрыта.`,
  choices:[
    {text:"Пройти лечение", effects:()=>{
      if(Math.random()<0.95){state.flags.psych_ward=false;setMental(+4);return "next_day";} else {die("psych_kill", state.age); return null;}
    }},
    {text:"Сбежать", effects:()=>{
      if(Math.random()<0.5){state.flags.psych_ward=false;setMental(+2);return "next_day";} else {setMental(-3);return "next_day";}
    }}
  ]},

old_age_loop: { bg:"home", text:`${fmtDate()}. Ещё год.`,
  choices:[
    {text:"Продолжать", effects:()=>{ if(state.age<80) state.age++; else die("old_age",state.age); return "next_day"; }},
    {text:"Закончить", effects:()=>{die("pills",state.age);}}
  ]},

day_start: { bg:"home", text:`Новый день.`, choices:[{text:"Продолжить", next:"next_day"}]},

};
}

const POOL_7_MORNING = ["morning_school", "morning_weekend"];
const POOL_7_DAY = ["neutral_weather", "story_find_thing", "dima_bully"];
const POOL_7_EVENING = ["neutral_dinner", "neutral_evening_tv", "home_age6"];

const POOL_12_MORNING = ["morning_school", "morning_weekend"];
const POOL_12_DAY = ["neutral_weather", "dima_bully", "story_find_thing"];
const POOL_12_EVENING = ["neutral_dinner", "neutral_evening_tv"];

function getPool(){
  const a = state.age;
  if(a<12){
    if(state.timeOfDay === "morning") return POOL_7_MORNING;
    if(state.timeOfDay === "day") return POOL_7_DAY;
    return POOL_7_EVENING;
  }
  if(a<16){
    if(state.timeOfDay === "morning") return POOL_12_MORNING;
    if(state.timeOfDay === "day") return POOL_12_DAY;
    return POOL_12_EVENING;
  }
  return ["neutral_dinner", "neutral_weather", "neutral_empty_day"];
}

const app = document.getElementById("app");

function die(cause, atAge, killer=null){
  state.deathCause = DEATHS[cause] || cause;
  state.deathAge = atAge;
  state.killer = killer;
  showDeath();
}

function buildEpilogue(){
  const parts = [`Ты ${g("умер","умерла")} в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  if(flag("killed_ever")) parts.push("Ты убил человека. Это осталось с тобой.");
  const key=[state.deathCause,state.deathAge,flag("kind")?"k":"-"].join("_");
  state.seenEndings.add(key);
  return parts.join(" ");
}

function showDeath(){
  const ep = buildEpilogue();
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML=`
      <div class="death-screen">
        <p>${ep}</p>
        <p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge} · ${fmtDate()}</p>
        <button id="restart">Начать заново</button>
      </div>`;
    document.getElementById("restart").onclick=()=>location.reload();
    app.classList.remove("fade-out");
  },150);
}

function playScene(id){
  if(id==="next_day"||id==="auto_day") return advanceDay();
  let scene = scenes[id];
  if(!scene){
    return advanceDay();
  }

  if(typeof scene === "function") scene = scene();
  if(scene.when && !scene.when()) return playScene("next_day");

  render(scene);
}

function render(scene){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    const timeStr = state.timeOfDay === "morning" ? "Утро" : state.timeOfDay === "day" ? "День" : "Вечер";
    
    app.innerHTML=`
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} лет · ${timeStr}</span>
            <span class="${mentClass}">${starStr(state.mental)}</span>
          </div>
          <p class="text">${scene.text}</p>
          <div class="choices"></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG[scene.bg] || BG.home;

    const box = app.querySelector(".choices");
    if(scene.choices){
      scene.choices.forEach(c=>{
        if(c.when && !c.when()) return;
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = ()=>{
          getCtx();
          const jumpTo = c.effects?.();
          if(state.deathCause) return;
          if(c.after){
            showAfter(c.after, jumpTo || c.next || "next_day");
            return;
          }
          playScene(jumpTo || c.next || "next_day");
        };
        box.appendChild(b);
      });
    } else {
      const b = document.createElement("button");
      b.textContent = "Дальше";
      b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");};
      box.appendChild(b);
    }
    app.classList.remove("fade-out");
  },150);
}

function showAfter(text, next){
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()}</span>
          </div>
          <p class="text after-text">${text}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;
    document.getElementById("contBtn").onclick = ()=>{
      app.classList.remove("fade-out");
      playScene(next);
    };
    app.classList.remove("fade-out");
  },150);
}

function advanceDay(){
  if(state.timeOfDay === "morning"){
    state.timeOfDay = "day";
    return autoDay();
  }
  if(state.timeOfDay === "day"){
    state.timeOfDay = "evening";
    return autoDay();
  }
  
  state.timeOfDay = "morning";
  state.d += 1;
  
  if(Math.random() < 0.1) state.flags.weather_rain = true;
  else state.flags.weather_rain = false;

  const dim = new Date(state.y, state.m, 0).getDate();
  if(state.d > dim){ state.d = 1; state.m += 1; }
  if(state.m > 12){ state.m = 1; state.y += 1; }
  state.day += 1;

  if(state.m === 11 && state.d === 28 && !state.flags["_bd_"+state.y]){
    state.flags["_bd_"+state.y] = true;
    state.age += 1;
  }

  if(state.day > 0 && state.day % 7 === 0 && !flag("story_thing_started") && !flag("psych_ward")) {
      state.d += 6; 
      const dim2 = new Date(state.y, state.m, 0).getDate();
      if(state.d > dim2){ state.d -= dim2; state.m += 1; }
      return playScene("skip_week");
  }

  autoDay();
}

function autoDay(){
  if(flag("psych_ward") && !flag("psych_kill_done")){
     if(state.day % 5 === 0) return playScene("psych_final_choice");
     return playScene("psych_ward");
  }
  
  const due = checkTimers();
  if(due.length) return playScene("event_"+due[0].event);

  playScene(pickScene(getPool()));
}

function startScreen(){
  app.classList.remove("fade-out");
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Новая жизнь · 2015 год</span></div>
        <p class="text">Как тебя зовут?</p>
        <input id="nameInput" class="name-input" maxlength="20" placeholder="Имя" autocomplete="off">
        <div class="choices"><button id="btnOk">Дальше</button></div>
      </div>
    </div>`;
  const input = document.getElementById("nameInput");
  input.focus();
  const go = () => {
    const v = input.value.trim();
    if(v.length < 1){ input.placeholder = "Введи имя"; input.focus(); return; }
    state.name = v;
    genderScreen();
  };
  document.getElementById("btnOk").onclick = go;
  input.onkeydown = e => { if(e.key === "Enter") go(); };
}

function genderScreen(){
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Имя: ${state.name}</span></div>
        <p class="text">Ты девочка или мальчик?</p>
        <div class="choices">
          <button data-g="girl">Девочка</button>
          <button data-g="boy">Мальчик</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      state.gender = b.dataset.g;
      scenes = initScenes();
      scenes.skip_week = {
        bg: "home",
        text: "Прошла неделя...\n\nНичего важного не случилось. Ты просто жил(а) своей жизнью.",
        choices: [{text: "Дальше", next: "next_day"}]
      };
      playScene("first_day_school");
    };
  });
}

startScreen();
</script>
