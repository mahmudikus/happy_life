<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизнь</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a0a0a;color:#ddd;font-family:'Courier New',monospace;min-height:100vh}
  #app{min-height:100vh;transition:opacity .2s ease}
  #app.fade-out{opacity:0}
  .scene{position:relative;min-height:100vh;padding:4rem 2rem;background:#111 center/cover no-repeat;animation:fadeIn .3s ease}
  .scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:0}
  .scene>*{position:relative;z-index:1}
  .scene-inner{max-width:720px;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .text{font-size:1.15rem;line-height:1.7;margin-bottom:1rem;min-height:3em;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:pre-line}
  .after-text{font-size:1.05rem;line-height:1.75;color:#c8c8c8;font-style:italic;white-space:pre-line}
  .status{font-size:.85rem;color:#888;margin-bottom:1.5rem;letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:.6rem}
  .status .low{color:#c33}
  .choices button{display:block;width:100%;margin:.5rem 0;padding:.85rem 1.1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:1rem;text-align:left;transition:background .2s,transform .1s,border-color .2s}
  .choices button:hover{background:rgba(40,40,40,.95);transform:translateX(4px);border-color:#555}
  .name-input{width:100%;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;font-family:inherit;font-size:1.1rem;margin-bottom:1rem}
  .name-input:focus{outline:none;border-color:#666}
  .death-screen{min-height:100vh;padding:6rem 2rem;text-align:center;max-width:720px;margin:0 auto;animation:fadeIn .5s ease;display:flex;flex-direction:column;justify-content:center}
  .counter{color:#666;font-size:.9rem;margin-top:2rem}
  .death-screen button{margin:2rem auto 0;padding:.8rem 2rem;background:transparent;color:#eee;border:1px solid #555;cursor:pointer;font-family:inherit;font-size:1rem}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px)}}
  .shake{animation:shake .25s 3}
  @media (max-width:600px){.scene{padding:2rem 1rem}.text{font-size:1rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BG = {
  home:"linear-gradient(135deg,#1a1510,#0a0805)", corridor:"linear-gradient(135deg,#1a1a22,#0d0d12)",
  corridor_night:"linear-gradient(135deg,#05050a,#1a0a0a)", street:"linear-gradient(135deg,#0f1218,#05070a)",
  school:"linear-gradient(135deg,#141821,#0a0d12)", basement:"linear-gradient(135deg,#0a0505,#000)",
  hospital:"linear-gradient(135deg,#141a1a,#0a1010)", forest:"linear-gradient(135deg,#0a120a,#050805)",
  road:"linear-gradient(135deg,#1a1a1a,#0a0a0a)", rooftop:"linear-gradient(135deg,#0a0a14,#05050a)",
  psych:"linear-gradient(135deg,#1a0a1a,#0a050a)", park:"linear-gradient(135deg,#0a1a10,#050a08)",
  orphanage:"linear-gradient(135deg,#12100a,#080605)", neighbor:"linear-gradient(135deg,#1a1410,#0a0806)",
};

const state = {
  name:"", gender:"boy", y:2015, m:9, d:1, age:7, day:0,
  fear:0, guilt:0, stamina:10, karma:0, mental:10,
  flags:{}, relations:{}, timers:[],
  deathCause:null, deathAge:null, killer:null, seenEndings:new Set(),
  thingLevel:0, thingNextDay:180, recentScenes:[], dementia:0, timeOfDay: "morning",
};

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const fmtDate = () => `${state.d} ${MONTHS[state.m-1]} ${state.y}`;
const flag = n => !!state.flags[n];
const rel  = n => state.relations[n] ?? 0;
const setRel = (n,d) => { state.relations[n] = Math.max(-10,Math.min(10,rel(n)+d)); };
const setMental = d => { state.mental = Math.max(1,Math.min(10,state.mental+d)); };
const schedule = (days,event) => state.timers.push({day:state.day+days,event});
const checkTimers = () => { const due = state.timers.filter(t=>t.day<=state.day); state.timers = state.timers.filter(t=>t.day>state.day); return due; };
const starStr = n => "★".repeat(n)+"☆".repeat(10-n);
const g  = (m,f) => state.gender === "girl" ? f : m;
const F = () => state.gender === "girl" ? "Саша" : "Лена";
const fHe = () => state.gender === "girl" ? "он" : "она";
const fHeCap = () => state.gender === "girl" ? "Он" : "Она";
const fE = () => state.gender === "girl" ? "его" : "её";
const fGender = () => state.gender === "girl" ? "мальчик" : "девочка";
const fHair = () => state.gender === "girl" ? "взлохмаченными волосами" : "двумя косичками";
const fClothes = () => state.gender === "girl" ? "костюм" : "платье";
const fA = () => state.gender === "girl" ? "" : "а";

const U = () => state.gender === "girl" ? "Вадим" : "Света";
const uHe = () => state.gender === "girl" ? "он" : "она";
const uHeCap = () => state.gender === "girl" ? "Он" : "Она";
const uE = () => state.gender === "girl" ? "его" : "её";
const uA = () => state.gender === "girl" ? "" : "а";

const spouseName = () => flag("married_lena") ? F() : flag("married_uni") ? U() : "партнёр";
const spouseHe = () => flag("married_lena") ? fHe() : flag("married_uni") ? uHe() : "он";
const spouseHeCap = () => flag("married_lena") ? fHeCap() : flag("married_uni") ? uHeCap() : "Он";
const spouseE = () => flag("married_lena") ? fE() : flag("married_uni") ? uE() : "его";
const spouseA = () => flag("married_lena") ? fA() : flag("married_uni") ? uA() : "";
const spouseRelName = () => flag("married_lena") ? "lena" : "uni";

const lowMentalActive = () => state.mental <= 2;
const glance = () => lowMentalActive() ? "Люди отводят взгляды. " : "";
const isWeekend = () => [0, 6].includes(new Date(state.y, state.m-1, state.d).getDay());
const isRaining = () => state.flags.weather_rain;

const pickScene = (pool) => {
  const valid = pool.filter(id => { const s = scenes[id]; if(!s) return false; if(typeof s === "function") return true; if(s.when && !s.when()) return false; if(s.time && s.time !== state.timeOfDay && s.time !== "any") return false; return true; });
  let avail = valid.filter(s => !state.recentScenes.includes(s));
  if(!avail.length){ const last = state.recentScenes[state.recentScenes.length - 1]; avail = valid.filter(s => s !== last); }
  if(!avail.length) return "neutral_empty_day";
  const pick = avail[Math.floor(Math.random()*avail.length)];
  state.recentScenes.push(pick); if(state.recentScenes.length > 5) state.recentScenes.shift();
  return pick;
};

function lenaProtect(){ state.flags.lena_protect_count = (state.flags.lena_protect_count||0) + 1; setRel("lena", +1); if (state.flags.lena_protect_count >= 4 && !flag("lena_dead")) { state.flags.lena_dead = true; return "lena_death"; } return null; }
function lenaUse(){ state.flags.lena_used_count = (state.flags.lena_used_count||0) + 1; setRel("lena", -2); if (state.flags.lena_used_count >= 3 && !flag("lena_left")) { state.flags.lena_left = true; return "lena_leaves"; } return null; }

let audioCtx=null; const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){ try{ const ctx=getCtx(); if(ctx.state==="suspended")ctx.resume(); if(name==="glitch"){ const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length); const s=ctx.createBufferSource();s.buffer=buf; const gn=ctx.createGain(); gn.gain.setValueAtTime(.4,ctx.currentTime); gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur); s.connect(gn).connect(ctx.destination);s.start(); } if(name==="heartbeat"){ const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain(); o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15); gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25); }; const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35); } }catch(e){} }

const DEATHS = {
  car:"сбит машиной", train:"сбит поездом", fall:"упал с высоты", drown:"утонул", fire:"сгорел",
  choke:"подавился", fall_stairs:"упал с лестницы", glass:"порезался насмерть",
  killed_classmate:"убит одноклассницей", killed_stranger:"убит незнакомцем", killed_lover:"убит возлюбленным",
  stabbed:"зарезан", shot:"застрелен", strangled:"задушен", pushed_road:"толкнули на дорогу", pushed_roof:"сбросили с крыши",
  beaten:"забит до смерти", poisoned:"отравлен", dismembered:"расчленён",
  pills:"наглотался таблеток", hanging:"повесился", wrist:"вскрыл вены", jumped:"прыгнул с крыши",
  cancer:"умер от рака", heart:"остановка сердца", stroke:"инсульт", coma:"умер в коме", dementia:"умер от деменции",
  ritual:"растерзан в ритуале", ghost:"умер от страха", thing:"забран существом", well:"затянут в колодец",
  meteor:"убит метеоритом", cow:"убит упавшей коровой", banana:"поскользнулся на банане",
  old_age:"естественная смерть", old_family:"умер в окружении семьи", old_alone:"умер в одиночестве", old_sleep:"умер во сне",
  dog:"загрызен собакой", snake:"укушен змеёй", shark:"съеден акулой",
  surgery:"умер на операции", wrong_med:"умер от неправильного лекарства",
  hospital_kill:"убит в психушке", anya_stab:"зарезан Аней", thing_take:"забран существом из подвала",
  lena_avenge:"убит защищая друга", psych_kill:"убит в психушке", pneumonia:"умер от пневмонии"
};

const QUESTIONS = [
  {q:"Сколько будет 7 умножить на 8?", correct:"56", wrong:["54","48","64"], subject:"математике"},
  {q:"Сколько букв в слове «молоко»?", correct:"6", wrong:["5","7","4"], subject:"русскому"},
  {q:"Столица Франции?", correct:"Париж", wrong:["Лондон","Берлин","Мадрид"], subject:"географии"},
  {q:"В каком году началась Великая Отечественная война?", correct:"1941", wrong:["1939","1945","1914"], subject:"истории"},
  {q:"Кто написал «Войну и мир»?", correct:"Толстой", wrong:["Достоевский","Пушкин","Чехов"], subject:"литературе"},
  {q:"Сколько будет 15 плюс 27?", correct:"42", wrong:["41","43","52"], subject:"математике"},
  {q:"Самая длинная река в мире?", correct:"Амазонка", wrong:["Нил","Волга","Енисей"], subject:"географии"}
];

function buildTeacherScene(){
  const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  const answers = [q.correct, ...q.wrong].sort(()=>Math.random()-0.5);
  return {
    bg:"school", text:`Марина Павловна стучит указкой по доске. В классе двадцать три человека. Все смотрят в журнал.\n\n«${state.name}», — говорит она, не поднимая глаз. «К доске».\n\nКласс затихает. Кто-то хихикает. У тебя потеют ладони. Вопрос по ${q.subject}: ${q.q}`,
    choices: answers.map(a => ({ text: a, effects: ()=>{ if(a === q.correct){ setMental(+1); setRel("teacher", +1); } else { setMental(-2); state.guilt += 1; } }, next: a === q.correct ? "teacher_correct" : "teacher_wrong" }))
  };
}

let scenes = {};
function initScenes(){
return {
first_day_school: { bg:"school", text:`1 сентября 2015. Тебе 7 лет и 5 месяцев.\n\nМать держит тебя за руку крепче, чем нужно. Её ладонь влажная. У ворот школы — толпа детей. Кто-то плачет, кто-то смеётся. Учительница в очках держит табличку «1-Б».\n\nМать приседает перед тобой. Поправляет воротник, хотя он в порядке. «${state.name}, — говорит она тихо, — если что — беги домой. Понял${g("","а")}?»`,
  choices:[
    {text:`«Понял${g("","а")}»`, next:"first_day_inside", after:`Она целует тебя в макушку. От неё пахнет утренним кофе и чем-то ещё — тревогой.\n\nОна уходит. Ты стоишь у ворот один. Сердце стучит где-то в горле. Кто-то толкает тебя в спину, и ты делаешь шаг вперёд.`},
    {text:"«Я не боюсь»", effects:()=>{setMental(+1);}, next:"first_day_inside", after:`Она улыбается — впервые за долгое время. В этой улыбке усталость и что-то похожее на гордость.\n\n«Молодец. Иди». Ты идёшь. Не оглядываешься.`},
    {text:"Заплакать", effects:()=>{setMental(-1);}, next:"first_day_inside", after:`Она вытирает тебе слёзы большим пальцем. «Всё будет хорошо. Иди». Голос дрожит.\n\nТы идёшь, оглядываясь. Она стоит и смотрит, пока ты не исчезаешь в дверях.`}
  ]},
first_day_inside: { bg:"corridor", text:`Коридор пахнет краской и чужими куртками. Ты не знаешь, куда идти.\n\nУ окна — скамейка. На ней сидит ${fGender()} с ${fHair()} и большим рюкзаком. ${fHeCap()} грызёт сушку. Рядом — рассыпаны крошки. ${fHeCap()} поднимает голову и смотрит на тебя.`,
  choices:[
    {text:"Подойти и сесть рядом", next:"friend_first_meeting", after:`Ты подходишь. Садишься на другой конец скамейки. ${fHeCap()} молчит секунду, отламывает половину сушки и протягивает тебе, не глядя.\n\n«Держи. Ты ${g("новенький","новенькая")}, да?»`},
    {text:"Пройти мимо", effects:()=>{setMental(-1);}, next:"first_day_alone", after:`Ты идёшь дальше. Чувствуешь взгляд в спину. У поворота оборачиваешься — ${fHe()} всё ещё смотрит.`},
    {text:"Спросить, где класс", next:"friend_first_meeting", after:`Ты подходишь ближе. «Слушай, ты не знаешь, где 1-Б?»\n\n${fHeCap()} улыбается. У ${fE()} не хватает одного зуба — верхнего, слева. «Я ${F()}. Я тоже в 1-Б. Садись».`}
  ]},
friend_first_meeting: { bg:"corridor", text:`${fHeCap()} смотрит на тебя внимательно, как будто оценивает.\n\n«Я ${F()}. А тебя как зовут?»`,
  choices:[
    {text:`«${state.name}»`, effects:()=>{setRel("lena",+3);state.flags.lena_friend=true;state.flags.lena_met=true;}, next:"friend_first_friends", after:`«${state.name}».\n\n— «Красивое имя. У меня была кошка с таким именем. Только она убежала». Ты смеёшься. ${fHeCap()} тоже. Первый раз за утро тебе не страшно.`},
    {text:"«Неважно»", effects:()=>{setRel("lena",-1);}, next:"first_day_alone", after:`${fHeCap()} пожимает плечами. «Ладно». Отворачивается, откусывает сушку, больше не смотрит.`}
  ]},
friend_first_friends: { bg:"corridor", text:`Прозвенел звонок — резкий, дребезжащий. ${F()} вскакивает, отряхивает крошки с колен.\n\n«Пошли, а то опоздаем. Марина Павловна злая, когда опаздывают. Она указкой стучит по столу — бам-бам-бам — и все вздрагивают».\n\n${fHeCap()} хватает тебя за руку и тащит по коридору.`, next:"first_day_class"},
first_day_class: { bg:"school", text:`Класс. Одиннадцать детей. Белые стены, доска с мелом, запах мокрой тряпки.\n\nУчительница — высокая, в очках, с указкой. Она оглядывает тебя поверх очков.\n\n«${g("Новенький","Новенькая")}? Садись с ${F()}. ${fHeCap()} у нас... разговорчив${fA()}». Класс смеётся. ${F()} показывает язык — кому-то конкретному, в третьем ряду.`,
  choices:[
    {text:`Улыбнуться ${F()}`, effects:()=>{setRel("lena",+1);}, next:"first_day_after", after:`Ты садишься рядом. Парта пахнет стружкой — кто-то только что что-то вырезал.\n\n${F()} шепчет: «Не бойся её. Она только кричит. У неё дома кот умер, вот она и злая». Первый урок начинается.`},
    {text:"Сесть тихо", effects:()=>{}, next:"first_day_after", after:`Ты садишься рядом. Молча. Смотришь в окно. За окном — тополь, роняет листья.\n\n${F()} что-то рисует в тетради. Через минуту пододвигает к тебе — это смешная рожица с усами, похожая на Марину Павловну. Ты прыскаешь.`}
  ]},
first_day_after: { bg:"school", text:`Последний урок закончился. Дети вываливаются из класса с криками.\n\n${F()} ждёт тебя у скамейки, где вы познакомились. Рюкзак у ${fE()} ног, ${fHair()} растрёпаны.\n\n«Ну что, — говорит ${fHe()}, — ты как? Первый день — самый страшный. Дальше легче».`,
  choices:[
    {text:"«Спасибо, что помог${fA()}»", effects:()=>{setRel("lena",+2);}, next:"next_day", after:`${fHeCap()} машет рукой. «Да ладно. Мне скучно было, а тут ты».\n\nВы расходитесь. Дома мать спросит, как всё прошло. Ты скажешь: «Нормально». И впервые за долгое время это будет правда.`},
    {text:"«Как тебя зовут?»", next:"next_day", after:`${fHeCap()} закатывает глаза. «${F()}. Я тебе уже говорил${fA()}. Ты забыл${g("","а")}?»\n\nТы краснеешь. ${fHeCap()} смеётся, легко, необидно. «Ладно. Я тоже забываю. У меня память как у рыбки».`},
    {text:"«А ты всегда тут сидишь?»", next:"next_day", after:`${fHeCap()} кивает. «Каждый день. С первого класса. Тут хорошее место — видно всех, а тебя не видно».\n\nТы задумываешься над этим. Дома весь вечер ты думаешь об этом.`}
  ]},
first_day_alone: { bg:"school", text:`Ты идёшь по коридору один. Урок уже начался.\n\nПрисаживаешься на подоконник. Так проходит час. Потом ещё один. Тебя находят.`, next:"next_day"},
home_age6: { bg:"home", time:"evening", when:()=>!flag("home_seen"), text:`${fmtDate()}.\n\nДома тихо. Мать на кухне — слышно, как гремит посудой. Отец не вернулся с работы — третий вечер подряд.\n\nИз подвала доносится шорох. Будто кто-то перебирает старые вещи. Но в подвале нет вещей — только пустые полки и мокрое пятно на полу, которое никогда не высыхает.`,
  choices:[
    {text:"Пойти в подвал", effects:()=>{state.fear+=2;state.flags.basement_seen=true;state.flags.home_seen=true;}, next:"basement_age6", after:`Скрип ступеней — вторая сверху всегда скрипит громче. Света нет. Шорох прекращается, как только ты делаешь шаг.\n\nТеперь тишина стала громче.`},
    {text:"Спрятаться под одеяло", effects:()=>{state.fear+=1;setRel("mother",+1);state.flags.home_seen=true;}, next:"home_night_age6", after:`Забираешься под одеяло с головой. Шорох не прекращается. Он будто подстраивается под дыхание.\n\nТы засыпаешь под него.`},
    {text:"Позвать мать", effects:()=>{setRel("mother",+2);state.flags.home_seen=true;}, next:"mother_kitchen_age6", after:`Ты идёшь на кухню. Мать оборачивается — руки в муке, глаза уставшие, улыбка натянутая.\n\n«Что, милый?»`}
  ]},
basement_age6: { bg:"basement", text:`Темно. Пахнет сыростью и чем-то ещё — сладковатым, как испорченное варенье.\n\nЧто-то шевелится в углу. Ты не можешь разглядеть.`,
  choices:[
    {text:"Подойти ближе", effects:()=>{state.fear+=4;}, next:"basement_thing_age6", after:`Ты делаешь шаг. Потом ещё. Пол холодный даже через носки.`},
    {text:"Бежать наверх", effects:()=>{state.fear+=1;}, next:"home_night_age6"},
    {text:"Замереть", effects:()=>{state.fear+=2;}, next:"basement_wait"}
  ]},
basement_wait: { bg:"basement", text:`Ты стоишь. Не дышишь. Шорох стихает.\n\nИ тогда ты слышишь голос — тихий, детский. Свой собственный, но будто из другой комнаты.\n\n«Не уходи. Мне скучно».`,
  choices:[
    {text:"«Кто ты?»", effects:()=>{state.fear+=3;}, next:"basement_answer_age6"},
    {text:"Убежать", effects:()=>{setMental(-1);}, next:"home_night_age6"}
  ]},
basement_thing_age6: { bg:"basement", text:`Оно смотрит. У него нет лица — но ты знаешь: оно улыбается.\n\nКак ты это знаешь? Ты не можешь объяснить.`,
  choices:[
    {text:"Спросить «кто ты?»", effects:()=>{state.fear+=5;}, next:"basement_answer_age6", after:`Ты шепчешь. Оно отвечает.`},
    {text:"Ударить", effects:()=>{state.karma-=3;die("thing_take",6);}},
    {text:"Обнять", effects:()=>{state.flags.hugged_it=true;setMental(-3);}, next:"next_day", after:`Ты обнимаешь. Оно холодное. Как лёд. Ты не понимаешь, зачем это делаешь.`}
  ]},
basement_answer_age6: { bg:"basement", text:`«Я — то, что останется, когда все уйдут».\n\nГолос тихий. Спокойный. Как будто говорит о погоде.`, next:"home_night_age6"},
mother_kitchen_age6: { bg:"home", text:`Мать обнимает. От неё пахнет мукой и потом.\n\n«Всё хорошо, милый». Она врёт. Ты чувствуешь это. Но не говоришь.`,
  choices:[
    {text:"Поверить", effects:()=>{setRel("mother",+2);}, next:"home_night_age6"},
    {text:"Спросить про подвал", effects:()=>{state.fear+=2;setRel("mother",-1);}, next:"mother_lies_age6", after:`Ты спрашиваешь. Она отворачивается к раковине.`}
  ]},
mother_lies_age6: { bg:"home", text:`«Там ничего нет». Её руки дрожат над раковиной. Она моет одну и ту же тарелку третий раз.`, next:"home_night_age6"},
home_night_age6: { bg:"home", text:`Ночь. Ты не спишь. Слышишь шаги на лестнице — медленные, тяжёлые.`,
  choices:[
    {text:"Выйти в коридор", effects:()=>{state.fear+=3;}, next:"stairs_age6"},
    {text:"Закрыть глаза", effects:()=>{state.fear+=1;}, next:"next_day"}
  ]},
stairs_age6: { bg:"home", text:`На лестнице никого. Но на верхней ступеньке — мокрый след. Босой. Маленький. Как у ребёнка.`, next:"next_day"},
thing_event_1: { bg:"home", text:`Прошло несколько месяцев. ${fmtDate()}.\n\nНочью просыпаешься от холода. Одеяло сброшено на пол. В углу комнаты — тень. Слишком густая. Не как от шкафа.`,
  choices:[
    {text:"Смотреть", effects:()=>{state.fear+=3;}, next:"next_day", after:`Тень не двигается. Но ты чувствуешь: она смотрит в ответ.\n\nУтром на полу — мокрый след, ведущий к двери подвала.`},
    {text:"Закрыть глаза", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Позвать мать", effects:()=>{setRel("mother",+1);}, next:"thing_warn_1"}
  ]},
thing_warn_1: { bg:"home", text:`Мать приходит, включает свет. Она в халате, волосы растрёпаны.\n\nСадится на край кровати. «Что ты видел${g("","а")}?»`,
  choices:[
    {text:"Рассказать правду", effects:()=>{setRel("mother",+1);}, next:"next_day", after:`Ты рассказываешь — про тень, про холод, про след.\n\nОна молчит. Долго. Потом говорит: «Не говори отцу. Он не поймёт». И уходит, закрыв за собой дверь неплотно.`},
    {text:"Соврать", effects:()=>{setRel("mother",-1);}, next:"next_day"}
  ]},
thing_event_2: { bg:"home", text:`Ещё через полгода. ${fmtDate()}.\n\nТы находишь в подвале старую фотографию — в углу за полкой, затянутую паутиной. На ней — семья. Не твоя. У всех стёрты лица, будто кто-то долго тёр их пальцем.`,
  choices:[
    {text:"Взять себе", effects:()=>{state.fear+=2;}, next:"next_day", after:`Прячешь под матрас. Ночью фото оказывается на подушке — лицом вверх.\n\nТы не брал${g("","а")} его.`},
    {text:"Показать матери", next:"thing_warn_2", after:`Мать берёт фото. Долго смотрит — слишком долго. Потом бросает в огонь на плите.\n\n«Не трогай больше ничего в подвале». Голос не дрожит. Но руки — да.`},
    {text:"Сжечь самому", effects:()=>{state.fear-=1;}, next:"next_day"}
  ]},
thing_warn_2: { bg:"home", text:`Мать стоит у окна. За стеклом — сумерки, фонарь, кто-то идёт по улице.\n\n«Ты давно видишь… его?» — спрашивает она, не оборачиваясь.`,
  choices:[
    {text:"«Да. С шести лет»", effects:()=>{state.flags.mother_believes=true;}, next:"next_day", after:`Она оборачивается. В её глазах страх — не за себя.\n\nЗа тебя. «Я знала. Я надеялась, оно выберет меня».`},
    {text:"«Нет. Просто фото»", next:"next_day", after:`Она выдыхает. Ты видишь, как напряжение уходит из её плеч.\n\nТы только что остал${g("ся","ась")} один${g("","а")}.`}
  ]},
thing_event_3: { bg:"basement", text:`Проходит почти год. ${fmtDate()}.\n\nТы спускаешься в подвал за банкой варенья. На стене — новая надпись. Свежая краска, капает на пол.\n\n«ОН РАСТЁТ».`,
  choices:[
    {text:"Сфотографировать", next:"next_day", after:`Ты щёлкаешь телефоном. На снимке — пустая стена. Надпись видна только глазами.`},
    {text:"Показать отцу", effects:()=>{setRel("father",-1);}, next:"thing_warn_father", after:`Отец спускается. Смотрит на стену. Долго. Потом трогает краску пальцем, нюхает.\n\n«Какая надпись? Тут ничего нет». Уходит. Ты стоишь перед пустой стеной.`},
    {text:"Стереть", effects:()=>{state.fear+=2;}, next:"next_day", after:`Ты трёшь её рукавом. Краска не стирается.\n\nУтром надпись другая: «ТЫ ТОЖЕ».`}
  ]},
thing_warn_father: { bg:"home", text:`Отец сидит на кухне. Перед ним — стакан, наполовину пустой. Смотрит на тебя.\n\n«Мать говорит, ты видишь вещи».`,
  choices:[
    {text:"Рассказать всё", effects:()=>{if(flag("mother_believes"))state.flags.father_believes=true;}, next:"next_day", after:`Ты рассказываешь — про подвал, про тень, про надписи.\n\nОн долго молчит. Потом: «Завтра я спущусь сам». Он не спускается. Никогда.`},
    {text:"Отпереться", effects:()=>{setRel("father",-2);}, next:"next_day"}
  ]},
thing_event_4: { bg:"home", text:`${fmtDate()}.\n\nНочью слышишь крик. Мать стоит в коридоре. Перед ней — дверь подвала. Открытая.\n\nОна не двигается. Смотрит внутрь.`,
  choices:[
    {text:"Закрыть дверь", effects:()=>{state.fear+=3;setRel("mother",+2);}, next:"next_day", after:`Ты захлопываешь дверь. Мать приходит в себя. «Спасибо», — шепчет она.\n\nБольше она не смеётся над «тенью».`},
    {text:"Заглянуть внутрь", effects:()=>{state.fear+=5;setMental(-2);}, next:"thing_face", after:`В темноте — глаза. Не два. Больше. Смотрят снизу вверх, как ребёнок на родителя.`},
    {text:"Разбудить отца", effects:()=>{}, next:"next_day", after:`Отец ворчит, но идёт. Закрывает дверь. Утром замок сломан.`}
  ]},
thing_face: { bg:"basement", text:`Не тень. Существо. Сидит на нижней ступеньке.\n\nУ него твоё лицо — но взрослое.`,
  choices:[
    {text:"«Что тебе надо?»", effects:()=>{state.fear+=3;}, next:"thing_answer"},
    {text:"Убежать", effects:()=>{setMental(-2);}, next:"next_day"}
  ]},
thing_answer: { bg:"basement", text:`«Тебя. Когда останешься один${g("","а")}. Твои родители… они мешают».`,
  choices:[
    {text:"«Не тронь их»", effects:()=>{state.fear+=2;}, next:"next_day", after:`«Тогда защити их. Если сможешь». Оно исчезает.\n\nТы больше не запираешь дверь.`},
    {text:"Молчать", effects:()=>{setMental(-3);}, next:"next_day"}
  ]},
thing_event_5: { bg:"home", text:`${fmtDate()}.\n\nПросыпаешься от тишины. Слишком тихо.\n\nДом пустой. Мать и отец не вернулись. Их вещи на месте.`,
  choices:[
    {text:"Искать их", effects:()=>{state.fear+=5;}, next:"thing_parents_gone", after:`Ищешь везде. В подвале — открытая дверь.\n\nВнутри — два силуэта в углу. Слишком тихие.`},
    {text:"Позвонить в полицию", effects:()=>{state.flags.orphan=true;}, next:"orphan_home", after:`Полиция приезжает. Ничего не находят.\n\nТебя забирают в детский дом.`}
  ]},
thing_parents_gone: { bg:"basement", text:`Два тела. Мать и отец. Держатся за руки.\n\nНа стене надпись: «ТЕПЕРЬ ТЫ СВОБОДЕН».`,
  choices:[
    {text:"Крикнуть", effects:()=>{state.flags.orphan=true;setMental(-5);}, next:"orphan_home", after:`Ты кричишь. Никто не приходит.\n\nК утру соседи вызывают полицию.`},
    {text:"Взять что-то на память", effects:()=>{state.flags.orphan=true;setMental(-3);}, next:"orphan_home", after:`Ты берёшь мамино кольцо. Оно холодное.\n\nТебя забирают. Ты не плачешь.`}
  ]},
thing_beg_move: { bg:"home", text:`${fmtDate()}.\n\nТы стоишь в дверях кухни. Мать чистит картошку, отец читает газету. Обычный вечер.\n\nТы набираешь воздуха. «Давайте переедем. На соседнюю улицу. Пожалуйста».`,
  when:()=>state.thingLevel >= 3 && !flag("moved"),
  choices:[
    {text:"Рассказать всё", effects:()=>{
      if(flag("mother_believes") && (flag("father_believes") || state.thingLevel >= 4)){
        state.flags.moved = true; setRel("mother", +3); setRel("father", +2); return "moved_success";
      } else {
        state.flags.moveAttempts = (state.flags.moveAttempts||0) + 1; setRel("father", -2); return "thing_move_refused";
      }
    }},
    {text:"Просто попросить", effects:()=>{setRel("father",-1);state.flags.moveAttempts=(state.flags.moveAttempts||0)+1;}, next:"thing_move_refused", after:`«Просто так. Хочу». Отец поднимает глаза. «С чего вдруг?» Ты не отвечаешь.`},
    {text:"Промолчать", effects:()=>{}, next:"next_day"}
  ]},
thing_move_refused: { bg:"home", text:`Отец откладывает газету. Смотрит на тебя — не зло, устало.\n\n«${state.name}. У нас нет денег на переезд. И даже если бы были — с чего вдруг? Из-за твоих фантазий?»\n\nМать молчит. Она всегда молчит, когда он так говорит.`,
  choices:[
    {text:"Настаивать", effects:()=>{setRel("father",-2);setMental(-1);}, next:"next_day", after:`Ты настаиваешь. Отец повышает голос. Мать уходит в комнату.\n\nНочью ты слышишь, как они ругаются. Из-за тебя.`},
    {text:"Уйти", effects:()=>{setMental(-1);}, next:"next_day"}
  ]},
moved_success: { bg:"street", text:`${fmtDate()}.\n\nЧерез две недели вы переезжаете. Соседняя улица, старый дом, но другой. Светлее.\n\nПервую ночь ты спишь без снов. Впервые за много лет.`,
  choices:[
    {text:"Осмотреться", next:"next_day", after:`Ты обходишь дом. Нет подвала — только кладовка, сухая и тёплая.\n\nТы стоишь в ней минуту. Слушаешь. Ничего.`},
    {text:"Поблагодарить мать", effects:()=>{setRel("mother",+2);}, next:"next_day", after:`Ты обнимаешь её. Она гладит тебя по голове. «Всё, милый. Всё».`}
  ]},
orphan_home: { bg:"orphanage", text:`${fmtDate()}. Тебе ${state.age}.\n\nДетский дом. Восемь детей в комнате. Воспитательница: «${state.name}, вот твоя койка».`,
  choices:[{text:"Лечь", effects:()=>{setMental(-1);}, next:"next_day"},{text:"Осмотреться", effects:()=>{state.fear+=1;}, next:"next_day"}]
},
orphan_bully: { bg:"orphanage", text:`${fmtDate()}. Старшие заперли тебя в чулане. «Посиди, пока не заплачешь».`,
  choices:[{text:"Плакать", effects:()=>{setMental(-2);}, next:"next_day"},{text:"Молчать", effects:()=>{setMental(-1);}, next:"next_day"},{text:"Сломать дверь", effects:()=>{if(state.stamina>6)state.stamina-=3;else die("beaten",state.age);}, next:"next_day"}]
},
orphan_adoption: { bg:"orphanage", text:`${fmtDate()}. Приехала пара. Взгляд останавливается на тебе. «Этот${g("","ая")}?»`,
  choices:[{text:"Улыбнуться", effects:()=>{state.flags.orphan=false;setMental(+2);}, next:"next_day", after:`Ты улыбаешься. Через неделю уезжаешь. В новую жизнь.`},{text:"Отвернуться", effects:()=>{setMental(-1);}, next:"next_day"},{text:"«А вы не умрёте?»", effects:()=>{setMental(-2);if(Math.random()<.5)state.flags.orphan=false;}, next:"next_day"}]
},
teacher_correct: { bg:"school", text:`Марина Павловна кивает. «Правильно. Садись». Класс молчит.\n\nКто-то смотрит с уважением. Ты возвращаешься на место. ${F()} шепчет: «Молодец».`,
  choices:[{text:`Улыбнуться ${F()}`, effects:()=>{setRel("lena",+1);}, next:"next_day"},{text:"Сесть молча", effects:()=>{}, next:"next_day"}]
},
teacher_wrong: { bg:"school", text:`Класс взрывается смехом.\n\n«Двоечник!» — кричит Дима с задней парты. Учительница стучит указкой: «Тихо!» Но смех ещё звенит в ушах.\n\nТы возвращаешься на место. ${F()} смотрит в пол.`,
  choices:[{text:"Сесть молча", effects:()=>{setMental(-1);}, next:"next_day"},{text:"Крикнуть на класс", effects:()=>{setMental(-1);state.karma-=2;}, next:"next_day", after:`Ты кричишь. Смех стихает. Дима поднимает брови: «Псих».`},{text:"Улыбнуться", effects:()=>{setMental(+1);}, next:"next_day", after:`Ты улыбаешься. Искренне. Смех стихает. Кто-то говорит: «Странный ${g("он","она")}».`}]
},
neighbor_bab_valya: { bg:"neighbor", text:`${fmtDate()}.\n\nТы возвращаешься из школы. У подъезда сидит соседка — баба Валя. Старая, в платке, с клюкой.\n\nОна смотрит на тебя долго. Потом машет рукой: «Подойди».`,
  when:()=>state.age>=7 && state.age<=14 && !flag("bab_valya_met") && !flag("orphan") && !flag("moved"),
  choices:[{text:"Подойти", effects:()=>{state.flags.bab_valya_met=true;}, next:"bab_valya_talk", after:`Ты подходишь. Она пахнет валидолом и старым деревом.`},{text:"Пройти мимо", effects:()=>{}, next:"next_day"}]
},
bab_valya_talk: { bg:"neighbor", text:`Она берёт тебя за руку. Её пальцы сухие, как бумага.\n\n«Ты из квартиры четырнадцать? Из той, где подвал?» Ты киваешь. Она вздыхает.\n\n«Я тут живу шестьдесят лет. До вас там жила семья. Тоже с ребёнком. Мальчик был. Хороший. А потом…» Она замолкает.`,
  choices:[{text:"«Что потом?»", effects:()=>{state.fear+=2;}, next:"bab_valya_warning", after:`Она долго смотрит в сторону. «А потом они съехали. Втроём не съехали, а вдвоём. Мальчика не стало».`},{text:"«Не хочу знать»", effects:()=>{setMental(-1);}, next:"next_day", after:`Она кивает. «Правильно. Не хочешь — не слушай».`}]
},
bab_valya_warning: { bg:"neighbor", text:`Она наклоняется ближе. Голос шёпотом.\n\n«Если услышишь его — не отвечай. Не зови. И матери скажи, чтоб съезжали. Пока не поздно».`, next:"next_day"},
dima_bully: { bg:"school", when:()=>state.age>=8 && state.age<=14 && !flag("dima_met"), text:`${fmtDate()}.\n\nДима — самый высокий в классе. Он подходит к твоей парте на перемене, кладёт ладонь на твой учебник.\n\n«${g("Новенький","Новенькая")}. Ты чё так${g("ой","ая")} тих${g("ой","ая")}?»`,
  choices:[{text:"Молчать", effects:()=>{setMental(-1);state.flags.dima_met=true;}, next:"next_day", after:`Ты молчишь. Он смеётся, забирает учебник, уходит.`},{text:"«Отойди»", effects:()=>{state.flags.dima_met=true;state.karma-=1;}, next:"dima_fight", after:`Ты говоришь это тихо, но твёрдо. Он поднимает брови. «Чё?»`},{text:`Позвать ${F()}`, effects:()=>{state.flags.dima_met=true;if(flag("lena_friend"))setRel("lena",+1);}, next:"next_day", after:`Ты оборачиваешься. «${F()}». ${fHeCap()} уже встаёт.\n\nДима смотрит на ${fE()} — и почему-то отходит.`}]
},
dima_fight: { bg:"school", text:`Он толкает тебя в плечо. Не сильно — проверяет.\n\n«Чё сказал${g("","а")}?»`,
  choices:[{text:"Толкнуть в ответ", effects:()=>{state.karma-=3;if(state.stamina>5)state.stamina-=2;else die("beaten",state.age);}, next:"next_day", after:`Ты толкаешь. Он падает на парту. Класс ахает.`},{text:"Отступить", effects:()=>{setMental(-1);}, next:"next_day"}]
},
school_age12: { bg:"school", when:()=>!flag("school_age12_seen"), text:`${fmtDate()}.\n\nТебе двенадцать. Пятый класс. Новый классный руководитель, новые предметы. И Аня — тихая девочка с длинными волосами. Она сидит одна у окна. Её никто не любит. Ты не знаешь почему.\n\nМарина Павловна смотрит выжидающе: куда сядешь?`,
  choices:[{text:"Сесть с Аней", effects:()=>{setRel("anya",+2);state.flags.school_age12_seen=true;}, next:"school_anya_friend", after:`Аня удивлённо поднимает брови. «Ты уверен${g("","а")}?» — шёпотом. Ты киваешь.\n\nВесь урок она молчит. В конце говорит: «Спасибо». Не уточняет за что.`},{text:"Сесть с другими", effects:()=>{setRel("anya",-1);state.flags.school_age12_seen=true;}, next:"school_crowd", after:`Ты садишься к популярным. Они обсуждают кого-то шёпотом. Ты понимаешь — это Аня.`},{text:"Сесть одному", effects:()=>{state.flags.loner=true;state.flags.school_age12_seen=true;}, next:"school_alone", after:`Ты садишься сзади. В отражении окна — кто-то позади. Оборачиваешься. Пусто.`}]
},
school_anya_friend: { bg:"school", text:`Аня улыбается. Вы говорите весь урок — о книгах, о кошках, о чём-то ещё.\n\nОна умная. Почему её никто не любит?`,
  choices:[{text:"Пригласить гулять", effects:()=>{setRel("anya",+3);}, next:"street_age12"},{text:"Молчать", effects:()=>{setRel("anya",+1);}, next:"next_day"}]
},

old_age_loop: { bg:"home", text:`${fmtDate()}. Ещё год.`, choices:[{text:"Продолжать", effects:()=>{ if(state.age<75) return "old_75"; if(state.age<80) return "old_80"; die("old_age",state.age); return null; }},{text:"Закончить", effects:()=>{die("pills",state.age);}}]},
birthday_kid: { bg:"home", when:()=>state.age<12, text:`28 ноября. Тебе ${state.age}.\n\nТорт на столе.`, choices:[{text:"Задуть свечи", effects:()=>{setMental(+2);}, next:"next_day"},{text:`Позвать ${F()}`, when:()=>flag("lena_friend"), effects:()=>{setRel("lena",+1);}, next:"next_day"}]},
birthday_teen: { bg:"home", when:()=>state.age>=12&&state.age<19, text:`28 ноября. Тебе ${state.age}.`, choices:[{text:"С семьёй", effects:()=>{setRel("mother",+1);setMental(+1);}, next:"next_day"},{text:"Вечеринку", effects:()=>{setMental(+2);}, next:"next_day"}]},
birthday_adult: { bg:"home", when:()=>state.age>=19&&state.age<65, text:`28 ноября. Тебе ${state.age}.`, choices:[{text:"С близкими", effects:()=>{setMental(+2);}, next:"next_day"},{text:"Работать", effects:()=>{setMental(-1);}, next:"next_day"}]},
birthday_old: { bg:"home", when:()=>state.age>=65, text:`28 ноября. Тебе ${state.age}.`, choices:[{text:"Принять гостей", effects:()=>{if(rel("child")>=3||rel("lena")>=5)setMental(+2);else setMental(-1);}, next:"next_day"},{text:"Побыть одному", effects:()=>{setMental(-1);}, next:"next_day"}]},
dementia_crisis: { bg:"home", text:`${fmtDate()}. Ты не помнишь, как сюда попал${g("","а")}.`, choices:[{text:"Позвонить ребёнку", effects:()=>{if(rel("child")>=3)setMental(+1);else setMental(-2);}, next:"next_day"},{text:"Выйти на улицу", effects:()=>{if(Math.random()<.3)die("lost",state.age);setMental(-2);}, next:"next_day"}]},
dementia_aggression: { bg:"home", text:`${fmtDate()}. Кто-то трогает твои вещи.`, choices:[{text:"Ударить", effects:()=>{state.karma-=5;if(Math.random()<.3){state.flags.killed_someone=true;state.flags.killed_ever=true;}}, next:"next_day"},{text:"Крикнуть", effects:()=>{setMental(-2);}, next:"next_day"}]},
psych_ward: { bg:"psych", text:`${fmtDate()}. Тебя забрали.`, choices:[{text:"Сотрудничать", effects:()=>{setMental(-2);}, next:"next_day"},{text:"Бунтовать", effects:()=>{setMental(-3);if(Math.random()<.5)die("psych_kill",state.age);}, next:"next_day"},{text:"Притвориться здоровым", effects:()=>{if(state.mental>=6){state.flags.psych_ward=false;state.flags.psych_kill_done=true;state.flags.psych_healthy=true;setMental(+2);}else setMental(-2);}, next:"next_day"}]
},
psych_ward_loop: { bg:"psych", text:`${fmtDate()}. День в палате.`, choices:[{text:"Смириться", effects:()=>{}, next:"next_day"},{text:"Побег", effects:()=>{if(state.stamina>5&&Math.random()<.2){state.flags.psych_ward=false;state.flags.psych_escaped=true;state.flags.psych_kill_done=true;setMental(+1);return "psych_escape_success";}else setMental(-1);}, next:"next_day"}]
},
psych_final_choice: { bg:"psych", text:`${fmtDate()}. Прошло двенадцать дней.`, choices:[{text:"Остаться. Пройти лечение", next:"psych_treatment_result", after:`Ты ложишься обратно.`},{text:"Сбежать", effects:()=>{ if(Math.random() < 0.5){ state.flags.psych_ward = false; state.flags.psych_escaped = true; state.flags.psych_kill_done = true; setMental(+2); return "psych_escape_success"; } else { state.flags.psych_start_day = state.day; state.flags.psych_extra = (state.flags.psych_extra||0) + 1; setMental(-3); return "psych_escape_fail"; } }}]
},
psych_treatment_result: { bg:"psych", text:`Кабинет. Ремни. Аппарат.`, choices:[{text:"Считать", effects:()=>{ if(Math.random()*100 < 5){ die("psych_kill", state.age, "персонал"); return null; } else { state.flags.psych_ward = false; state.flags.psych_healthy = true; state.flags.psych_kill_done = true; state.flags.killed_someone = false; setMental(+4); return "psych_healthy_exit"; } }}]
},
psych_escape_success: { bg:"street", text:`Ты бежишь босиком.`, choices:[{text:"Обнять мать", effects:()=>{setRel("mother",+3);setMental(+2);state.flags.killed_someone=false;}, next:"next_day"},{text:"Молча войти", effects:()=>{state.flags.killed_someone=false;}, next:"next_day"}]
},
psych_escape_fail: { bg:"psych", text:`Тебя поймали.`, choices:[{text:"Смириться", effects:()=>{}, next:"next_day"},{text:"Кричать", effects:()=>{setMental(-2);}, next:"next_day"}]
},
psych_healthy_exit: { bg:"hospital", text:`Ты просыпаешься в обычной больнице. Врач: «Ты здоров${g("","а")}».`, choices:[{text:"Встать", effects:()=>{setMental(+3);}, next:"next_day"},{text:"Полежать", effects:()=>{setMental(+1);}, next:"next_day"}]
},
low_mental_glances: { bg:"street", text:`${fmtDate()}.\n\n${glance()}Прохожие смотрят косо.`, choices:[{text:"Игнорировать", effects:()=>{setMental(-1);}, next:"next_day"},{text:"Улыбнуться", effects:()=>{setMental(+1);}, next:"next_day"}]
},
neutral_dinner: { bg:"home", time:"evening", text:`${fmtDate()}. Вечер. На кухне пахнет едой.`, choices:[{text:"Молча есть", next:"next_day"},{text:"Поговорить", effects:()=>{setRel("mother",+2);}, next:"next_day", after:`Мать слушает.`}]
},
neutral_weather: { bg:"street", time:"morning", text:`${fmtDate()}.\n\n${isRaining() ? "На улице дождь." : "Светит солнце."}`, choices:[{text:"Пойти гулять", effects:()=>{setMental(+1);}, next:"next_day"},{text:"Остаться дома", next:"next_day"}]
},
neutral_empty_day: { bg:"home", text:`${fmtDate()}.\n\nДень прошёл спокойно.`, choices:[{text:"Дальше", next:"next_day"}]},
event_anya_revenge: { bg:"corridor_night", when:()=>rel("anya")<-3&&flag("grudge"), text:`${fmtDate()}. Она в конце коридора. В руке — нож.`, choices:[{text:"Подойти", effects:()=>{playSfx("glitch");die("anya_stab",state.age,"anya");}},{text:"Бежать", effects:()=>{if(state.stamina>5)schedule(30,"anya_revenge");else die("anya_stab",state.age,"anya");}, next:"next_day"},{text:"Крикнуть", effects:()=>{die("anya_stab",state.age,"anya");}}]
},
day_start: { bg:"home", text:`Новый день.`, choices:[{text:"Продолжить", next:"next_day"}]}
};
}

const POOL_7_MORNING = ["morning_school", "morning_weekend"];
const POOL_7_DAY = ["neutral_weather", "story_find_thing", "dima_bully", "school_bully_age12"];
const POOL_7_EVENING = ["neutral_dinner", "home_age6", "neutral_evening_tv"];
const POOL_12_MORNING = ["morning_school", "morning_weekend"];
const POOL_12_DAY = ["neutral_weather", "dima_bully", "school_age12", "school_corridor_age13"];
const POOL_12_EVENING = ["neutral_dinner", "lena_neutral_food", "lena_neutral_dream"];
const POOL_16_MORNING = ["morning_school", "morning_weekend"];
const POOL_16_DAY = ["neutral_weather", "club_age16", "forest_age17", "lena_needs_help_age14", "lena_protect_serious_age15"];
const POOL_16_EVENING = ["neutral_dinner", "lena_neutral_food"];
const POOL_19 = ["uni_age19", "love_age20", "alcohol_age19", "accident_age22", "job_age22", "uni_meet"];
const POOL_23 = ["career_age25", "marriage_age28", "child_birth_age30", "midlife_age40"];
const POOL_35 = ["family_age35", "parents_die_age45", "health_age50", "divorce_age52"];
const POOL_50 = ["health_age50", "dementia_aggression", "divorce_age52"];
const POOL_65 = ["old_age65", "old_75", "old_80", "dementia_crisis"];
const ORPHAN_POOL = ["orphan_bully", "orphan_adoption"];

function getPool(){
  const a = state.age;
  if(a<12){
    if(flag("home_seen") || flag("basement_seen")) return ["neutral_dinner","neutral_weather","neighbor_bab_valya","dima_bully","school_anya_friend","first_day_after","lena_neutral_food"];
    if(state.timeOfDay === "morning") return POOL_7_MORNING;
    if(state.timeOfDay === "day") return POOL_7_DAY;
    return POOL_7_EVENING;
  }
  if(a<16){
    if(state.timeOfDay === "morning") return POOL_12_MORNING;
    if(state.timeOfDay === "day") return POOL_12_DAY;
    return POOL_12_EVENING;
  }
  if(a<19){
    if(state.timeOfDay === "morning") return POOL_16_MORNING;
    if(state.timeOfDay === "day") return POOL_16_DAY;
    return POOL_16_EVENING;
  }
  if(a<23) return POOL_19;
  if(a<35) return POOL_23;
  if(a<50) return POOL_35;
  if(a<65) return POOL_50;
  return POOL_65;
}

const app = document.getElementById("app");
function shake(){ const el = document.querySelector(".scene") || app; el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),800); }
function die(cause, atAge, killer=null){ state.deathCause = DEATHS[cause] || cause; state.deathAge = atAge; state.killer = killer; showDeath(); }
function buildEpilogue(){
  const parts = [`Ты ${g("умер","умерла")} в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  const r = n => state.relations[n] ?? 0;
  if(state.killer && r(state.killer)<=-5) parts.push("Это сделал тот, кого ты когда-то обидел.");
  if(r("mother")>=5) parts.push("Мать не пережила. Она приходила на могилу каждый день.");
  else if(r("mother")<=-3) parts.push("Мать узнала слишком поздно. Она даже не пришла.");
  if(r("anya")>=3) parts.push("Аня пришла на похороны. Она плакала.");
  else if(r("anya")<=-5) parts.push("Аня не пришла. Она знала, что так будет.");
  if(r("lena")>=5) parts.push(`${F()} был${fA()} рядом до конца.`);
  else if(r("lena")<=-5) parts.push(`${F()} не приш${fA()}. Ты сам${g("","а")} оттолкнул${g("","а")}.`);
  if(r("uni")>=5) parts.push(`${U()} был${uA()} рядом до конца.`);
  if(r("child")>=3) parts.push("Твой ребёнок держал тебя за руку.");
  if(state.mental<=2) parts.push("Психика была разрушена задолго до конца.");
  if(flag("kind")) parts.push(`Кто-то вспомнил, что ты был${g("","а")} добр${g("","а")}.`);
  if(flag("mother_believes")) parts.push("Мать верила тебе. До конца.");
  if(flag("moved")) parts.push("Вы переехали. И оно не пошло за вами.");
  if(flag("psych_healthy")) parts.push("Ты вышел из психушки здоровым. Но помнил всё.");
  if(flag("psych_escaped")) parts.push("Ты сбежал. Они так и не нашли тебя.");
  if(flag("psych_ward")&&!flag("psych_healthy")&&!flag("psych_escaped")) parts.push("Тебя держали в психушке. Ты умер там.");
  if(flag("killed_ever")) parts.push("Ты убил человека. Это осталось с тобой.");
  if(flag("lena_dead")) parts.push(`${F()} умер, защищая тебя.`);
  if(flag("lena_left")) parts.push(`${F()} отвернулся от тебя.`);
  if(state.guilt>5) parts.push("Последнее, что ты чувствовал — вина.");
  if(state.fear>10) parts.push("Последнее, что ты чувствовал — страх.");
  const key=[state.deathCause,state.deathAge,state.killer||"-",flag("kind")?"k":"-",flag("moved")?"m":"-",flag("lena_dead")?"ld":"-",flag("lena_left")?"ll":"-",flag("married_lena")?"ml":"-",flag("married_uni")?"mu":"-",flag("psych_healthy")?"ph":"-",flag("psych_escaped")?"pe":"-",flag("killed_ever")?"ks":"-",state.mental<=2?"m2":"-"].join("_");
  state.seenEndings.add(key);
  return parts.join(" ");
}
function showDeath(){
  const ep = buildEpilogue();
  playSfx("heartbeat");
  app.classList.add("fade-out");
  setTimeout(()=>{ app.innerHTML=`<div class="death-screen"><p>${ep}</p><p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge} · ${fmtDate()}</p><button id="restart">Начать заново</button></div>`; document.getElementById("restart").onclick=()=>location.reload(); app.classList.remove("fade-out"); },150);
}
function playScene(id){
  if(id==="next_day"||id==="auto_day") return advanceDay();
  let scene = scenes[id];
  if(!scene){ state.flags._skipCount = (state.flags._skipCount || 0) + 1; if(state.flags._skipCount > 3){ state.flags._skipCount = 0; return render({bg:"home",text:`${fmtDate()}.\n\nДень прошёл спокойно.`,choices:[{text:"Дальше", next:"next_day"}]}); } return advanceDay(); }
  state.flags._skipCount = 0;
  if(typeof scene === "function") scene = scene();
  const due = checkTimers(); if(due.length && !id.startsWith("event_")) return playScene("event_"+due[0].event);
  if(scene.when && !scene.when()) return playScene("next_day");
  if(flag("killed_someone") && !flag("psych_ward") && !flag("psych_checked") && !flag("psych_escaped") && !flag("psych_healthy") && !flag("psych_kill_done")){ state.flags.psych_checked = true; state.flags.psych_ward = true; state.flags.psych_start_day = state.day; setMental(-5); return playScene("psych_ward"); }
  if(flag("orphan") && !flag("orphan_done") && !id.startsWith("orphan_")){ state.flags.orphan_done = true; return playScene("orphan_home"); }
  render(scene);
}
function render(scene){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    const timeStr = state.timeOfDay === "morning" ? "Утро" : state.timeOfDay === "day" ? "День" : "Вечер";
    app.innerHTML=`<div class="scene"><div class="scene-inner"><div class="status"><span>${state.name}</span><span>${fmtDate()} · ${state.age} лет · ${timeStr}</span><span class="${mentClass}">${starStr(state.mental)}</span></div><p class="text">${scene.text}</p><div class="choices"></div></div></div>`;
    const sceneEl = app.querySelector(".scene"); sceneEl.style.background = BG[scene.bg] || BG.home;
    const box = app.querySelector(".choices");
    if(scene.choices){
      scene.choices.forEach(c=>{ if(c.when && !c.when()) return; const b = document.createElement("button"); b.textContent = c.text; b.onclick = ()=>{ getCtx(); const jumpTo = c.effects?.(); if(state.deathCause) return; if(c.after){ showAfter(c.after, jumpTo || c.next || "next_day"); return; } playScene(jumpTo || c.next || "next_day"); }; box.appendChild(b); });
    } else { const b = document.createElement("button"); b.textContent = "Дальше"; b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");}; box.appendChild(b); }
    app.classList.remove("fade-out");
  },150);
}
function showAfter(text, next){
  app.classList.add("fade-out");
  setTimeout(()=>{ app.innerHTML = `<div class="scene"><div class="scene-inner"><div class="status"><span>${state.name}</span><span>${fmtDate()} · ${state.age} лет</span></div><p class="text after-text">${text}</p><div class="choices"><button id="contBtn">Дальше</button></div></div></div>`; document.getElementById("contBtn").onclick = ()=>{ app.classList.remove("fade-out"); playScene(next); }; app.classList.remove("fade-out"); },150);
}
function advanceDay(){
  if(state.timeOfDay === "morning"){ state.timeOfDay = "day"; return autoDay(); }
  if(state.timeOfDay === "day"){ state.timeOfDay = "evening"; return autoDay(); }
  state.timeOfDay = "morning"; state.d += 1;
  if(Math.random() < 0.1) state.flags.weather_rain = true; else state.flags.weather_rain = false;
  const dim = new Date(state.y, state.m, 0).getDate(); if(state.d > dim){ state.d = 1; state.m += 1; } if(state.m > 12){ state.m = 1; state.y += 1; }
  state.day += 1;
  if(state.m === 11 && state.d === 28 && !state.flags["_bd_"+state.y]){ state.flags["_bd_"+state.y] = true; state.age += 1; return playScene("birthday_kid"); }
  if(state.day > 0 && state.day % 7 === 0 && !flag("story_thing_started") && !flag("psych_ward")) { state.d += 6; return playScene("skip_week"); }
  autoDay();
}
function autoDay(){
  if(flag("psych_ward") && !flag("psych_kill_done")){ if(state.day % 5 === 0) return playScene("psych_final_choice"); return playScene("psych_ward_loop"); }
  if(flag("orphan") && !flag("adopted") && !flag("orphan_free")){ if(!flag("orphan_intro_done")){ state.flags.orphan_intro_done = true; return playScene("orphan_home"); } return playScene(pickScene(ORPHAN_POOL)); }
  if(flag("grudge") && rel("anya")<-3 && state.age>=16 && state.age<45 && !flag("revenge_done")){ state.flags.revenge_done = true; return playScene("event_anya_revenge"); }
  if(state.thingLevel >= 3 && !flag("moved") && !flag("move_shown_"+state.thingLevel)){ state.flags["move_shown_"+state.thingLevel] = true; if(Math.random() < .4) return playScene("thing_beg_move"); }
  if(flag("lena_friend") && !flag("lena_dead") && !flag("lena_left") && rel("lena")>=5 && state.age>=18 && !flag("lena_romance") && !flag("married") && !flag("partner") && (state.day - (state.flags._romanceCooldown || 0) > 30)){ state.flags._romanceCooldown = state.day; return playScene("lena_romance_start"); }
  if(flag("lena_romance") && !flag("married_lena") && state.age>=20 && rel("lena")>=7 && !flag("lena_proposal_seen") && Math.random()<.4 && (state.day - (state.flags._proposalCooldown || 0) > 60)){ state.flags._proposalCooldown = state.day; state.flags.lena_proposal_seen = true; return playScene("lena_proposal"); }
  if((flag("married_lena") || flag("married_uni")) && !flag("first_night_done") && Math.random()<.4){ return playScene("first_night"); }
  if((flag("married_lena") || flag("married_uni")) && !flag("child") && state.age>=22 && !flag("child_seen") && Math.random()<.25){ state.flags.child_seen = true; return playScene("child_talk"); }
  if((flag("married_lena") || flag("married_uni")) && flag("child") && Math.random()<.3){ return playScene("family_life"); }
  if((flag("lena_dead") || flag("lena_left") || rel("lena")<3 || !flag("lena_friend")) && !flag("uni_friend") && state.age>=18 && !flag("married") && !flag("partner") && (state.day - (state.flags._uniCooldown || 0) > 20)){ if(Math.random() < .5){ state.flags._uniCooldown = state.day; return playScene("uni_meet"); } }
  if(flag("uni_friend") && !flag("uni_romance") && state.age>=19 && rel("uni")>=5 && !flag("married") && !flag("partner") && (state.day - (state.flags._uniRomanceCooldown || 0) > 30)){ state.flags._uniRomanceCooldown = state.day; return playScene("uni_romance_start"); }
  if(flag("uni_romance") && !flag("married_uni") && state.age>=20 && rel("uni")>=7 && !flag("uni_proposal_seen") && Math.random()<.4 && (state.day - (state.flags._uniProposalCooldown || 0) > 60)){ state.flags._uniProposalCooldown = state.day; state.flags.uni_proposal_seen = true; return playScene("uni_proposal"); }
  if(state.age>=65){ if(!flag("old_done")){state.flags.old_done=true;return playScene("old_age65");} return playScene("old_age_loop"); }
  if(lowMentalActive() && !flag("low_mental_seen") && Math.random()<.3){ state.flags.low_mental_seen = true; return playScene("low_mental_glances"); }
  playScene(pickScene(getPool()));
}
function startScreen(){
  app.innerHTML = `<div class="scene"><div class="scene-inner"><div class="status"><span>Новая жизнь · 2015 год</span></div><p class="text">Как тебя зовут?</p><input id="nameInput" class="name-input" maxlength="20" placeholder="Имя"><div class="choices"><button id="btnOk">Дальше</button></div></div></div>`;
  const input = document.getElementById("nameInput"); input.focus();
  const go = () => { const v = input.value.trim(); if(v.length < 1) return; state.name = v; genderScreen(); };
  document.getElementById("btnOk").onclick = go; input.onkeydown = e => { if(e.key === "Enter") go(); };
}
function genderScreen(){
  app.innerHTML = `<div class="scene"><div class="scene-inner"><div class="status"><span>Имя: ${state.name}</span></div><p class="text">Ты девочка или мальчик?</p><div class="choices"><button data-g="girl">Девочка</button><button data-g="boy">Мальчик</button></div></div></div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{ b.onclick = ()=>{ state.gender = b.dataset.g; scenes = initScenes(); scenes.skip_week = { bg: "home", text: "Прошла неделя...\n\nНичего важного не случилось.", choices: [{text: "Дальше", next: "next_day"}] }; playScene("first_day_school"); }; });
}
startScreen();
</script>
