<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a0a0a;color:#ddd;font-family:'Courier New',monospace;min-height:100vh}
  #app{min-height:100vh;transition:opacity .2s ease}
  #app.fade-out{opacity:0}
  .scene{position:relative;min-height:100vh;padding:4rem 2rem;background:#111 center/cover no-repeat;animation:fadeIn .3s ease}
  .scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:0}
  .scene>*{position:relative;z-index:1}
  .scene-inner{max-width:720px;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .text{font-size:1.15rem;line-height:1.7;margin-bottom:1rem;min-height:3em;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:pre-line}
  .after-text{font-size:1.05rem;line-height:1.75;color:#c8c8c8;font-style:italic;white-space:pre-line}
  .status{font-size:.85rem;color:#888;margin-bottom:1.5rem;letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:.6rem}
  .status .low{color:#c33}
  .status .high{color:#3c3}
  .reputation-bar{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:#888;margin-bottom:1.2rem}
  .rep-track{flex:1;height:8px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;overflow:hidden}
  .rep-fill{height:100%;background:#555;transition:width .4s,background .4s}
  .rep-fill.rep-low{background:#8a2222}
  .rep-fill.rep-mid{background:#8a6a2a}
  .rep-fill.rep-high{background:#2a8a3a}
  .choices button{display:block;width:100%;margin:.5rem 0;padding:.85rem 1.1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:1rem;text-align:left;transition:background .2s,transform .1s,border-color .2s}
  .choices button:hover{background:rgba(40,40,40,.95);transform:translateX(4px);border-color:#555}
  .name-input{width:100%;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;font-family:inherit;font-size:1.1rem;margin-bottom:1rem}
  .name-input:focus{outline:none;border-color:#666}
  .death-screen{min-height:100vh;padding:6rem 2rem;text-align:center;max-width:720px;margin:0 auto;animation:fadeIn .5s ease;display:flex;flex-direction:column;justify-content:center}
  .counter{color:#666;font-size:.9rem;margin-top:2rem}
  .death-screen button{margin:2rem auto 0;padding:.8rem 2rem;background:transparent;color:#eee;border:1px solid #555;cursor:pointer;font-family:inherit;font-size:1rem}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px)}}
  .shake{animation:shake .25s 3}

function seeded(seed){
  let x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function makeSeed(){
  state.dailySeed = state.day * 7919 + state.y * 104729 + state.m * 1299709 + state.d * 15485863 + (state.scenePlayCount._extra||0) * 31;
  state.scenePlayCount._extra = (state.scenePlayCount._extra||0) + 1;
  return state.dailySeed;
}

function pickScene(pool){
  const valid = pool.filter(id => {
    const s = scenes[id];
    if(!s) return false;
    if(typeof s === "function") return true;
    if(s.when && !s.when()) return false;
    return true;
  });
  if(!valid.length) return null;

  const recent = state.recentScenes;
  const limit = Math.min(12, Math.max(3, valid.length - 1));
  const recentSlice = recent.slice(-limit);

  const avail = valid.filter(id => !recentSlice.includes(id));
  const src = avail.length ? avail : valid;

  const seed = makeSeed();
  const idx = Math.floor(seeded(seed) * src.length);
  const pick = src[Math.min(idx, src.length - 1)];

  state.recentScenes.push(pick);
  if(state.recentScenes.length > 24) state.recentScenes.shift();
  return pick;
}

function pickMontage(){
  const avail = MONTAGE.filter(m => !state.usedMontage[m]);
  const pool = avail.length ? avail : MONTAGE.filter(m => !state.recentMontage.includes(m));
  const src = pool.length ? pool : MONTAGE;
  const idx = Math.floor(seeded(state.dailySeed + 9999) * src.length);
  const pick = src[Math.min(idx, src.length - 1)];
  state.usedMontage[pick] = true;
  state.recentMontage.push(pick);
  if(state.recentMontage.length > 8) state.recentMontage.shift();
  return pick;
}

let audioCtx=null;
const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){
  try{
    const ctx=getCtx();
    if(ctx.state==="suspended")ctx.resume();
    if(name==="glitch"){
      const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=ctx.createBufferSource();s.buffer=buf;
      const gn=ctx.createGain();
      gn.gain.setValueAtTime(.4,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
      s.connect(gn).connect(ctx.destination);s.start();
    }
    if(name==="heartbeat"){
      const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain();
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15);
        gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25);
      };
      const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35);
    }
  }catch(e){}
}

function buildTeacherScene(){
  const seed = makeSeed();
  const qi = Math.floor(seeded(seed) * QUESTIONS.length);
  const q = QUESTIONS[qi];
  const answers = [q.correct, ...q.wrong].sort((a,b)=>{
    return seeded(seed + a.charCodeAt(0)) - 0.5;
  });
  return {
    bg:"school",
    text:`Марина Павловна стучит указкой по доске. В классе двадцать три человека. Все смотрят в журнал.\n\n— ${state.name}. К доске.\n\nКласс затихает. Кто-то хихикает. У тебя потеют ладони.\n\n— Вопрос по ${q.subject}: ${q.q}`,
    choices: answers.map(a => ({
      text: a,
      effects: ()=>{
        if(a === q.correct){ setMental(+1); setRel("teacher", +1); setRep(+1); }
        else { setMental(-1); state.guilt += 1; setRep(-1); }
      },
      next: a === q.correct ? "teacher_correct" : "teacher_wrong",
    }))
  };
}

dogs_escaped_shout: { bg:"street", text:`Ты разворачиваешься и кричишь.\n\nВожак останавливается. Смотрит.\n\nПотом садится. Вся стая садится.\n\nИ они просто смотрят, как ты уходишь.`,
  next:"next_day"},

dogs_rescue: { bg:"street", when:()=>flag("dogs_friendly") && !flag("dogs_rescue_done"),
  text:`Двое незнакомых парней преграждают тебе путь. Один — с ножом.\n\n— Телефон. Быстро.\n\nТы слышишь, как за спиной кто-то рычит.`,
  choices:[
    {text:"Позвать собак.", effects:()=>{state.flags.dogs_rescue_done=true;setMental(+2);setRep(+2);}, next:"dogs_rescue_happens",
     after:`Ты свистишь.\n\nСтая выходит из-за гаражей. Вожак становится между тобой и парнями.`},
    {text:"Отдать телефон.", effects:()=>{state.flags.dogs_rescue_done=true;setMental(-1);setRep(-1);}, next:"next_day",
     after:`Ты отдаёшь телефон. Они уходят.\n\nСобаки смотрят им вслед. Но не двигаются.`},
  ]},

dogs_rescue_happens: { bg:"street", text:`Собаки окружают парней. Не бросаются. Просто стоят. Рычат тихо.\n\nВожак смотрит прямо на нож.\n\nЧерез минуту парни уходят. Быстро.\n\nВожак оборачивается к тебе. Ложится у твоих ног.`,
  next:"next_day"},

neighbor_dog_lover: { bg:"neighbor", when:()=>!flag("dog_lover_met"),
  text:`У подъезда сидит старик. Рядом — пожилая овчарка. Он кормит её с ладони.\n\n— Собаки — они всё помнят, — говорит он, не поднимая головы. — И добро, и зло. Ты это запомни.`,
  choices:[
    {text:"Спросить про собак.", effects:()=>{state.flags.dog_lover_met=true;}, next:"dog_lover_talk",
     after:`Он поднимает глаза.\n\n— Если тебя когда-нибудь обидят — иди к ним. Они почувствуют.`},
    {text:"Погладить овчарку.", effects:()=>{state.flags.dog_lover_met=true;setMental(+1);}, next:"next_day",
     after:`Овчарка лижет тебе руку.\n\nСтарик улыбается:\n\n— Она тебя приняла.`},
    {text:"Пройти мимо.", effects:()=>{state.flags.dog_lover_met=true;}, next:"next_day"},
  ]},

dog_lover_talk: { bg:"neighbor", text:`— В моё время у меня было двенадцать собак. Всех помню по имени. И они меня помнят. Там, где сейчас.\n\nОн гладит овчарку по голове.`,
  next:"next_day"},

stray_kitten: { bg:"street", when:()=>!flag("kitten_found") && state.age>=6,
  text:`В подвале под твоим домом мяукает котёнок. Он маленький, мокрый и дрожит.`,
  choices:[
    {text:"Взять домой.", effects:()=>{state.flags.kitten_found=true;state.flags.has_cat=true;setMental(+2);setRel("mother",-1);setRep(+1);}, next:"kitten_home",
     after:`Ты несёшь его домой за пазухой.\n\nМать вздыхает. Но не выгоняет.`},
    {text:"Покормить.", effects:()=>{state.flags.kitten_found=true;setMental(+1);}, next:"next_day",
     after:`Ты приносишь ему хлеба. Он ест жадно, давясь.`},
    {text:"Пройти мимо.", effects:()=>{state.flags.kitten_found=true;setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

kitten_home: { bg:"home", text:`Котёнок сидит на твоей кровати. Он ещё дрожит. Но уже мурлычет.\n\nТы гладишь его.\n\nВпервые за долгое время в доме тихо. По-хорошему тихо.`,
  next:"next_day"},

fire_stairs: { bg:"corridor_night", when:()=>!flag("fire_seen") && state.age>=8 && state.age<=50,
  text:`Ночью ты просыпаешься от запаха дыма.\n\nДым идёт снизу. Из подвала.`,
  choices:[
    {text:"Бежать на улицу.", effects:()=>{state.flags.fire_seen=true;setMental(-2);}, next:"next_day",
     after:`Ты выбегаешь на улицу. Соседи уже собрались. Пожарные приехали через десять минут.\n\nПодвал выгорел. Больше никто не слышит оттуда шорох.`},
    {text:"Разбудить мать.", effects:()=>{state.flags.fire_seen=true;setRel("mother",+2);setRep(+2);if(seeded(makeSeed())<0.15)die("fire",state.age);}, next:"next_day",
     after:`Ты будишь мать. Она вытаскивает тебя на улицу в одной рубашке.\n\nДом стоит. Подвал выгорел.`},
    {text:"Спуститься в подвал.", effects:()=>{state.flags.fire_seen=true;if(seeded(makeSeed())<0.6)die("fire",state.age);}, next:"fire_basement",
     after:`Ты идёшь вниз по лестнице. Дым режет глаза.`},
  ]},

fire_basement: { bg:"basement", text:`Внизу — огонь. И в огне кто-то стоит. Смотрит на тебя.\n\nОно не горит.`,
  choices:[
    {text:"Смотреть.", effects:()=>{setMental(-3);state.fear+=5;}, next:"next_day"},
    {text:"Убежать.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

street_accident: { bg:"road", when:()=>!flag("accident_seen") && state.age>=10,
  text:`На перекрёстке визжат тормоза. Машина сбивает человека.\n\nОн лежит на асфальте. Никто не подходит.`,
  choices:[
    {text:"Вызвать скорую.", effects:()=>{state.flags.accident_seen=true;setMental(-1);state.karma+=2;setRep(+2);}, next:"next_day",
     after:`Ты звонишь. Диспетчер задаёт вопросы. Ты отвечаешь.\n\nЧерез неделю ты узнаёшь: он выжил.`},
    {text:"Подойти.", effects:()=>{state.flags.accident_seen=true;setMental(-2);setRep(+1);}, next:"next_day",
     after:`Ты подходишь. Он ещё дышит. Ты держишь его за руку, пока не приезжает скорая.\n\nОн смотрит на тебя. Не говорит ничего.`},
    {text:"Пройти мимо.", effects:()=>{state.flags.accident_seen=true;setMental(-2);state.karma-=2;setRep(-2);}, next:"next_day"},
  ]},

found_money: { bg:"street", when:()=>!flag("money_found"),
  text:`На тротуаре лежит кошелёк. Толстый.\n\nВнутри — деньги и чья-то фотография.`,
  choices:[
    {text:"Отнести в полицию.", effects:()=>{state.flags.money_found=true;state.karma+=3;setMental(+1);setRep(+2);}, next:"next_day",
     after:`В отделении дежурный записывает.\n\n— Хорошо, что принёс.`},
    {text:"Оставить себе.", effects:()=>{state.flags.money_found=true;state.karma-=3;state.flags.rich=(state.flags.rich||0)+1;setRep(-2);}, next:"next_day",
     after:`Ты прячешь кошелёк. Дома пересчитываешь. Хватает на несколько недель.\n\nНо фотографию ты не выбрасываешь.`},
    {text:"Найти хозяина.", effects:()=>{state.flags.money_found=true;state.karma+=2;setMental(+1);setRep(+1);}, next:"next_day",
     after:`Ты идёшь по адресу на фотографии.\n\nОткрывает старуха. Плачет.`},
  ]},

yard_well: { bg:"street", when:()=>!flag("yard_well_seen") && state.age>=8,
  text:`Во дворе — старый колодец. Заколочен досками. Доски сгнили.\n\nКто-то из детей говорит:\n\n— Там на дне — клад.`,
  choices:[
    {text:"Заглянуть.", effects:()=>{state.flags.yard_well_seen=true;state.fear+=3;}, next:"yard_well_look",
     after:`Ты снимаешь доску.\n\nВнизу — темнота. И что-то блестит.`},
    {text:"Не подходить.", effects:()=>{state.flags.yard_well_seen=true;}, next:"next_day"},
    {text:"Бросить камень.", effects:()=>{state.flags.yard_well_seen=true;if(seeded(makeSeed())<0.4)die("well",state.age);}, next:"next_day",
     after:`Ты бросаешь камень. Долго нет звука. Потом — всплеск.\n\nТы отходишь.`},
  ]},

yard_well_look: { bg:"street", text:`На дне — вода. И в воде — отражение.\n\nНе твоё.`,
  next:"next_day"},

school_trip: { bg:"forest", when:()=>!flag("trip_seen") && state.age>=10 && state.age<=16,
  text:`Экскурсия в лес. Учительница ушла с группой вперёд. Ты отстал${g("","а")}.`,
  choices:[
    {text:"Догнать группу.", effects:()=>{state.flags.trip_seen=true;}, next:"next_day"},
    {text:"Идти одному.", effects:()=>{state.flags.trip_seen=true;state.fear+=2;}, next:"trip_alone",
     after:`Ты идёшь по тропе один. Через час выходишь к лагерю.`},
    {text:"Крикнуть.", effects:()=>{state.flags.trip_seen=true;if(seeded(makeSeed())<0.2)die("fall",state.age);}, next:"next_day",
     after:`Ты кричишь. Никто не отвечает. Но потом слышишь голоса. Группа вернулась.`},
  ]},

trip_alone: { bg:"forest", text:`Ты выходишь на поляну. На поляне — старый дом. Окна заколочены.\n\nИз дома кто-то смотрит.`,
  choices:[
    {text:"Подойти.", effects:()=>{state.fear+=4;}, next:"next_day"},
    {text:"Обойти.", effects:()=>{}, next:"next_day"},
  ]},

summer_job: { bg:"street", when:()=>!flag("summer_job_done") && state.age>=14 && state.age<=17,
  text:`Лето. Сосед предлагает подработку. Разгружать ящики на рынке. Платит немного, но честно.`,
  choices:[
    {text:"Согласиться.", effects:()=>{state.flags.summer_job_done=true;state.stamina+=1;state.flags.money=(state.flags.money||0)+1;setRep(+1);}, next:"next_day",
     after:`Ты работаешь весь июль. Руки в мозолях. Но деньги — свои.`},
    {text:"Отказаться.", effects:()=>{state.flags.summer_job_done=true;}, next:"next_day"},
  ]},

school_crush: { bg:"school", when:()=>!flag("school_crush_done") && state.age>=13 && state.age<=16,
  text:`На перемене к тебе подходит ${g("девочка","мальчик")} из параллельного класса. Улыбается.\n\n— Ты ведь ${state.name}? Я слышал${g("","а")}, ты хорошо рисуешь.`,
  choices:[
    {text:"Поговорить.", effects:()=>{state.flags.school_crush_done=true;setMental(+2);setRep(+1);}, next:"next_day",
     after:`Вы говорите всю перемену. Звонок прерывает.`},
    {text:"Уйти.", effects:()=>{state.flags.school_crush_done=true;setMental(-1);setRep(-1);}, next:"next_day"},
    {text:"Смутиться и убежать.", effects:()=>{state.flags.school_crush_done=true;setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

teen_rebellion: { bg:"home", when:()=>!flag("teen_rebellion_done") && state.age>=14 && state.age<=17,
  text:`Ты ссоришься с матерью. Из-за ерунды. Из-за того, что она вошла без стука.\n\n— Ты меня не понимаешь! — кричишь ты.`,
  choices:[
    {text:"Хлопнуть дверью.", effects:()=>{state.flags.teen_rebellion_done=true;setRel("mother",-2);setRep(-1);}, next:"next_day"},
    {text:"Извиниться.", effects:()=>{state.flags.teen_rebellion_done=true;setRel("mother",+2);setRep(+1);}, next:"next_day",
     after:`Ты возвращаешься.\n\n— Прости.\n\nОна кивает. Глаза красные.`},
    {text:"Уйти из дома.", effects:()=>{state.flags.teen_rebellion_done=true;if(seeded(makeSeed())<0.3)die("disappeared",state.age);}, next:"next_day",
     after:`Ты уходишь. Возвращаешься через три часа.\n\nМать сидит на кухне в темноте.`},
  ]},

home_age6: { bg:"home", when:()=>!flag("home_seen"), text:`Дома тихо. Мать на кухне — гремит посудой. Отец не вернулся с работы. Третий вечер подряд.\n\nИз подвала доносится шорох. Будто кто-то перебирает старые вещи.\n\nНо в подвале нет вещей. Только пустые полки и мокрое пятно на полу, которое никогда не высыхает.`,
  choices:[
    {text:"Пойти в подвал.", effects:()=>{state.fear+=2;state.flags.basement_seen=true;state.flags.home_seen=true;}, next:"basement_age6",
     after:`Скрип ступеней. Вторая сверху всегда скрипит громче.\n\nСвета нет. Шорох прекращается, как только ты делаешь шаг.\n\nТеперь тишина стала громче.`},
    {text:"Спрятаться под одеяло.", effects:()=>{state.fear+=1;setRel("mother",+1);state.flags.home_seen=true;}, next:"home_night_age6",
     after:`Забираешься под одеяло с головой.\n\nШорох не прекращается. Он будто подстраивается под дыхание.\n\nТы засыпаешь под него.`},
    {text:"Позвать мать.", effects:()=>{setRel("mother",+2);state.flags.home_seen=true;}, next:"mother_kitchen_age6",
     after:`Ты идёшь на кухню.\n\nМать оборачивается. Руки в муке. Глаза уставшие. Улыбка натянутая.\n\n— Что, милый?`},
  ]},

basement_age6: { bg:"basement", text:`Темно. Пахнет сыростью и чем-то ещё. Сладковатым. Как испорченное варенье.\n\nЧто-то шевелится в углу. Ты не можешь разглядеть.`,
  choices:[
    {text:"Подойти ближе.", effects:()=>{state.fear+=4;}, next:"basement_thing_age6", after:`Ты делаешь шаг. Потом ещё.\n\nПол холодный даже через носки.`},
    {text:"Бежать наверх.", effects:()=>{state.fear+=1;}, next:"home_night_age6"},
    {text:"Замереть.", effects:()=>{state.fear+=2;}, next:"basement_wait"},
  ]},

basement_wait: { bg:"basement", text:`Ты стоишь. Не дышишь. Шорох стихает.\n\nИ тогда ты слышишь голос. Тихий, детский. Свой собственный. Но будто из другой комнаты.\n\n— Не уходи. Мне скучно.`,
  choices:[
    {text:"— Кто ты?", effects:()=>{state.fear+=3;}, next:"basement_answer_age6"},
    {text:"Убежать.", effects:()=>{setMental(-1);}, next:"home_night_age6"},
  ]},

basement_thing_age6: { bg:"basement", text:`Оно смотрит. У него нет лица. Но ты знаешь: оно улыбается.\n\nКак ты это знаешь? Ты не можешь объяснить.`,
  choices:[
    {text:"— Кто ты?", effects:()=>{state.fear+=5;}, next:"basement_answer_age6", after:`Ты шепчешь. Оно отвечает.`},
    {text:"Ударить.", effects:()=>{state.karma-=3;die("thing_take",6);}},
    {text:"Обнять.", effects:()=>{state.flags.hugged_it=true;setMental(-2);}, next:"next_day",
     after:`Ты обнимаешь. Оно холодное. Как лёд.\n\nТы не понимаешь, зачем это делаешь.`},
  ]},

basement_answer_age6: { bg:"basement", text:`— Я — то, что останется, когда все уйдут.\n\nГолос тихий. Спокойный. Как будто говорит о погоде.`,
  next:"home_night_age6"},

mother_kitchen_age6: { bg:"home", text:`Мать обнимает. От неё пахнет мукой и потом.\n\n— Всё хорошо, милый.\n\nОна врёт. Ты чувствуешь это. Но не говоришь.`,
  choices:[
    {text:"Поверить.", effects:()=>{setRel("mother",+2);}, next:"home_night_age6"},
    {text:"Спросить про подвал.", effects:()=>{state.fear+=2;setRel("mother",-1);}, next:"mother_lies_age6",
     after:`Ты спрашиваешь. Она отворачивается к раковине.`},
  ]},

mother_lies_age6: { bg:"home", text:`— Там ничего нет.\n\nЕё руки дрожат над раковиной. Она моет одну и ту же тарелку третий раз.`,
  next:"home_night_age6"},

home_night_age6: { bg:"home", text:`Ночь. Ты не спишь.\n\nСлышишь шаги на лестнице. Медленные. Тяжёлые.`,
  choices:[
    {text:"Выйти в коридор.", effects:()=>{state.fear+=3;}, next:"stairs_age6"},
    {text:"Закрыть глаза.", effects:()=>{state.fear+=1;}, next:"next_day"},
  ]},

stairs_age6: { bg:"home", text:`На лестнице никого.\n\nНо на верхней ступеньке — мокрый след. Босой. Маленький.\n\nКак у ребёнка.`,
  next:"next_day"},

thing_event_1: { bg:"home", text:`Ночью просыпаешься от холода. Одеяло сброшено на пол.\n\nВ углу комнаты — тень. Слишком густая. Не как от шкафа.`,
  choices:[
    {text:"Смотреть.", effects:()=>{state.fear+=3;}, next:"next_day",
     after:`Тень не двигается. Но ты чувствуешь: она смотрит в ответ.\n\nУтром на полу — мокрый след, ведущий к двери подвала.`},
    {text:"Закрыть глаза.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Позвать мать.", effects:()=>{setRel("mother",+1);}, next:"thing_warn_1"},
  ]},

thing_warn_1: { bg:"home", text:`Мать приходит. Включает свет. Она в халате. Волосы растрёпаны.\n\nСадится на край кровати.\n\n— Что ты видел${g("","а")}?`,
  choices:[
    {text:"Рассказать правду.", effects:()=>{setRel("mother",+1);}, next:"next_day",
     after:`Ты рассказываешь. Про тень. Про холод. Про след.\n\nОна молчит. Долго.\n\nПотом говорит:\n\n— Не говори отцу. Он не поймёт.\n\nИ уходит. Закрыв за собой дверь неплотно.`},
    {text:"Соврать.", effects:()=>{setRel("mother",-1);}, next:"next_day"},
  ]},

thing_event_2: { bg:"home", text:`Ты находишь в подвале старую фотографию. В углу за полкой. Затянутую паутиной.\n\nНа ней — семья. Не твоя.\n\nУ всех стёрты лица. Будто кто-то долго тёр их пальцем.`,
  choices:[
    {text:"Взять себе.", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`Прячешь под матрас.\n\nНочью фото оказывается на подушке. Лицом вверх.\n\nТы не брал${g("","а")} его.`},
    {text:"Показать матери.", next:"thing_warn_2",
     after:`Мать берёт фото. Долго смотрит. Слишком долго.\n\nПотом бросает в огонь на плите.\n\n— Не трогай больше ничего в подвале.\n\nГолос не дрожит. Но руки — да.`},
    {text:"Сжечь самому.", effects:()=>{state.fear-=1;}, next:"next_day"},
  ]},

thing_warn_2: { bg:"home", text:`Мать стоит у окна. За стеклом — сумерки. Фонарь. Кто-то идёт по улице.\n\n— Ты давно видишь… его? — спрашивает она, не оборачиваясь.`,
  choices:[
    {text:"— Да. С шести лет.", effects:()=>{state.flags.mother_believes=true;}, next:"next_day",
     after:`Она оборачивается. В её глазах страх. Не за себя.\n\nЗа тебя.\n\n— Я знала. Я надеялась, оно выберет меня.`},
    {text:"— Нет. Просто фото.", next:"next_day",
     after:`Она выдыхает. Ты видишь, как напряжение уходит из её плеч.\n\nТы только что остал${g("ся","ась")} один${g("","а")}.`},
  ]},

thing_event_3: { bg:"basement", text:`Ты спускаешься в подвал за банкой варенья.\n\nНа стене — новая надпись. Свежая краска. Капает на пол.\n\n«ОН РАСТЁТ».`,
  choices:[
    {text:"Сфотографировать.", next:"next_day",
     after:`Ты щёлкаешь телефоном.\n\nНа снимке — пустая стена. Надпись видна только глазами.`},
    {text:"Показать отцу.", effects:()=>{setRel("father",-1);}, next:"thing_warn_father",
     after:`Отец спускается. Смотрит на стену. Долго.\n\nПотом трогает краску пальцем. Нюхает.\n\n— Какая надпись? Тут ничего нет.\n\nУходит. Ты стоишь перед пустой стеной.`},
    {text:"Стереть.", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`Ты трёшь её рукавом. Краска не стирается.\n\nУтром надпись другая:\n\n«ТЫ ТОЖЕ».`},
  ]},

thing_warn_father: { bg:"home", text:`Отец сидит на кухне. Перед ним — стакан. Наполовину пустой.\n\nСмотрит на тебя.\n\n— Мать говорит, ты видишь вещи.`,
  choices:[
    {text:"Рассказать всё.", effects:()=>{if(flag("mother_believes"))state.flags.father_believes=true;}, next:"next_day",
     after:`Ты рассказываешь. Про подвал. Про тень. Про надписи.\n\nОн долго молчит. Потом:\n\n— Завтра я спущусь сам.\n\nОн не спускается. Никогда.`},
    {text:"Отпереться.", effects:()=>{setRel("father",-2);}, next:"next_day"},
  ]},

thing_event_4: { bg:"home", text:`Ночью слышишь крик.\n\nМать стоит в коридоре. Перед ней — дверь подвала. Открытая.\n\nОна не двигается. Смотрит внутрь.`,
  choices:[
    {text:"Закрыть дверь.", effects:()=>{state.fear+=3;setRel("mother",+2);}, next:"next_day",
     after:`Ты захлопываешь дверь.\n\nМать приходит в себя.\n\n— Спасибо, — шепчет она.\n\nБольше она не смеётся над «тенью».`},
    {text:"Заглянуть внутрь.", effects:()=>{state.fear+=5;setMental(-2);}, next:"thing_face",
     after:`В темноте — глаза. Не два. Больше.\n\nСмотрят снизу вверх. Как ребёнок на родителя.`},
    {text:"Разбудить отца.", effects:()=>{}, next:"next_day",
     after:`Отец ворчит. Но идёт. Закрывает дверь.\n\nУтром замок сломан.`},
  ]},

thing_face: { bg:"basement", text:`Не тень. Существо. Сидит на нижней ступеньке.\n\nУ него твоё лицо. Но взрослое.`,
  choices:[
    {text:"— Что тебе надо?", effects:()=>{state.fear+=3;}, next:"thing_answer"},
    {text:"Убежать.", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

thing_answer: { bg:"basement", text:`— Тебя. Когда останешься один${g("","а")}.\n\nТвои родители… они мешают.`,
  choices:[
    {text:"— Не тронь их.", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`— Тогда защити их. Если сможешь.\n\nОно исчезает.\n\nТы больше не запираешь дверь.`},
    {text:"Молчать.", effects:()=>{setMental(-3);}, next:"next_day"},
  ]},

thing_event_5: { bg:"home", text:`Просыпаешься от тишины. Слишком тихо.\n\nДом пустой. Мать и отец не вернулись. Их вещи на месте.`,
  choices:[
    {text:"Искать их.", effects:()=>{state.fear+=5;}, next:"thing_parents_gone",
     after:`Ищешь везде. В подвале — открытая дверь.\n\nВнутри — два силуэта в углу. Слишком тихие.`},
    {text:"Позвонить в полицию.", effects:()=>{state.flags.orphan=true;}, next:"orphan_home",
     after:`Полиция приезжает. Ничего не находят.\n\nТебя забирают в детский дом.`},
  ]},

thing_parents_gone: { bg:"basement", text:`Два тела. Мать и отец. Держатся за руки.\n\nНа стене надпись:\n\n«ТЕПЕРЬ ТЫ СВОБОДЕН».`,
  choices:[
    {text:"Крикнуть.", effects:()=>{state.flags.orphan=true;setMental(-5);}, next:"orphan_home",
     after:`Ты кричишь. Никто не приходит.\n\nК утру соседи вызывают полицию.`},
    {text:"Взять что-то на память.", effects:()=>{state.flags.orphan=true;setMental(-3);}, next:"orphan_home",
     after:`Ты берёшь мамино кольцо. Оно холодное.\n\nТебя забирают. Ты не плачешь.`},
  ]},

thing_beg_move: { bg:"home", text:`Ты стоишь в дверях кухни. Мать чистит картошку. Отец читает газету.\n\nОбычный вечер.\n\nТы набираешь воздуха.\n\n— Давайте переедем. На соседнюю улицу. Пожалуйста.`,
  when:()=>state.thingLevel >= 3 && !flag("moved"),
  choices:[
    {text:"Рассказать всё.", effects:()=>{
      if(flag("mother_believes") && (flag("father_believes") || state.thingLevel >= 4)){
        state.flags.moved = true;
        setRel("mother", +3); setRel("father", +2);
        return "moved_success";
      } else {
        state.flags.moveAttempts = (state.flags.moveAttempts||0) + 1;
        setRel("father", -2);
        return "thing_move_refused";
      }
    }},
    {text:"Просто попросить.", effects:()=>{setRel("father",-1);state.flags.moveAttempts=(state.flags.moveAttempts||0)+1;}, next:"thing_move_refused",
     after:`— Просто так. Хочу.\n\nОтец поднимает глаза.\n\n— С чего вдруг?\n\nТы не отвечаешь.`},
    {text:"Промолчать.", effects:()=>{}, next:"next_day"},
  ]},

thing_move_refused: { bg:"home", text:`Отец откладывает газету. Смотрит на тебя. Не зло. Устало.\n\n— ${state.name}. У нас нет денег на переезд. И даже если бы были — с чего вдруг? Из-за твоих фантазий?\n\nМать молчит. Она всегда молчит, когда он так говорит.`,
  choices:[
    {text:"Настаивать.", effects:()=>{setRel("father",-2);setMental(-1);}, next:"next_day",
     after:`Ты настаиваешь. Отец повышает голос. Мать уходит в комнату.\n\nНочью ты слышишь, как они ругаются. Из-за тебя.`},
    {text:"Уйти.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

moved_success: { bg:"street", text:`Через две недели вы переезжаете. Соседняя улица. Старый дом. Но другой. Светлее.\n\nПервую ночь ты спишь без снов. Впервые за много лет.`,
  choices:[
    {text:"Осмотреться.", next:"next_day",
     after:`Ты обходишь дом. Нет подвала. Только кладовка. Сухая и тёплая.\n\nТы стоишь в ней минуту. Слушаешь.\n\nНичего.`},
    {text:"Поблагодарить мать.", effects:()=>{setRel("mother",+2);}, next:"next_day",
     after:`Ты обнимаешь её. Она гладит тебя по голове.\n\n— Всё, милый. Всё.`},
  ]},

orphan_home: { bg:"orphanage", text:`Детский дом. Восемь детей в комнате.\n\nВоспитательница:\n\n— ${state.name}, вот твоя койка.`,
  choices:[
    {text:"Лечь.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Осмотреться.", effects:()=>{state.fear+=1;}, next:"next_day"},
  ]},

orphan_bully: { bg:"orphanage", text:`Старшие заперли тебя в чулане.\n\n— Посиди, пока не заплачешь.`,
  choices:[
    {text:"Плакать.", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Молчать.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Сломать дверь.", effects:()=>{if(state.stamina>6)state.stamina-=3;else die("beaten",state.age);}, next:"next_day"},
  ]},

orphan_adoption: { bg:"orphanage", text:`Приехала пара. Взгляд останавливается на тебе.\n\n— Этот${g("","ая")}?`,
  choices:[
    {text:"Улыбнуться.", effects:()=>{state.flags.orphan=false;setMental(+2);setRep(+1);}, next:"next_day",
     after:`Ты улыбаешься. Через неделю уезжаешь. В новую жизнь.`},
    {text:"Отвернуться.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"— А вы не умрёте?", effects:()=>{setMental(-2);if(seeded(makeSeed())<0.5)state.flags.orphan=false;}, next:"next_day"},
  ]},

teacher_correct: { bg:"school", text:`Марина Павловна кивает.\n\n— Правильно. Садись.\n\nКласс молчит. Кто-то смотрит с уважением.\n\nТы возвращаешься на место. ${F()} шепчет:\n\n— Молодец.`,
  choices:[
    {text:`Улыбнуться ${F()}.`, effects:()=>{setRel("lena",+1);}, next:"next_day"},
    {text:"Сесть молча.", effects:()=>{}, next:"next_day"},
  ]},

teacher_wrong: { bg:"school", text:`Класс взрывается смехом.\n\n— Двоечник! — кричит Дима с задней парты.\n\nУчительница стучит указкой:\n\n— Тихо!\n\nНо смех ещё звенит в ушах.\n\nТы возвращаешься на место. ${F()} смотрит в пол.`,
  choices:[
    {text:"Сесть молча.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Крикнуть на класс.", effects:()=>{setMental(-1);state.karma-=2;setRep(-1);}, next:"next_day",
     after:`Ты кричишь. Смех стихает.\n\nДима поднимает брови:\n\n— Псих.\n\nСлово повисает в воздухе.`},
    {text:"Улыбнуться.", effects:()=>{setMental(+1);setRep(+1);}, next:"next_day",
     after:`Ты улыбаешься. Искренне.\n\nСмех стихает. Кто-то говорит:\n\n— Странный ${g("он","она")}.\n\nНо больше не смеются.`},
  ]},

neighbor_bab_valya: { bg:"neighbor", when:()=>state.age>=7 && state.age<=14 && !flag("bab_valya_met") && !flag("orphan") && !flag("moved"),
  text:`Ты возвращаешься из школы. У подъезда сидит соседка. Баба Валя. Старая, в платке, с клюкой.\n\nОна смотрит на тебя долго. Потом машет рукой:\n\n— Подойди.`,
  choices:[
    {text:"Подойти.", effects:()=>{state.flags.bab_valya_met=true;}, next:"bab_valya_talk",
     after:`Ты подходишь. Она пахнет валидолом и старым деревом.`},
    {text:"Пройти мимо.", effects:()=>{}, next:"next_day"},
  ]},

bab_valya_talk: { bg:"neighbor", text:`Она берёт тебя за руку. Её пальцы сухие, как бумага.\n\n— Ты из квартиры четырнадцать? Из той, где подвал?\n\nТы киваешь. Она вздыхает.\n\n— Я тут живу шестьдесят лет. До вас там жила семья. Тоже с ребёнком. Мальчик был. Хороший. А потом…\n\nОна замолкает.`,
  choices:[
    {text:"— Что потом?", effects:()=>{state.fear+=2;}, next:"bab_valya_warning",
     after:`Она долго смотрит в сторону.\n\n— А потом они съехали. Втроём не съехали, а вдвоём. Мальчика не стало.\n\nОна замолкает. Больше ничего не говорит.`},
    {text:"— Не хочу знать.", effects:()=>{setMental(-1);}, next:"next_day",
     after:`Она кивает.\n\n— Правильно. Не хочешь — не слушай.\n\nНо с этого дня ты думаешь об этом каждый раз, проходя мимо её подъезда.`},
  ]},

bab_valya_warning: { bg:"neighbor", text:`Она наклоняется ближе. Голос шёпотом.\n\n— Если услышишь его — не отвечай. Не зови. И матери скажи, чтоб съезжали. Пока не поздно.`,
  next:"next_day"},

dima_bully: { bg:"school", when:()=>state.age>=7 && state.age<=14 && !flag("dima_met"),
  text:`Дима — самый высокий в классе. Подходит к твоей парте на перемене. Кладёт ладонь на твой учебник.\n\n— ${g("Новенький","Новенькая")}. Ты чё так${g("ой","ая")} тих${g("ой","ая")}?`,
  choices:[
    {text:"Молчать.", effects:()=>{setMental(-1);state.flags.dima_met=true;setRep(-1);}, next:"next_day",
     after:`Ты молчишь. Он смеётся. Забирает учебник. Уходит.\n\n${F()} смотрит на тебя. Ничего не говорит.`},
    {text:"— Отойди.", effects:()=>{state.flags.dima_met=true;state.karma-=1;setRep(+1);}, next:"dima_fight",
     after:`Ты говоришь это тихо. Но твёрдо.\n\nОн поднимает брови.\n\n— Чё?`},
    {text:`Позвать ${F()}.`, effects:()=>{state.flags.dima_met=true;if(flag("lena_friend"))setRel("lena",+1);setRep(+1);}, next:"next_day",
     after:`Ты оборачиваешься.\n\n— ${F()}.\n\n${fHeCap()} уже встаёт.\n\nДима смотрит на ${fE()}. И почему-то отходит.`},
    {text:"Позвать собак.", when:()=>flag("dogs_friendly"), effects:()=>{state.flags.dima_met=true;state.flags.dogs_rescue_done=true;setRel("dogs",+1);setRep(+3);}, next:"dima_dogs",
     after:`Ты свистишь в окно.\n\nЧерез минуту во дворе появляется вожак.`},
  ]},

dima_dogs: { bg:"school", text:`Собака входит в школьный двор. Дима замирает.\n\nВожак садится рядом с тобой. Смотрит на него.`,
  next:"next_day"},

dima_fight: { bg:"school", text:`Он толкает тебя в плечо. Не сильно. Проверяет.\n\n— Чё сказал${g("","а")}?`,
  choices:[
    {text:"Толкнуть в ответ.", effects:()=>{state.karma-=3;if(state.stamina>5)state.stamina-=2;else die("beaten",state.age);}, next:"next_day",
     after:`Ты толкаешь. Он падает на парту. Класс ахает.\n\nМарина Павловна входит в этот момент. Тебя ведут к директору.`},
    {text:"Отступить.", effects:()=>{setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

school_age12: { bg:"school", when:()=>!flag("school_age12_seen"),
  text:`Тебе двенадцать. Пятый класс. Новый классный руководитель, новые предметы.\n\nИ Аня. Тихая девочка с длинными волосами. Сидит одна у окна. Её никто не любит. Ты не знаешь почему.\n\nМарина Павловна смотрит выжидающе. Куда сядешь?`,
  choices:[
    {text:"Сесть с Аней.", effects:()=>{setRel("anya",+2);state.flags.school_age12_seen=true;setRep(-1);}, next:"school_anya_friend",
     after:`Аня удивлённо поднимает брови.\n\n— Ты уверен${g("","а")}? — шёпотом.\n\nТы киваешь.\n\nВесь урок она молчит. В конце говорит:\n\n— Спасибо.\n\nНе уточняет за что.`},
    {text:"Сесть с другими.", effects:()=>{setRel("anya",-1);state.flags.school_age12_seen=true;setRep(+1);}, next:"school_crowd",
     after:`Ты садишься к популярным. Они обсуждают кого-то шёпотом.\n\nТы понимаешь — это Аня.`},
    {text:"Сесть одному.", effects:()=>{state.flags.loner=true;state.flags.school_age12_seen=true;setRep(-1);}, next:"school_alone",
     after:`Ты садишься сзади. В отражении окна — кто-то позади.\n\nОборачиваешься. Пусто.`},
  ]},

school_anya_friend: { bg:"school", text:`Аня улыбается. Вы говорите весь урок. О книгах, о кошках, о чём-то ещё.\n\nОна умная.\n\nПочему её никто не любит?`,
  choices:[
    {text:"Пригласить гулять.", effects:()=>{setRel("anya",+3);}, next:"street_age12"},
    {text:"Молчать.", effects:()=>{setRel("anya",+1);}, next:"next_day"},
  ]},

school_crowd: { bg:"school", text:`Они смеются над Аней. Тихо, чтобы не слышала учительница.\n\nДима показывает на неё пальцем. Кто-то прыскает.\n\nТы смеёшься с ними.`,
  choices:[
    {text:"Остановиться.", effects:()=>{setRel("anya",+1);state.guilt+=2;}, next:"next_day"},
    {text:"Продолжать.", effects:()=>{setRel("anya",-3);setRep(-1);}, next:"next_day"},
  ]},

school_alone: { bg:"school", text:`Ты один. В коридоре — зеркало.\n\nВ отражении — кто-то позади тебя.`,
  choices:[
    {text:"Обернуться.", effects:()=>{state.fear+=3;}, next:"next_day"},
    {text:"Не смотреть.", effects:()=>{state.fear+=1;}, next:"next_day"},
    {text:"Разбить зеркало.", effects:()=>{state.karma-=3;state.fear+=4;setRep(-2);}, next:"next_day"},
  ]},

school_corridor_age13: { bg:"corridor", when:()=>!flag("corridor_seen"),
  text:`Перемена. Ты случайно толкаешь Аню. Она падает. Учебники рассыпаются.\n\nКласс замирает. Потом — смех.\n\nАня смотрит на тебя снизу вверх.`,
  choices:[
    {text:"Помочь встать.", effects:()=>{setRel("anya",+3);state.flags.kind=true;state.flags.corridor_seen=true;setRep(+2);}, next:"next_day",
     after:`Ты протягиваешь руку. Она смотрит на неё секунду. Потом берёт.\n\n— Спасибо, — говорит тихо.\n\nНикто не смеётся.`},
    {text:"Нагрубить.", effects:()=>{setRel("anya",-5);state.flags.grudge=true;state.flags.corridor_seen=true;setRep(-2);schedule(84,"anya_revenge");}, next:"next_day",
     after:`— Сама виновата. Смотреть надо.\n\nТы уходишь. Она смотрит тебе в спину.\n\nТы чувствуешь этот взгляд всю неделю.`},
    {text:"Толкнуть сильнее.", effects:()=>{setRel("anya",-8);state.flags.corridor_seen=true;setRep(-3);if(seeded(makeSeed())<0.3)die("anya_push",13,"anya");}, next:"next_day",
     after:`Ты наступаешь на её тетрадь. Она не плачет. Просто смотрит.\n\nЗапоминает.`},
  ]},

street_age12: { bg:"street", text:`Вы гуляете с Аней. Осень. Листья под ногами. Холодный воздух.\n\nОна рассказывает про отца, который ушёл два года назад. Голос ровный. Будто читает по бумаге.`,
  choices:[
    {text:"Рассказать про подвал.", effects:()=>{setRel("anya",+2);}, next:"next_day",
     after:`Аня смотрит странно.\n\n— Я тоже его видела.\n\nТы замираешь.\n\n— Кого?\n\nОна не отвечает.`},
    {text:"Сменить тему.", effects:()=>{setRel("anya",+1);}, next:"next_day"},
    {text:"Толкнуть под машину.", effects:()=>{setRel("anya",-10);setRep(-5);if(seeded(makeSeed())<0.7){state.flags.killed_someone=true;state.flags.killed_ever=true;}}, next:"next_day"},
  ]},

school_bully_age12: { bg:"school", when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead"),
  text:`Старшеклассник отобрал твой рюкзак. Держит его высоко над головой и смеётся.\n\n${F()} рядом. Сжав кулаки.`,
  choices:[
    {text:`Позвать ${F()}.`, effects:()=>{const r=lenaProtect();if(r)return r;setRep(+1);}, next:"next_day",
     after:`${F()} делает шаг.\n\n— Отдай.\n\nОн смотрит на ${fE()}. И отдаёт.\n\nТы не понимаешь, чего он испугался.`},
    {text:"Дать сдачи.", effects:()=>{if(state.stamina>5)state.stamina-=2;else die("beaten",12);setRep(+2);}, next:"next_day",
     after:`Ты бросаешься. Удар. Боль.\n\nТы лежишь на полу. Но рюкзак твой.`},
    {text:"Отдать рюкзак.", effects:()=>{setMental(-2);setRep(-1);}, next:"next_day"},
  ]},

lena_death: { bg:"hospital", text:`${F()} в больнице. Врач качает головой.\n\n— ${fHeCap()} не выживет.`,
  choices:[{text:"Держать за руку.", effects:()=>{setMental(-3);}, next:"next_day",
   after:`Ты держишь ${fE()} руку. Она холодная.\n\nУтром ${fE()} не станет.`}]},

lena_leaves: { bg:"street", text:`${F()} стоит с рюкзаком.\n\n— Я больше не буду твоей тенью.\n\nУходит. Навсегда.`,
  choices:[{text:"Смотреть вслед.", effects:()=>{setMental(-2);}, next:"next_day", after:`Ты смотришь, пока ${fHe()} не исчезает из виду.`}]},

lena_romance_start: { bg:"park", text:`Вам по восемнадцать.\n\nВы сидите на скамейке в парке. Не той, что в школе. Но похожей.\n\n${F()} грызёт сушку. Как тогда.\n\nТолько теперь ${fHe()} вырос${fA()}. И сушка уже не та. И скамейка кажется меньше.\n\n— Помнишь? — спрашивает ${fHe()}, не глядя. — Ты мне тогда отдал${g("","а")} половину.`,
  choices:[
    {text:"— Помню. Всё помню.", next:"lena_romance_confess",
     after:`${fHeCap()} поднимает на тебя глаза. Долго смотрит.\n\n— Я тоже. Всё.`},
    {text:"— Ты про сушку?", effects:()=>{setRel("lena",+1);}, next:"lena_romance_confess",

    {text:"Уйти от разговора.", effects:()=>{setMental(-1);}, next:"next_day",
     after:`Ты меняешь тему. ${fHeCap()} кивает. И больше не возвращается к этому.\n\nВы расходитесь. Что-то осталось несказанным.`},
  ]},

lena_romance_confess: { bg:"park", text:`${F()} откладывает сушку. Смотрит на тебя прямо.\n\n— Слушай. Я давно хотел${fA()} сказать. Все эти годы — ты был${g("","а")} рядом. Ты был${g("","а")}… всем. И я не знаю, что будет дальше, но я не хочу это терять.`,
  choices:[
    {text:"— Я тоже тебя люблю.", effects:()=>{state.flags.lena_romance=true;setRel("lena",+3);setMental(+2);}, next:"lena_romance_yes",
     after:`${fHeCap()} выдыхает. Так, будто держал${fA()} воздух двенадцать лет.\n\n— Правда?\n\n— Правда.\n\n${fHeCap()} улыбается. И плачет. И смеётся одновременно.`},
    {text:"— Давай останемся друзьями.", effects:()=>{setRel("lena",-3);setMental(-2);}, next:"lena_romance_no",
     after:`${fHeCap()} кивает. Медленно.\n\n— Хорошо.\n\nИ улыбается. Но уже не так.`},
    {text:"Молчать.", effects:()=>{setRel("lena",-2);}, next:"next_day",
     after:`Ты молчишь. ${fHeCap()} ждёт. Потом встаёт.\n\n— Ладно. Забудь.\n\nУходит.`},
  ]},

lena_romance_yes: { bg:"park", text:`${fHeCap()} берёт тебя за руку. Пальцы холодные. ${fHe()} всегда мёрзнет.\n\n— Ты знаешь, что я тебя люблю с шести лет? С того дня, когда ты ${g("подошёл","подошла")} к скамейке и сказал${g("","а")}, что тебя зовут ${state.name}?`,

lena_wedding: { bg:"street", text:`Свадьба — маленькая. Двадцать человек. В ресторане на углу, где вы когда-то отмечали выпускной.\n\n${F()} в ${fClothes()}. ${fHeCap()} плачет. Мать плачет. Даже баба Валя пришла. Стоит в сторонке, вытирает глаза платком.\n\n— Соглас${state.gender==="girl"?"ен":"на"}, — говорит ${F()}.\n\nГолос дрожит.`,
  choices:[
    {text:`— Соглас${g("ен","на")}.`, effects:()=>{setMental(+3);}, next:"first_night",
     after:`Вы целуетесь. Кто-то аплодирует. Кто-то свистит.\n\nВечером вы остаётесь вдвоём.`},
    {text:"Молчать от счастья.", effects:()=>{setMental(+2);}, next:"first_night",
     after:`Ты не можешь говорить. Просто киваешь.\n\n${fHeCap()} смеётся.\n\n— Это да?\n\nТы киваешь снова.`},
  ]},

first_night: { bg:"home", text:`Ночь. Комната. За окном — фонарь. Тени на потолке.\n\n${spouseName()} сидит на краю кровати. Смотрит на тебя. Улыбается. Немного нервно.\n\n— Я волнуюсь, — говорит ${spouseHe()} тихо.`,
  choices:[
    {text:"— Я тоже.", effects:()=>{setMental(+2);setRel(spouseRelName(),+2);state.flags.first_night_done=true;}, next:"next_day",
     after:`Ты целуешь ${spouseE()}. ${spouseHeCap()} отвечает. Сначала неуверенно. Потом смелее.\n\nВы поднимаетесь. Дверь закрывается.\n\nУтро приходит слишком быстро. ${spouseHeCap()} спит рядом. Дышит ровно.\n\nТы смотришь на ${spouseE()} и думаешь: «Вот оно. Вот моя жизнь».`},
    {text:"— Давай просто полежим.", effects:()=>{setMental(+1);setRel(spouseRelName(),+2);state.flags.first_night_done=true;}, next:"next_day",
     after:`Вы ложитесь рядом. Смотрите в потолок.\n\n${spouseHeCap()} кладёт голову тебе на плечо.\n\n— Так тоже хорошо, — говорит ${spouseHe()}.\n\nВы засыпаете под утро.`},
  ]},

child_talk: { bg:"home", text:`${spouseName()} держит в руках тест. Две полоски.\n\n${spouseHeCap()} смотрит на тебя. Испуганно и радостно одновременно.\n\n— Что будем делать? — спрашивает ${spouseHe()}.`,
  choices:[
    {text:"— Рожать.", effects:()=>{state.flags.child=true;setRel(spouseRelName(),+3);setMental(+2);setRel("child",+3);}, next:"next_day",
     after:`${spouseHeCap()} выдыхает. Обнимает тебя так крепко, что рёбра трещат.\n\n— Я боял${state.gender==="girl"?"ся":"ась"}, что ты испугаешься.\n\n— Я испугал${g("ся","ась")}. Но не настолько.`},
    {text:"— А ты как хочешь?", effects:()=>{setRel(spouseRelName(),+2);}, next:"child_decide",
     after:`${spouseHeCap()} задумывается. Потом кивает сам${spouseA()} себе.\n\n— Хочу.`},
    {text:"— Может, не сейчас?", effects:()=>{setRel(spouseRelName(),-5);setMental(-2);}, next:"next_day",
     after:`${spouseHeCap()} смотрит на тебя. Долго.\n\n— Хорошо.\n\nОткладывает тест. Больше не говорит об этом.`},
  ]},

child_decide: { bg:"home", text:`${spouseHeCap()} смотрит на тест. Потом на тебя. Потом снова на тест.\n\n— Я хочу. Если ты рядом.`,
  choices:[
    {text:"— Я рядом.", effects:()=>{state.flags.child=true;setRel("child",+3);}, next:"next_day",
     after:`${spouseHeCap()} улыбается. И плачет.\n\nЧерез девять месяцев у вас будет ребёнок.`},
    {text:"— Мне нужно подумать.", effects:()=>{setRel(spouseRelName(),-3);}, next:"next_day"},
  ]},

family_life: { bg:"home", when:()=>flag("child") && (flag("married_lena") || flag("married_uni")),
  text:`Утро.\n\n${spouseName()} на кухне. Гремит посудой. Ребёнок плачет в комнате. Пахнет молоком и кофе.\n\nТы сидишь за столом. Смотришь в окно.\n\nВспоминаешь, как всё начиналось.`,
  choices:[
    {text:`Помочь ${spouseName()}.`, effects:()=>{setRel(spouseRelName(),+1);setMental(+1);}, next:"next_day",
     after:`Ты встаёшь. Идёшь к ребёнку.\n\n${spouseName()} смотрит на тебя. С благодарностью, которую не нужно произносить вслух.`},
    {text:"Уйти на работу.", effects:()=>{}, next:"next_day"},
    {text:"Сидеть и смотреть.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

uni_meet: { bg:"school", when:()=>(flag("lena_dead")||flag("lena_left")||rel("lena")<3)
  &&!flag("uni_friend")&&!flag("married_lena")&&!flag("married")&&!flag("partner"),
  text:`Первый курс. Ты сидишь один в столовой. С подносом, на котором остывает суп.\n\nЗа соседний стол садится ${uHe()}. ${U()}. С растрёпанными волосами, в наушниках, с книгой под мышкой.\n\nЗамечает тебя. Улыбается.\n\n— Тут свободно?`,
  choices:[
    {text:"— Садись.", effects:()=>{state.flags.uni_friend=true;setRel("uni",+3);}, next:"uni_meet_2",
     after:`${uHeCap()} садится напротив. Ставит на стол книгу. Что-то по философии.\n\n— Читал${g("","а")}?\n\n— Нет.\n\n— И правильно. Скука смертная.\n\nТы смеёшься. Впервые за долгое время.`},
    {text:"— Занято.", effects:()=>{setRep(-1);}, next:"next_day",
     after:`${uHeCap()} пожимает плечами. Отходит.\n\nНо через неделю снова садится рядом.\n\n— Ну как, суп ещё остывает?`},
    {text:"Молча кивнуть.", effects:()=>{state.flags.uni_friend=true;setRel("uni",+1);}, next:"uni_meet_2",
     after:`${uHeCap()} садится напротив. Молча ест.\n\nЧерез пять минут:\n\n— Я ${U()}. А ты?`},
  ]},

uni_meet_2: { bg:"school", text:`${uHeCap()} представляется. ${U()}. Говорит быстро, перебивая сам${uA()} себя, смеётся над своими же шутками.\n\nТы не понимаешь, почему тебе вдруг стало легче.`,
  next:"next_day"},

uni_romance_start: { bg:"park", text:`Вам по девятнадцать. Вы с ${U()} гуляете после пар. Осень. Пахнет мокрым асфальтом.\n\n${uHeCap()} останавливается. Смотрит на тебя.\n\n— Слушай. Я давно хотел${uA()} сказать. Все эти месяцы — ты был${g("","а")} рядом. Не как друг. Ну, то есть как друг тоже. Но не только.`,
  choices:[
    {text:"— Я чувствую то же.", effects:()=>{state.flags.uni_romance=true;setRel("uni",+3);setMental(+2);}, next:"uni_romance_yes",
     after:`${uHeCap()} выдыхает. Улыбается. Широко, по-настоящему.\n\n— Правда? Я думал${uA()}, ты скажешь «нет». Готовился к худшему.\n\n— Не дождался.`},
    {text:"— Давай останемся друзьями.", effects:()=>{setRel("uni",-2);setMental(-2);}, next:"next_day",
     after:`${uHeCap()} кивает. Медленно.\n\n— Ладно. Я понимаю.\n\nУлыбается. Но уже не так.`},
    {text:"Молчать.", effects:()=>{setRel("uni",-1);}, next:"next_day",
     after:`Ты молчишь. ${uHeCap()} ждёт. Потом отворачивается.\n\n— Забудь. Пойдём.`},
  ]},

uni_romance_yes: { bg:"park", text:`${uHeCap()} берёт тебя за руку. Пальцы тёплые.\n\n— Знаешь, — говорит ${uHe()}, — я не верил${uA()} в это. Думал${uA()}, так бывает только в кино.`,
  choices:[
    {text:"— Бывает.", effects:()=>{setMental(+1);}, next:"next_day",
     after:`${uHeCap()} смеётся. Притягивает тебя ближе.\n\nВы стоите так до темноты.`},
    {text:`— Я тоже не верил${g("","а")}.`, effects:()=>{setMental(+1);}, next:"next_day",
     after:`${uHeCap()} кивает.\n\n— Теперь верим.`},
  ]},

uni_proposal: { bg:"home", text:`Вам по двадцать с лишним.\n\n${U()} сидит на диване. Ты — рядом. По телевизору — что-то старое. ${uHeCap()} смеётся над шуткой, которую слышал${uA()} сто раз.\n\nТы смотришь на ${uE()}. И понимаешь: вот оно.`,
  choices:[
    {text:"Сделать предложение.", effects:()=>{state.flags.married_uni=true;state.flags.married=true;setMental(+3);setRel("uni",+3);}, next:"uni_wedding",
     after:`Ты встаёшь. Достаёшь кольцо, которое купил${g("","а")} месяц назад и всё не решал${g("ся","ась")}.\n\n— ${U()}. ${state.gender==="girl"?"Женись на мне":"Выходи за меня"}.`},
    {text:"Подождать ещё год.", effects:()=>{state.flags.uni_proposal_seen=false;}, next:"next_day"},
  ]},

uni_wedding: { bg:"park", text:`Свадьба — маленькая. Тридцать человек. В парке, у пруда, где вы гуляли после универа.\n\n${U()} в ${state.gender==="girl"?"костюме":"платье"}. ${uHeCap()} плачет. Мать плачет. Даже кто-то из универа пришёл. Стоит в сторонке, снимает на телефон.\n\n— Соглас${state.gender==="girl"?"ен":"на"}, — говорит ${U()}.\n\nГолос дрожит.`,
  choices:[
    {text:`— Соглас${g("ен","на")}.`, effects:()=>{setMental(+3);}, next:"first_night",
     after:`Вы целуетесь. Кто-то аплодирует.\n\nВечером вы остаётесь вдвоём.`},
    {text:"Молчать от счастья.", effects:()=>{setMental(+2);}, next:"first_night",
     after:`Ты не можешь говорить. Просто киваешь.\n\n${uHeCap()} смеётся.\n\n— Это да?\n\nТы киваешь снова.`},
  ]},

old_age65: { bg:"home", text:`Тебе шестьдесят пять.\n\nВыход на пенсию. Внуки играют во дворе.\n\nТы смотришь в окно.`,
  choices:[
    {text:"Позвать их.", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Закрыть шторы.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

old_75: { bg:"home", text:`75. Память подводит. Ты забываешь имена.`,
  choices:[
    {text:"Записывать всё.", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Смириться.", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

old_80: { bg:"home", text:`80. Врач:\n\n— Вам осталось немного.`,
  choices:[
    {text:"Позвать всех.", effects:()=>{if(rel("child")>=3||rel("lena")>=5)die("old_family",80);else die("old_alone",80);}},
    {text:"Принять таблетки.", effects:()=>{die("pills",80);}},
    {text:"Просто сидеть.", effects:()=>{die("old_sleep",80);}},
  ]},

old_age_loop: { bg:"home", text:`${glance()}Ещё год.\n\nВопрос — зачем?`,
  choices:[
    {text:"Продолжать.", effects:()=>{
      if(state.age<75) return "old_75";
      if(state.age<80) return "old_80";
      die("old_age",state.age);
    }},
    {text:"Закончить самому.", effects:()=>{die("pills",state.age);}},
  ]},

birthday_kid: { bg:"holiday", when:()=>state.age<12,
  text:`28 ноября. Тебе ${state.age}.\n\nТорт на столе. Свечи. Мать стоит рядом. Улыбается. Но глаза грустные.`,
  choices:[
    {text:"Задуть свечи.", effects:()=>{setMental(+2);}, next:"next_day",
     after:`Ты задуваешь. Один огонёк не гаснет. Дуешь ещё раз. Исчезает.\n\nМать улыбается. Но в глазах — что-то ещё.`},
    {text:`Позвать ${F()}.`, when:()=>flag("lena_friend")&&!flag("lena_dead")&&!flag("lena_left"), effects:()=>{setRel("lena",+1);setMental(+1);}, next:"next_day",
     after:`${F()} приходит с самодельной открыткой. На ней — две фигурки и солнце.\n\n— Это мы, — говорит ${fHe()}.\n\nТы вешаешь открытку над кроватью.`},
    {text:"Загадать желание.", effects:()=>{setMental(+1);state.flags.bd_wish=true;}, next:"next_day",
     after:`Ты загадываешь. Долго.\n\nСвечи гаснут. Мать хлопает в ладоши.\n\nНо что-то в комнате меняется. Ты не понимаешь что.`},
  ]},

birthday_teen: { bg:"holiday", when:()=>state.age>=12&&state.age<19,
  text:`28 ноября. Тебе ${state.age}.\n\nДень рождения.`,
  choices:[
    {text:"С семьёй.", effects:()=>{setRel("mother",+1);setMental(+1);}, next:"next_day"},
    {text:"Вечеринку.", effects:()=>{setMental(+2);}, next:"next_day"},
    {text:"Позвать друзей.", when:()=>flag("lena_friend")&&!flag("lena_dead")&&!flag("lena_left"), effects:()=>{setRel("lena",+2);setRep(+1);setMental(+1);}, next:"next_day",
     after:`${F()} приходит первой. И ещё человек пять.\n\nМать накрывает на стол. Отец прячется в комнате. Но вечер получается хорошим.`},
  ]},

birthday_adult: { bg:"holiday", when:()=>state.age>=19&&state.age<65,
  text:`28 ноября. Тебе ${state.age}.`,
  choices:[
    {text:"С близкими.", effects:()=>{setMental(+2);}, next:"next_day"},
    {text:"Работать.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

birthday_old: { bg:"holiday", when:()=>state.age>=65,
  text:`28 ноября. Тебе ${state.age}.`,
  choices:[
    {text:"Принять гостей.", effects:()=>{if(rel("child")>=3||rel("lena")>=5)setMental(+2);else setMental(-1);}, next:"next_day"},
    {text:"Побыть одному.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

dementia_crisis: { bg:"home", text:`Ты не помнишь, как сюда попал${g("","а")}.\n\nКомната знакомая. Но чужая.\n\nНа столе — фото. Кто эти люди?`,
  choices:[
    {text:"Позвонить ребёнку.", effects:()=>{if(rel("child")>=3)setMental(+1);else setMental(-2);}, next:"next_day"},
    {text:"Выйти на улицу.", effects:()=>{if(seeded(makeSeed())<0.3)die("lost",state.age);setMental(-2);}, next:"next_day"},
    {text:"Сесть и ждать.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

dementia_aggression: { bg:"home", text:`Кто-то трогает твои вещи. Ты не помнишь, кто.\n\nНо он — враг.`,
  choices:[
    {text:"Ударить.", effects:()=>{state.karma-=5;if(seeded(makeSeed())<0.3){state.flags.killed_someone=true;state.flags.killed_ever=true;}}, next:"next_day"},
    {text:"Крикнуть.", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Спрятаться.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

psych_ward: { bg:"psych", text:`Тебя забрали.\n\nБелые стены. Решётки.\n\nВрач:\n\n— Мы поможем тебе забыть.`,
  choices:[
    {text:"Сотрудничать.", effects:()=>{setMental(-2);}, next:"next_day",
     after:`Тебя ведут в палату. Ты считаешь шаги. Их ровно сорок три.`},
    {text:"Бунтовать.", effects:()=>{setMental(-3);if(seeded(makeSeed())<0.5)die("psych_kill",state.age,"персонал");}, next:"next_day"},
    {text:"Притвориться здоровым.", effects:()=>{if(state.mental>=6){state.flags.psych_ward=false;state.flags.psych_kill_done=true;state.flags.psych_healthy=true;setMental(+2);}else setMental(-2);}, next:"next_day",
     after:`Ты улыбаешься. Говоришь ровно.\n\nВрач смотрит в бумаги.\n\n— Что ж. Пожалуй, вы готовы.`},
  ]},

psych_ward_loop: { bg:"psych", text:`День в палате. Ты считаешь трещины на потолке.`,
  choices:[
    {text:"Смириться.", effects:()=>{}, next:"next_day"},
    {text:"Планировать побег.", effects:()=>{if(state.stamina>5&&seeded(makeSeed())<0.2){state.flags.psych_ward=false;state.flags.psych_escaped=true;state.flags.psych_kill_done=true;setMental(+1);return "psych_escape_success";}else setMental(-1);}, next:"next_day"},
  ]},

psych_final_choice: { bg:"psych", text:`Прошло двенадцать дней.\n\nВрач заходит в палату с папкой. Смотрит в бумаги. Потом на тебя.\n\n— ${state.name}. Завтра — последняя процедура. После неё — либо поправишься, либо...\n\nОн не договаривает.\n\nНочью окно в коридоре приоткрыто. Решётка ослаблена. Санитар спит на посту.`,
  choices:[
    {text:"Остаться. Пройти лечение.", next:"psych_treatment_result",
     after:`Ты ложишься обратно. Смотришь в потолок. Считаешь трещины. Их сорок три.\n\nУтром тебя ведут в кабинет.`},
    {text:"Сбежать.", effects:()=>{
      if(seeded(makeSeed()) < 0.5){
        state.flags.psych_ward = false;
        state.flags.psych_escaped = true;
        state.flags.psych_kill_done = true;
        setMental(+2);
        return "psych_escape_success";
      } else {
        state.flags.psych_start_day = state.day;
        state.flags.psych_extra = (state.flags.psych_extra||0) + 1;
        setMental(-3);
        return "psych_escape_fail";
      }
    }},
  ]},

psych_treatment_result: { bg:"psych", text:`Кабинет. Ремни на руках. Аппарат с проводами. Врач с холодными пальцами.\n\n— Считай до десяти, — говорит он.`,
  choices:[
    {text:"Считать.", effects:()=>{
      if(seeded(makeSeed()) < 0.05){
        die("psych_kill", state.age, "персонал");
        return null;
      } else {
        state.flags.psych_ward = false;
        state.flags.psych_healthy = true;
        state.flags.psych_kill_done = true;
        state.flags.killed_someone = false;
        setMental(+4);
        return "psych_healthy_exit";
      }
    }},
  ]},

psych_escape_success: { bg:"street", text:`Ты бежишь босиком по холодному асфальту. За спиной — крики. Но они стихают.\n\nЧерез час ты у своей двери. Мать открывает. Вскрикивает. Обнимает так крепко, что рёбра трещат.\n\n— Я думала, тебя больше нет.`,
  choices:[
    {text:"Обнять в ответ.", effects:()=>{setRel("mother",+3);setMental(+2);state.flags.killed_someone=false;}, next:"next_day",
     after:`Ты обнимаешь её. Она пахнет кухней и страхом.\n\nТы дома. Ты на свободе. Но то, что было в палате, останется с тобой навсегда.`},
    {text:"Молча войти.", effects:()=>{state.flags.killed_someone=false;}, next:"next_day",
     after:`Ты проходишь мимо неё в комнату. Закрываешь дверь. Садишься на кровать.\n\nСмотришь в стену. Долго.`},
  ]},

psych_escape_fail: { bg:"psych", text:`Ты добегаешь до двери. Она заперта. Новый замок, блестящий.\n\nСзади — шаги. Рука санитара хватает тебя за плечо.\n\n— Куда собрал${g("ся","ась")}?\n\nТебя возвращают в палату. Врач делает пометку: «Попытка побега. Продлить срок».`,
  choices:[
    {text:"Смириться.", effects:()=>{}, next:"next_day",
     after:`Ты ложишься на койку. Смотришь в потолок.\n\nПроходит ещё двенадцать дней.`},
    {text:"Кричать.", effects:()=>{setMental(-2);}, next:"next_day",
     after:`Ты кричишь, пока не хрипнешь. Никто не приходит.\n\nПроходит ещё двенадцать дней.`},
  ]},

                 "dogs_pack","stray_kitten","yard_well",
                 "fire_stairs","street_accident","found_money","school_trip","school_crush"];
const POOL_16 = ["club_age16","forest_age17","lena_needs_help_age14","lena_protect_serious_age15","push_from_roof_age16",
                 "yard_well","fire_stairs","street_accident","found_money",
                 "school_trip","school_crush","summer_job","teen_rebellion","dogs_rescue"];
const POOL_19 = ["uni_age19","love_age20","alcohol_age19","accident_age22","job_age22",
                 "found_money","street_accident","fire_stairs","dogs_rescue","teen_rebellion"];
const POOL_23 = ["career_age25","marriage_age28","child_birth_age30","midlife_age40",
                 "found_money","street_accident","fire_stairs","dogs_rescue"];
const POOL_35 = ["family_age35","parents_die_age45","health_age50","divorce_age52",
                 "street_accident","found_money","dogs_rescue"];
const POOL_50 = ["health_age50","dementia_aggression","divorce_age52","found_money"];
const POOL_65 = ["old_age65","old_75","old_80","dementia_crisis"];
const ORPHAN_POOL = ["orphan_bully","orphan_adoption"];

function getPool(){
  const a = state.age;
  if(a<12) return POOL_6;
  if(a<16) return POOL_12;
  if(a<19) return POOL_16;
  if(a<23) return POOL_19;
  if(a<35) return POOL_23;
  if(a<50) return POOL_35;
  if(a<65) return POOL_50;
  return POOL_65;
}

/* ---------- ПРАЗДНИКИ: проверка и триггер ---------- */
function checkHoliday(){
  const key = `${state.y}_${state.m}_${state.d}`;
  if(state.usedHolidays[key]) return null;

  if(state.m === 12 && state.d === 31 && state.age >= 5){
    state.usedHolidays[key] = true;
    return "new_year";
  }
  if(state.m === 3 && state.d === 8 && state.age >= 5){
    state.usedHolidays[key] = true;
    return "march_8";
  }
  if(state.m === 2 && state.d === 23 && state.age >= 5){
    state.usedHolidays[key] = true;
    return "feb_23";
  }
  if(state.m === 5 && state.d === 9 && state.age >= 5){
    state.usedHolidays[key] = true;
    return "may_9";
  }
  if(state.m === 4 && state.d >= 12 && state.d <= 20 && !state.usedHolidays[`${state.y}_easter`] && state.age >= 5){
    state.usedHolidays[`${state.y}_easter`] = true;
    return "easter";
  }
  return null;
}

const app = document.getElementById("app");

function shake(){
  const el = document.querySelector(".scene") || app;
  el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),800);
}

function die(cause, atAge, killer=null){
  state.deathCause = DEATHS[cause] || cause;
  state.deathAge = atAge;
  state.killer = killer;
  showDeath();
}

function buildEpilogue(){
  const parts = [`Ты ${g("умер","умерла")} в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  const r = n => state.relations[n] ?? 0;

  if(state.killer && r(state.killer)<=-5) parts.push("Это сделал тот, кого ты когда-то обидел.");
  if(r("mother")>=5) parts.push("Мать не пережила. Она приходила на могилу каждый день.");
  else if(r("mother")<=-3) parts.push("Мать узнала слишком поздно. Она даже не пришла.");
  if(r("anya")>=3) parts.push("Аня пришла на похороны. Она плакала.");
  else if(r("anya")<=-5) parts.push("Аня не пришла. Она знала, что так будет.");
  if(r("lena")>=5) parts.push(`${F()} был${fA()} рядом до конца.`);
  else if(r("lena")<=-5) parts.push(`${F()} не приш${fA()}. Ты сам${g("","а")} оттолкнул${g("","а")}.`);
  if(r("uni")>=5) parts.push(`${U()} был${uA()} рядом до конца.`);
  if(r("child")>=3) parts.push("Твой ребёнок держал тебя за руку.");
  if(r("dogs")>=3) parts.push("Собаки приходили на твою могилу ещё долго.");

  if(state.reputation >= 6) parts.push(`Тебя помнили как ${repLabel()}.`);
  else if(state.reputation <= -6) parts.push(`Тебя помнили как ${repLabel()}. Немногие пришли.`);

  if(state.mental<=2) parts.push("Психика была разрушена задолго до конца.");
  if(flag("kind")) parts.push(`Кто-то вспомнил, что ты был${g("","а")} добр${g("","а")}.`);
  if(flag("mother_believes")) parts.push("Мать верила тебе. До конца.");
  if(flag("moved")) parts.push("Вы переехали. И оно не пошло за вами.");
  if(flag("psych_healthy")) parts.push("Ты вышел из психушки здоровым. Но помнил всё.");
  if(flag("psych_escaped")) parts.push("Ты сбежал. Они так и не нашли тебя.");
  if(flag("psych_ward")&&!flag("psych_healthy")&&!flag("psych_escaped")) parts.push("Тебя держали в психушке. Ты умер там.");
  if(flag("killed_ever")) parts.push("Ты убил человека. Это осталось с тобой.");
  if(flag("lena_dead")) parts.push(`${F()} умер, защищая тебя.`);
  if(flag("lena_left")) parts.push(`${F()} отвернулся от тебя.`);

  if(state.guilt>5) parts.push("Последнее, что ты чувствовал — вина.");
  if(state.fear>10) parts.push("Последнее, что ты чувствовал — страх.");

  const key=[
    state.deathCause,state.deathAge,state.killer||"-",
    flag("kind")?"k":"-",flag("moved")?"m":"-",
    flag("lena_dead")?"ld":"-",flag("lena_left")?"ll":"-",
    flag("married_lena")?"ml":"-",flag("married_uni")?"mu":"-",
    flag("psych_healthy")?"ph":"-",flag("psych_escaped")?"pe":"-",
    flag("killed_ever")?"ks":"-",
    state.mental<=2?"m2":"-",
    state.reputation>=6?"rh":"-",state.reputation<=-6?"rl":"-",
  ].join("_");
  state.seenEndings.add(key);
  return parts.join(" ");
}

function showDeath(){
  const ep = buildEpilogue();
  playSfx("heartbeat");
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML=`
      <div class="death-screen">
        <p>${ep}</p>
        <p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge}</p>
        <button id="restart">Начать заново</button>
      </div>`;
    document.getElementById("restart").onclick=()=>location.reload();
    app.classList.remove("fade-out");
  },150);
}

function playScene(id){
  if(!id || id==="next_day" || id==="auto_day" || id==="day_start") return advanceDay();
  let scene = scenes[id];
  if(!scene){
    console.warn("Нет сцены:", id, "→ пропуск");
    state.flags._skipCount = (state.flags._skipCount || 0) + 1;
    if(state.flags._skipCount > 3){
      state.flags._skipCount = 0;
      return showMontage(1);
    }
    return advanceDay();
  }
  state.flags._skipCount = 0;

  if(typeof scene === "function") scene = scene();

  const due = checkTimers();
  if(due.length && !id.startsWith("event_")) return playScene("event_"+due[0].event);

  if(scene.when && !scene.when()) return playScene("next_day");

  if(flag("killed_someone") && !flag("psych_ward") && !flag("psych_checked") && !flag("psych_escaped") && !flag("psych_healthy") && !flag("psych_kill_done")){
    state.flags.psych_checked = true;
    state.flags.psych_ward = true;
    state.flags.psych_start_day = state.day;
    setMental(-5);
    return playScene("psych_ward");
  }

  if(flag("orphan") && !flag("orphan_done") && !id.startsWith("orphan_")){
    state.flags.orphan_done = true;
    return playScene("orphan_home");
  }

  render(scene);
}

function render(scene){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    const rep = state.reputation;
    const repPercent = ((rep + 10) / 20) * 100;
    app.innerHTML=`
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${mentClass}">${starStr(state.mental)}</span>
          </div>
          <div class="reputation-bar">
            <span>Репутация:</span>
            <div class="rep-track"><div class="rep-fill ${repClass()}" style="width:${repPercent}%"></div></div>
            <span>${repLabel()}</span>
          </div>
          <p class="text">${scene.text}</p>
          <div class="choices"></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG[scene.bg] || BG.home;

    const box = app.querySelector(".choices");
    if(scene.choices){
      scene.choices.forEach(c=>{
        if(c.when && !c.when()) return;
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = ()=>{
          getCtx();
          const jumpTo = c.effects?.();
          if(state.deathCause) return;
          if(c.after){
            showAfter(c.after, jumpTo || c.next || "next_day");
            return;
          }
          playScene(jumpTo || c.next || "next_day");
        };
        box.appendChild(b);
      });
    } else {
      const b = document.createElement("button");
      b.textContent = "Дальше";
      b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");};
      box.appendChild(b);
    }
    app.classList.remove("fade-out");
  },150);
}

function showAfter(text, next){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const rep = state.reputation;
    const repPercent = ((rep + 10) / 20) * 100;
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
          </div>
          <div class="reputation-bar">
            <span>Репутация:</span>
            <div class="rep-track"><div class="rep-fill ${repClass()}" style="width:${repPercent}%"></div></div>
            <span>${repLabel()}</span>
          </div>
          <p class="text after-text">${text}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;
    document.getElementById("contBtn").onclick = ()=>{
      app.classList.remove("fade-out");
      playScene(next);
    };
    app.classList.remove("fade-out");
  },150);
}

function showMontage(days){
  const lines = [];
  const steps = Math.min(days, 6);
  for(let i=0;i<steps;i++){
    lines.push(pickMontage());
  }

  let tempY = state.y, tempM = state.m, tempD = state.d;
  for(let i=0;i<days;i++){
    tempD += 1;
    const dim = new Date(tempY, tempM, 0).getDate();
    if(tempD > dim){ tempD = 1; tempM += 1; }
    if(tempM > 12){ tempM = 1; tempY += 1; }
  }
  state.y = tempY; state.m = tempM; state.d = tempD;
  state.day += days;
  state.dailySeed = state.day * 7919 + state.y * 104729 + state.m * 1299709 + state.d * 15485863;

  if(state.m === 11 && state.d === 28){
    state.age += 1;
  } else {
    const ageByYears = state.y - 2015;
    if(ageByYears + 5 > state.age && state.m >= 11){
      state.age = ageByYears + 5;
    }
  }

  if(state.age >= 50){
    state.dementia = Math.min(10, state.dementia + Math.floor(days/30));
  }

  if(state.reputation <= -4 && state.age >= 10){
    setMental(-1);
  }

  const holiday = checkHoliday();

  if(holiday){
    app.classList.add("fade-out");
    setTimeout(()=>{
      app.innerHTML = `
        <div class="scene">
          <div class="scene-inner">
            <div class="status">
              <span>${state.name}</span>
              <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
              <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
            </div>
            <p class="text after-text">${lines.join("\n\n")}</p>
            <div class="choices"><button id="contBtn">Дальше</button></div>
          </div>
        </div>`;
      const sceneEl = app.querySelector(".scene");
      sceneEl.style.background = BG.montage;
      document.getElementById("contBtn").onclick = ()=>{
        app.classList.remove("fade-out");
        playScene(holiday);
      };
      app.classList.remove("fade-out");
    },150);
    return;
  }

  if(state.age >= 7 && state.age < 46 && !flag("dogs_met") && state.day >= 3){
    const due = checkTimers();
    let nextEvent = null;
    if(due.length) nextEvent = "event_"+due[0].event;
    if(!nextEvent) nextEvent = "dogs_pack";
    app.classList.add("fade-out");
    setTimeout(()=>{
      app.innerHTML = `
        <div class="scene">
          <div class="scene-inner">
            <div class="status">
              <span>${state.name}</span>
              <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
              <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
            </div>
            <p class="text after-text">${lines.join("\n\n")}</p>
            <div class="choices"><button id="contBtn">Дальше</button></div>
          </div>
        </div>`;
      const sceneEl = app.querySelector(".scene");
      sceneEl.style.background = BG.montage;
      document.getElementById("contBtn").onclick = ()=>{
        app.classList.remove("fade-out");
        playScene(nextEvent);
      };
      app.classList.remove("fade-out");
    },150);
    return;
  }

  const due = checkTimers();
  let nextEvent = null;
  if(due.length) nextEvent = "event_"+due[0].event;

  if(!nextEvent && state.age>=15 && !flag("exam9_done")) nextEvent = "exam9_choice";
  if(!nextEvent && state.age>=17 && flag("school_10_11") && !flag("exam11_done")) nextEvent = "exam11_choice";

  if(!nextEvent && state.age >= 7 && state.age < 16 && state.thingLevel < 5 && !flag("moved") && !flag("orphan") && !flag("psych_ward")){
    if(state.day >= state.thingNextDay){
      state.thingNextDay = state.day + 180 + Math.floor(Math.random()*180);
      state.thingLevel += 1;
      nextEvent = "thing_event_" + state.thingLevel;
    }
  }

  if(!nextEvent && flag("psych_ward") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 12){
      state.flags.psych_start_day = state.day;
      nextEvent = "psych_final_choice";
    }
  }

  if(!nextEvent && state.age >= 65){
    if(!flag("old_done")){ state.flags.old_done = true; nextEvent = "old_age65"; }
    else nextEvent = "old_age_loop";
  }

  app.classList.add("fade-out");
  setTimeout(()=>{
    const rep = state.reputation;
    const repPercent = ((rep + 10) / 20) * 100;
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
          </div>
          <div class="reputation-bar">
            <span>Репутация:</span>
            <div class="rep-track"><div class="rep-fill ${repClass()}" style="width:${repPercent}%"></div></div>
            <span>${repLabel()}</span>
          </div>
          <p class="text after-text">${lines.join("\n\n")}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG.montage;
    document.getElementById("contBtn").onclick = ()=>{
      app.classList.remove("fade-out");
      if(nextEvent) return playScene(nextEvent);
      const pick = pickScene(getPool());
      if(pick) return playScene(pick);
      return showMontage(60);
    };
    app.classList.remove("fade-out");
  },150);
}

function advanceDay(){
  state._chain = (state._chain || 0) + 1;
  if(state._chain > 200){
    state._chain = 0;
    return showMontage(60);
  }

  state.d += 1;
  const dim = new Date(state.y, state.m, 0).getDate();
  if(state.d > dim){ state.d = 1; state.m += 1; }
  if(state.m > 12){ state.m = 1; state.y += 1; }
  state.day += 1;
  state.dailySeed = state.day * 7919 + state.y * 104729 + state.m * 1299709 + state.d * 15485863;

  if(flag("psych_ward") || flag("orphan")) return autoDay();

  if(state.m === 11 && state.d === 28 && !state.flags["_bd_"+state.y]){
    state.flags["_bd_"+state.y] = true;
    state.age += 1;
    if(state.age<12) return playScene("birthday_kid");
    if(state.age<19) return playScene("birthday_teen");
    if(state.age<65) return playScene("birthday_adult");
    return playScene("birthday_old");
  }

  const holiday = checkHoliday();
  if(holiday) return playScene(holiday);

  if(state.age >= 7 && state.age <= 17){
    const lastTeacher = state.flags.teacherLastDay || 0;
    if(state.day - lastTeacher >= 14 && seeded(makeSeed()) < 0.15){
      state.flags.teacherLastDay = state.day;
      return render(buildTeacherScene());
    }
  }

  if(state.reputation <= -4 && state.age >= 10 && seeded(makeSeed()) < 0.4){
    setMental(-1);
  }

  if(state.age >= 50){
    state.dementia = Math.min(10, state.dementia + (seeded(makeSeed())<.3?1:0));
    if(state.dementia >= 8 && seeded(makeSeed()) < .25){
      return playScene("dementia_crisis");
    }
  }

  if(state.age >= 7 && state.age < 16 && state.thingLevel < 5 && !flag("moved") && !flag("orphan") && !flag("psych_ward")){
    if(state.day >= state.thingNextDay){
      state.thingNextDay = state.day + 180 + Math.floor(Math.random()*180);
      state.thingLevel += 1;
      return playScene("thing_event_" + state.thingLevel);
    }
  }

  if(state.age>=15 && !flag("exam9_done")) return playScene("exam9_choice");
  if(state.age>=17 && flag("school_10_11") && !flag("exam11_done")) return playScene("exam11_choice");

  autoDay();
}

function autoDay(){
  if(flag("psych_ward") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 12){
      state.flags.psych_start_day = state.day;
      return playScene("psych_final_choice");
    }
    return playScene("psych_ward_loop");
  }

  if(flag("orphan") && !flag("adopted") && !flag("orphan_free")){
    if(!flag("orphan_intro_done")){
      state.flags.orphan_intro_done = true;
      return playScene("orphan_home");
    }
    return playScene(pickScene(ORPHAN_POOL));
  }

  if(state.age >= 7 && state.age < 46 && !flag("dogs_met") && state.day >= 3){
    return playScene("dogs_pack");
  }

  if(flag("grudge") && rel("anya")<-3 && state.age>=16 && state.age<45 && !flag("revenge_done")){
    state.flags.revenge_done = true;
    return playScene("event_anya_revenge");
  }

  if(state.thingLevel >= 3 && !flag("moved") && !flag("move_shown_"+state.thingLevel)){
    state.flags["move_shown_"+state.thingLevel] = true;
    if(seeded(makeSeed()) < .4) return playScene("thing_beg_move");
  }

  if(flag("lena_friend") && !flag("lena_dead") && !flag("lena_left")
     && rel("lena")>=5 && state.age>=18 && !flag("lena_romance") && !flag("married")
     && !flag("partner") && (state.day - (state.flags._romanceCooldown || 0) > 30)){
    state.flags._romanceCooldown = state.day;
    return playScene("lena_romance_start");
  }

  if(flag("lena_romance") && !flag("married_lena") && state.age>=20 && rel("lena")>=7
     && !flag("lena_proposal_seen") && seeded(makeSeed())<.4
     && (state.day - (state.flags._proposalCooldown || 0) > 60)){
    state.flags._proposalCooldown = state.day;
    state.flags.lena_proposal_seen = true;
    return playScene("lena_proposal");
  }

  if((flag("married_lena") || flag("married_uni")) && !flag("first_night_done") && seeded(makeSeed())<.4){
    return playScene("first_night");
  }

  if((flag("married_lena") || flag("married_uni")) && !flag("child") && state.age>=22
     && !flag("child_seen") && seeded(makeSeed())<.25){
    state.flags.child_seen = true;
    return playScene("child_talk");
  }

  if((flag("married_lena") || flag("married_uni")) && flag("child") && seeded(makeSeed())<.3){
    return playScene("family_life");
  }

  if((flag("lena_dead") || flag("lena_left") || rel("lena")<3 || !flag("lena_friend"))
     && !flag("uni_friend") && state.age>=18 && !flag("married") && !flag("partner")
     && (state.day - (state.flags._uniCooldown || 0) > 20)){
    if(seeded(makeSeed()) < .5){
      state.flags._uniCooldown = state.day;
      return playScene("uni_meet");
    }
  }

  if(flag("uni_friend") && !flag("uni_romance") && state.age>=19
     && rel("uni")>=5 && !flag("married") && !flag("partner")
     && (state.day - (state.flags._uniRomanceCooldown || 0) > 30)){
    state.flags._uniRomanceCooldown = state.day;
    return playScene("uni_romance_start");
  }

  if(flag("uni_romance") && !flag("married_uni") && state.age>=20 && rel("uni")>=7
     && !flag("uni_proposal_seen") && seeded(makeSeed())<.4
     && (state.day - (state.flags._uniProposalCooldown || 0) > 60)){
    state.flags._uniProposalCooldown = state.day;
    state.flags.uni_proposal_seen = true;
    return playScene("uni_proposal");
  }

  if(state.age>=65){
    if(!flag("old_done")){state.flags.old_done=true;return playScene("old_age65");}
    return playScene("old_age_loop");
  }

  const skipChance = 0.6;
  if(seeded(makeSeed()) < skipChance){
    let skipDays;
    if(state.age < 12) skipDays = 3 + Math.floor(seeded(state.dailySeed+1)*4);
    else if(state.age < 18) skipDays = 5 + Math.floor(seeded(state.dailySeed+2)*10);
    else if(state.age < 50) skipDays = 7 + Math.floor(seeded(state.dailySeed+3)*20);
    else skipDays = 10 + Math.floor(seeded(state.dailySeed+4)*25);
    return showMontage(skipDays);
  }

  const pick = pickScene(getPool());
  if(pick) return playScene(pick);
  return showMontage(60);
}

function startScreen(){
  app.classList.remove("fade-out");
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Новая жизнь</span></div>
        <p class="text">Как тебя зовут?</p>
        <input id="nameInput" class="name-input" maxlength="20" placeholder="Имя" autocomplete="off">
        <div class="choices"><button id="btnOk">Дальше</button></div>
      </div>
    </div>`;
  const input = document.getElementById("nameInput");
  input.focus();
  const go = () => {
    const v = input.value.trim();
    if(v.length < 1){ input.placeholder = "Введи имя"; input.focus(); return; }
    state.name = v;
    genderScreen();
  };
  document.getElementById("btnOk").onclick = go;
  input.onkeydown = e => { if(e.key === "Enter") go(); };
}

function genderScreen(){
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Имя: ${state.name}</span></div>
        <p class="text">Ты девочка или мальчик?</p>
        <div class="choices">
          <button data-g="girl">Девочка</button>
          <button data-g="boy">Мальчик</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      state.gender = b.dataset.g;
      scenes = initScenes();
      playScene("first_day_school");
    };
  });
}

startScreen();
</script>
