<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жизнь</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a0a0a;color:#ddd;font-family:'Courier New',monospace;min-height:100vh}
  #app{min-height:100vh;transition:opacity .2s ease}
  #app.fade-out{opacity:0}
  .scene{position:relative;min-height:100vh;padding:4rem 2rem 8rem;background:#111 center/cover no-repeat;animation:fadeIn .3s ease}
  .scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:0}
  .scene>*{position:relative;z-index:1}
  .scene-inner{max-width:720px;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .text{font-size:1.15rem;line-height:1.7;margin-bottom:1rem;min-height:3em;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:pre-line}
  .after-text{font-size:1.05rem;line-height:1.75;color:#c8c8c8;font-style:italic;white-space:pre-line}
  .status{font-size:.85rem;color:#888;margin-bottom:1.5rem;letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:.6rem}
  .status .low{color:#c33}
  .reputation-bar{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:#888;margin-bottom:1.2rem}
  .rep-track{flex:1;height:8px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;overflow:hidden}
  .rep-fill{height:100%;background:#555;transition:width .4s,background .4s}
  .rep-fill.rep-low{background:#8a2222}
  .rep-fill.rep-mid{background:#8a6a2a}
  .rep-fill.rep-high{background:#2a8a3a}
  .choices button{display:block;width:100%;margin:.5rem 0;padding:.85rem 1.1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:1rem;text-align:left;transition:background .2s,transform .1s,border-color .2s}
  .choices button:hover{background:rgba(40,40,40,.95);transform:translateX(4px);border-color:#555}
  .name-input{width:100%;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;font-family:inherit;font-size:1.1rem;margin-bottom:1rem}
  .name-input:focus{outline:none;border-color:#666}
  .death-screen{min-height:100vh;padding:6rem 2rem 10rem;text-align:center;max-width:720px;margin:0 auto;animation:fadeIn .5s ease;display:flex;flex-direction:column;justify-content:center}
  .counter{color:#666;font-size:.9rem;margin-top:2rem}
  .death-screen button{margin:1rem auto 0;padding:.8rem 2rem;background:transparent;color:#eee;border:1px solid #555;cursor:pointer;font-family:inherit;font-size:1rem}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px)}}
  .shake{animation:shake .25s 3}
  .back-btn{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform:translateX(-50%);
    padding:.6rem 1.4rem;
    background:rgba(20,20,20,.9);
    color:#ccc;
    border:1px dashed #444;
    border-radius:6px;
    font-family:inherit;
    font-size:.9rem;
    cursor:pointer;
    z-index:50;
    opacity:.75;
    transition:opacity .2s,background .2s;
  }
  .back-btn:hover{opacity:1;background:rgba(40,40,40,.95)}
  .back-btn:active{transform:translateX(-50%) scale(.96)}
  @media (max-width:600px){.scene{padding:2rem 1rem 7rem}.text{font-size:1rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BG = {
  home:"linear-gradient(135deg,#1a1510,#0a0805)",
  corridor:"linear-gradient(135deg,#1a1a22,#0d0d12)",
  corridor_night:"linear-gradient(135deg,#05050a,#1a0a0a)",
  street:"linear-gradient(135deg,#0f1218,#05070a)",
  school:"linear-gradient(135deg,#141821,#0a0d12)",
  basement:"linear-gradient(135deg,#0a0505,#000)",
  hospital:"linear-gradient(135deg,#141a1a,#0a1010)",
  forest:"linear-gradient(135deg,#0a120a,#050805)",
  road:"linear-gradient(135deg,#1a1a1a,#0a0a0a)",
  rooftop:"linear-gradient(135deg,#0a0a14,#05050a)",
  psych:"linear-gradient(135deg,#1a0a1a,#0a050a)",
  park:"linear-gradient(135deg,#0a1a10,#050a08)",
  orphanage:"linear-gradient(135deg,#12100a,#080605)",
  neighbor:"linear-gradient(135deg,#1a1410,#0a0806)",
  montage:"linear-gradient(135deg,#0d0d0d,#050505)",
  holiday:"linear-gradient(135deg,#1a0a0a,#0a0505)",
};

const state = {
  name:"", gender:"boy",
  y:2015, m:9, d:1, age:5, day:0,
  fear:0, guilt:0, stamina:10, karma:0, mental:10,
  reputation:0,
  flags:{}, relations:{}, timers:[],
  deathCause:null, deathAge:null, killer:null,
  seenEndings:new Set(),
  thingLevel:0,
  recentScenes:[],
  recentMontage:[],
  usedMontage:{},
  usedHolidays:{},
  dementia:0,
  scenePlayCount:{},
  dailySeed:1,
  _chain:0,
  _skipCount:0,
  _history:[],
  _currentSceneId:null,
};

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const fmtDate = () => `${state.d} ${MONTHS[state.m-1]} ${state.y}`;
const flag = n => !!state.flags[n];
const rel  = n => state.relations[n] ?? 0;
const setRel = (n,d) => { state.relations[n] = Math.max(-10,Math.min(10,rel(n)+d)); };
const setMental = d => { state.mental = Math.max(1,Math.min(10,state.mental+d)); };
const schedule = (days,event) => state.timers.push({day:state.day+days,event});
const checkTimers = () => {
  const due = state.timers.filter(t=>t.day<=state.day);
  state.timers = state.timers.filter(t=>t.day>state.day);
  return due;
};
const starStr = n => "★".repeat(n)+"☆".repeat(10-n);
const g  = (m,f) => state.gender === "girl" ? f : m;
const F = () => state.gender === "girl" ? "Саша" : "Лена";
const fHe = () => state.gender === "girl" ? "он" : "она";
const fHeCap = () => state.gender === "girl" ? "Он" : "Она";
const fE = () => state.gender === "girl" ? "его" : "её";
const fGender = () => state.gender === "girl" ? "мальчик" : "девочка";
const fHair = () => state.gender === "girl" ? "взлохмаченными волосами" : "двумя косичками";
const fClothes = () => state.gender === "girl" ? "костюм" : "платье";
const fA = () => state.gender === "girl" ? "" : "а";

const U = () => state.gender === "girl" ? "Вадим" : "Света";
const uHe = () => state.gender === "girl" ? "он" : "она";
const uHeCap = () => state.gender === "girl" ? "Он" : "Она";
const uE = () => state.gender === "girl" ? "его" : "её";
const uA = () => state.gender === "girl" ? "" : "а";

const spouseName = () => {
  if(flag("married_lena")) return F();
  if(flag("married_uni")) return U();
  return "партнёр";
};
const spouseHe = () => {
  if(flag("married_lena")) return fHe();
  if(flag("married_uni")) return uHe();
  return "он";
};
const spouseHeCap = () => {
  if(flag("married_lena")) return fHeCap();
  if(flag("married_uni")) return uHeCap();
  return "Он";
};
const spouseE = () => {
  if(flag("married_lena")) return fE();
  if(flag("married_uni")) return uE();
  return "его";
};
const spouseRelName = () => flag("married_lena") ? "lena" : "uni";

const lowMentalActive = () => state.mental <= 2;
const glance = () => lowMentalActive() ? "Люди отводят взгляды. " : "";

const repLabel = () => {
  const r = state.reputation;
  if(r <= -6) return "изгой";
  if(r <= -2) return "нелюдимый";
  if(r <= 2) return "обычный";
  if(r <= 6) return "уважаемый";
  return "авторитет";
};
const setRep = d => { state.reputation = Math.max(-10, Math.min(10, state.reputation + d)); };
const repClass = () => {
  const r = state.reputation;
  if(r <= -2) return "rep-low";
  if(r <= 2) return "rep-mid";
  return "rep-high";
};

function seeded(seed){
  let x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function makeSeed(){
  state.dailySeed = state.day * 7919 + state.y * 104729 + state.m * 1299709 + state.d * 15485863 + (state.scenePlayCount._extra||0) * 31;
  state.scenePlayCount._extra = (state.scenePlayCount._extra||0) + 1;
  return state.dailySeed;
}

const MAX_REPEATS = 2;
function sceneAllowed(id){
  const s = scenes[id];
  if(!s) return false;
  if(typeof s === "function") return true;
  if(s.when && !s.when()) return false;
  const count = state.scenePlayCount[id] || 0;
  const max = s.maxRepeats ?? MAX_REPEATS;
  return count < max;
}
function markScenePlayed(id){
  state.scenePlayCount[id] = (state.scenePlayCount[id] || 0) + 1;
}

function pickScene(pool){
  const valid = pool.filter(id => sceneAllowed(id));
  if(!valid.length) return null;
  const recent = state.recentScenes;
  const limit = Math.min(12, Math.max(3, valid.length - 1));
  const recentSlice = recent.slice(-limit);
  const avail = valid.filter(id => !recentSlice.includes(id));
  const src = avail.length ? avail : valid;
  const seed = makeSeed();
  const idx = Math.floor(seeded(seed) * src.length);
  const pick = src[Math.min(idx, src.length - 1)];
  state.recentScenes.push(pick);
  if(state.recentScenes.length > 24) state.recentScenes.shift();
  return pick;
}

/* ===== ИСТОРИЯ / ОТКАТ ===== */

function snapshotState(){
  return {
    y: state.y, m: state.m, d: state.d, age: state.age, day: state.day,
    fear: state.fear, guilt: state.guilt, stamina: state.stamina,
    karma: state.karma, mental: state.mental, reputation: state.reputation,
    flags: JSON.parse(JSON.stringify(state.flags)),
    relations: JSON.parse(JSON.stringify(state.relations)),
    timers: JSON.parse(JSON.stringify(state.timers)),
    deathCause: state.deathCause,
    deathAge: state.deathAge,
    killer: state.killer,
    seenEndings: new Set(state.seenEndings),
    thingLevel: state.thingLevel,
    recentScenes: state.recentScenes.slice(),
    recentMontage: state.recentMontage.slice(),
    usedMontage: JSON.parse(JSON.stringify(state.usedMontage)),
    usedHolidays: JSON.parse(JSON.stringify(state.usedHolidays)),
    dementia: state.dementia,
    scenePlayCount: JSON.parse(JSON.stringify(state.scenePlayCount)),
    dailySeed: state.dailySeed,
    _chain: state._chain,
    _skipCount: state._skipCount,
  };
}
function restoreState(snap){
  state.y = snap.y; state.m = snap.m; state.d = snap.d;
  state.age = snap.age; state.day = snap.day;
  state.fear = snap.fear; state.guilt = snap.guilt;
  state.stamina = snap.stamina; state.karma = snap.karma;
  state.mental = snap.mental; state.reputation = snap.reputation;
  state.flags = JSON.parse(JSON.stringify(snap.flags));
  state.relations = JSON.parse(JSON.stringify(snap.relations));
  state.timers = JSON.parse(JSON.stringify(snap.timers));
  state.deathCause = null; state.deathAge = null; state.killer = null;
  state.seenEndings = new Set(snap.seenEndings);
  state.thingLevel = snap.thingLevel;
  state.recentScenes = snap.recentScenes.slice();
  state.recentMontage = snap.recentMontage.slice();
  state.usedMontage = JSON.parse(JSON.stringify(snap.usedMontage));
  state.usedHolidays = JSON.parse(JSON.stringify(snap.usedHolidays));
  state.dementia = snap.dementia;
  state.scenePlayCount = JSON.parse(JSON.stringify(snap.scenePlayCount));
  state.dailySeed = snap.dailySeed;
  state._chain = snap._chain;
  state._skipCount = snap._skipCount;
}
function pushHistory(sceneId, sceneObj){
  if(!state._history) state._history = [];
  state._history.push({ sceneId, sceneObj, snap: snapshotState() });
  if(state._history.length > 50) state._history.shift();
}
function goBack(){
  if(!state._history || state._history.length < 2) return false;
  state._history.pop();
  const prev = state._history[state._history.length - 1];
  restoreState(prev.snap);
  render(prev.sceneObj);
  return true;
}
function clearBackButtons(){
  document.querySelectorAll(".back-btn").forEach(b => b.remove());
}

/* ===== МОНТАЖ ===== */

const MONTAGE_ARCS = [
  `Утро началось с будильника, которого ты не помнишь. Ты оделся, вышел, дошёл до школы — и только на крыльце понял, что не взял тетрадь.\n\nДень прошёл вязко: уроки, перемены, чей-то смех в коридоре. К вечеру ты уже не помнил, что было утром.`,
  `Первый день после каникул. В классе пахло краской и чужими куртками — как в тот первый раз, когда ты стоял у ворот.\n\nТы сел на своё место и долго смотрел в окно. За окном тополь ронял листья. Ничего не изменилось. И всё изменилось.`,
  `Утро было серым. Ты шёл в школу и считал шаги — до ста сбился, начал заново.\n\nДнём кто-то спросил, как дела. Ты сказал: «Нормально». Это было правдой ровно наполовину.`,
  `Весь день шёл дождь. Ты не выходил из дома и смотрел, как капли ползут по стеклу.\n\nК вечеру дождь кончился. Ты вышел на балкон. Воздух был мокрый и чужой, как будто ты вернулся из другой страны.`,
  `Мать пекла пирог. Пахло так, что ты забыл обо всём — про школу, про уроки, про то, что надо было сделать ещё вчера.\n\nВечером вы сидели на кухне вдвоём. Она рассказывала что-то из своей молодости. Ты слушал и не перебивал.`,
  `Ты нашёл на улице монетку. Карман стал тяжелее на одну копейку.\n\nПотом ты нашёл ещё одну. И ещё. К вечеру в кармане было семь монет — и ни одна из них не была нужна.`,
  `Соседский кот пришёл к подъезду и мяукал, пока ты не вышел. Ты стоял с ним на крыльце, пока не замёрзли руки.\n\nКот ушёл первым. Ты вернулся домой и долго не мог согреться.`,
  `Утро. Будильник. Ты не помнишь, как оделся — но вот ты уже в дверях.\n\nДень прошёл как один выдох: школа, дом, сон. Между ними — ничего, что стоило бы запомнить.`,
  `Телефон разрядился ещё ночью. Ты весь день провёл в тишине — без музыки, без сообщений, без чужого голоса в ушах.\n\nК вечеру тишина стала привычной. Ты даже не сразу включил телефон, когда он зарядился.`,
  `Ты читал старую книгу и не запомнил ни строчки. Слова шли мимо — ровно, как поезд за окном.\n\nК ночи ты закрыл книгу на той же странице, на которой открыл. И долго смотрел в потолок.`,
  `Во дворе дети играли в футбол. Ты смотрел из окна и вспоминал, как сам когда-то бегал так же — до темноты, до сбитых коленок.\n\nПотом стемнело. Дети ушли. Мяч остался лежать у качелей.`,
  `Ты заснул на уроке и проспал перемену. Учительница не заметила — или сделала вид.\n\nПроснулся ты от того, что кто-то рядом двигал стулом. За окном было уже другое небо.`,
  `Кто-то написал на парте твоё имя. Ты стёр его рукавом — и через минуту не смог вспомнить, как оно выглядело.\n\nВесь день ты думал, кто это был. Так и не придумал.`,
  `Ты долго стоял перед зеркалом и не узнавал себя. Не потому, что изменился — а потому, что смотрел слишком долго.\n\nКогда ты отошёл, лицо в зеркале осталось. На секунду тебе показалось, что оно дышит.`,
  `На кухне прорвало кран. Отец ругался весь вечер, мать вытирала воду с пола.\n\nТы сидел в комнате и слушал. Это было привычно. Как будто ничего другого и быть не могло.`,
  `Ты нашёл в кармане записку, которую сам же и писал. Почерк был твой, но слова — чужие.\n\nТы перечитал её три раза. Ничего не понял. Спрятал обратно в карман.`,
  `Ты помог соседке донести сумку. Она сказала «спасибо» — коротко, не глядя.\n\nДома ты долго думал, почему это «спасибо» не согрело.`,
  `День был серым. Ты не запомнил ни одного лица — только руки, двери, спины.\n\nК вечеру ты понял, что не помнишь даже, что ел на обед.`,
  `Ты смотрел, как воробей клевал крошку. Пять минут. Или десять — ты не считал.\n\nКогда воробей улетел, стало тише. Ты ещё постоял немного.`,
  `Мать спросила, всё ли хорошо. Ты кивнул и вышел из комнаты.\n\nНочью ты лежал и думал: а ведь можно было сказать «нет». Но ты не сказал.`,
  `Ты проспал до полудня и чувствовал себя странно — как будто день уже прошёл без тебя.\n\nВторую половину дня ты провёл, пытаясь наверстать. Не получилось.`,
  `На лестнице пахло краской — кто-то делал ремонт. Ты поднимался медленно, вдыхая этот запах.\n\nДома ты сел у окна и долго смотрел, как во дворе ходят люди. Их было много. Ты не знал никого.`,
  `Ты нашёл под кроватью старую тетрадь с рисунками. Своими. Ты не помнил, что рисовал их.\n\nНа последней странице был нарисован ты. Но без лица.`,
  `Весь день ты слышал шаги над головой. Никого не было дома — ты знал это точно.\n\nК вечеру шаги стихли. Ты поднял голову к потолку и долго смотрел на трещину в углу.`,
  `Ты выучил новое слово. Оно тебе не пригодилось — но ты повторял его про себя весь день.\n\nК ночи оно потеряло смысл. Ты произнёс его вслух. Звук был пустой.`,
  `Ты смотрел в окно автобуса и представлял, что уезжаешь навсегда. За стеклом проплывали чужие улицы, чужие дома, чужие жизни.\n\nНа остановке ты не вышел.`,
  `Кто-то позвонил и молчал в трубку. Ты тоже молчал. Так прошло минуты две.\n\nПотом ты положил трубку. И весь день думал, кто это был.`,
  `Ты забыл ключи и ждал под дверью два часа. Мимо проходили соседи. Никто не спросил, почему ты сидишь на полу.\n\nКогда пришла мать, ты уже не помнил, зачем вообще выходил.`,
  `В подъезде погас свет. Ты поднимался на ощупь, считая ступеньки.\n\nНа своей площадке ты постоял минуту в темноте. Не хотелось входить.`,
  `Ты переписывал одно предложение в тетради двадцать раз. Каждый раз получалось чуть иначе.\n\nВ итоге ты закрыл тетрадь, так и не выбрав, какое лучше.`,
  `Вечером ты смотрел на звёзды и не загадывал желание. Просто смотрел, как они мерцают.\n\nОдна звезда погасла. Ты не стал ждать, пока загорится снова.`,
  `Ты нашёл на балконе старую фотографию. Не узнал никого — но долго держал её в руках.\n\nПотом положил обратно. Туда же, где взял.`,
  `Соседский мальчик спросил, не видел ли ты его мяч. Ты не видел.\n\nОн ушёл — а ты ещё постоял во дворе, глядя на кусты. На всякий случай.`,
  `Ты весь день молчал — сам себе удивляясь. Слова были, но не выходили.\n\nК вечеру ты заговорил — и голос оказался чужим.`,
  `Мать ушла рано. Ты не заметил, как день закончился.\n\nСпохватился только когда стемнело. Включил свет. Дом был пустой, как всегда.`,

function pickMontageArc(days){
  const totalDays = Math.max(3, Math.min(days, 60));
  const arcsCount = Math.min(6, Math.max(3, Math.ceil(totalDays / 10)));
  const usedArcs = [];
  const usedIdx = new Set();
  for(let i=0;i<arcsCount;i++){
    const avail = MONTAGE_ARCS.map((arc, idx) => ({arc, idx, time: ARC_TIMES[idx]})).filter(x => !usedIdx.has(x.idx) && !state.recentMontage.includes(x.arc));
    const pool = avail.length ? avail : MONTAGE_ARCS.map((arc, idx) => ({arc, idx, time: ARC_TIMES[idx]})).filter(x => !usedIdx.has(x.idx));
    const src = pool.length ? pool : MONTAGE_ARCS.map((arc, idx) => ({arc, idx, time: ARC_TIMES[idx]}));
    const seed = state.dailySeed + 7777 + i * 31;
    const pick = src[Math.floor(seeded(seed) * src.length)];
    usedIdx.add(pick.idx);
    usedArcs.push(pick);
    state.recentMontage.push(pick.arc);
    if(state.recentMontage.length > 12) state.recentMontage.shift();
  }
  const lines = [];
  for(let i=0;i<usedArcs.length;i++){
    if(i > 0){
      const prevTime = usedArcs[i-1].time;
      const curTime = usedArcs[i].time;
      const bridgeKey = prevTime === curTime ? `same_${prevTime}` : `${prevTime}_to_${curTime}`;
      const bridgeArr = BRIDGES[bridgeKey] || BRIDGES["morning_to_day"];
      const bridge = bridgeArr[Math.floor(seeded(state.dailySeed + i * 17 + 3) * bridgeArr.length)];
      lines.push(bridge);
    }
    lines.push(usedArcs[i].arc);
  }
  return lines;
}

let audioCtx=null;
const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){
  try{
    const ctx=getCtx();
    if(ctx.state==="suspended")ctx.resume();
    if(name==="glitch"){
      const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=ctx.createBufferSource();s.buffer=buf;
      const gn=ctx.createGain();
      gn.gain.setValueAtTime(.4,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
      s.connect(gn).connect(ctx.destination);s.start();
    }
    if(name==="heartbeat"){
      const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain();
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15);
        gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25);
      };
      const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35);
    }
  }catch(e){}
}

function buildTeacherScene(){
  const seed = makeSeed();
  const qi = Math.floor(seeded(seed) * QUESTIONS.length);
  const q = QUESTIONS[qi];
  const answers = [q.correct, ...q.wrong].sort((a,b)=>seeded(seed + a.charCodeAt(0)) - 0.5);
  return {
    bg:"school",
    text:`Марина Павловна стучит указкой по доске. В классе двадцать три человека. Все смотрят в журнал.\n\n— ${state.name}. К доске.\n\nКласс затихает. Кто-то хихикает. У тебя потеют ладони.\n\n— Вопрос по ${q.subject}: ${q.q}`,
    choices: answers.map(a => ({
      text: a,
      effects: ()=>{
        if(a === q.correct){ setMental(+1); setRel("teacher", +1); setRep(+1); }
        else { setMental(-1); state.guilt += 1; setRep(-1); }
      },
      next: a === q.correct ? "teacher_correct" : "teacher_wrong",
    }))
  };
}

friend_first_friends: { maxRepeats:1, bg:"corridor", text:`Звонок. Резкий, дребезжащий — как будто где-то упала кастрюля.\n\n${F()} вскакивает. Отряхивает крошки с колен. Смотрит на часы — большие, с трещиной на стекле.\n\n— Пошли, а то опоздаем. Марина Павловна злая, когда опаздывают. Она указкой стучит по столу — бам-бам-бам — и все вздрагивают. Даже Дима, а он самый высокий.\n\n${fHeCap()} хватает тебя за руку. Тащит по коридору.`,
  next:"first_day_class"},

first_day_class: { maxRepeats:1, bg:"school", text:`Класс. Одиннадцать детей. Белые стены. Доска с мелом. Запах мокрой тряпки — как будто здесь только что мыли пол.\n\nУчительница — высокая, в очках, с указкой. Смотрит на тебя поверх очков. Долго. Потом переводит взгляд на журнал.\n\n— ${g("Новенький","Новенькая")}? Садись с ${F()}. ${fHeCap()} у нас... разговорчив${fA()}.\n\nКласс смеётся. ${F()} показывает язык. Кому-то конкретному. В третьем ряду. Не тебе.`,
  choices:[
    {text:`Улыбнуться ${F()}.`, effects:()=>{setRel("lena",+1);setRep(+1);}, next:"first_day_after"},
    {text:"Сесть тихо.", effects:()=>{}, next:"first_day_after"},
  ]},

first_day_after: { maxRepeats:1, bg:"school", text:`Последний урок закончился. Дети вываливаются из класса с криками. Кто-то бежит к раздевалке, кто-то — к воротам, где уже ждут родители.\n\n${F()} ждёт тебя у скамейки. Где вы познакомились. Рюкзак у ${fE()} ног. ${fHair()} растрёпаны. Сушка давно кончилась.\n\n— Ну что, — говорит ${fHe()}. — Ты как? Первый день — самый страшный. Дальше легче. Правда.`,
  choices:[
    {text:`— Спасибо, что помог${fA()}.`, effects:()=>{setRel("lena",+2);setRep(+1);}, next:"next_day"},
    {text:"— Как тебя зовут?", next:"next_day"},
    {text:"— А ты всегда тут сидишь?", next:"next_day"},
  ]},

first_day_alone: { maxRepeats:1, bg:"school", text:`Ты идёшь по коридору один. Урок уже начался. Из-за дверей доносится ровный голос учительницы.\n\nПрисаживаешься на подоконник. Так проходит час. Потом ещё один.\n\nТебя находят.`,
  next:"next_day"},

home_age6: { maxRepeats:1, bg:"home", when:()=>!flag("home_seen"),
  text:`Дома тихо. Мать на кухне — гремит посудой. Отец не вернулся с работы. Третий вечер подряд.\n\nИз подвала доносится шорох. Будто кто-то перебирает старые вещи. Медленно. Как будто ищет что-то конкретное.\n\nНо в подвале нет вещей. Только пустые полки и мокрое пятно на полу, которое никогда не высыхает. Ты проверял${g("","а")} вчера. И позавчера.`,
  choices:[
    {text:"Пойти в подвал.", effects:()=>{state.fear+=2;state.flags.basement_seen=true;state.flags.home_seen=true;}, next:"basement_age6"},
    {text:"Спрятаться под одеяло.", effects:()=>{state.fear+=1;setRel("mother",+1);state.flags.home_seen=true;}, next:"home_night_age6"},
    {text:"Позвать мать.", effects:()=>{setRel("mother",+2);state.flags.home_seen=true;}, next:"mother_kitchen_age6"},
  ]},

basement_age6: { maxRepeats:1, bg:"basement", text:`Темно. Пахнет сыростью и чем-то ещё. Сладковатым. Как испорченное варенье.\n\nЧто-то шевелится в углу. Ты не можешь разглядеть — только тень, слишком густую для такой темноты.`,
  choices:[
    {text:"Подойти ближе.", effects:()=>{state.fear+=4;}, next:"basement_thing_age6"},
    {text:"Бежать наверх.", effects:()=>{state.fear+=1;}, next:"home_night_age6"},
    {text:"Замереть.", effects:()=>{state.fear+=2;}, next:"basement_wait"},
  ]},

basement_wait: { maxRepeats:1, bg:"basement", text:`Ты стоишь. Не дышишь. Шорох стихает.\n\nИ тогда ты слышишь голос. Тихий, детский. Свой собственный. Но будто из другой комнаты.\n\n— Не уходи. Мне скучно.`,
  choices:[
    {text:"— Кто ты?", effects:()=>{state.fear+=3;}, next:"basement_answer_age6"},
    {text:"Убежать.", effects:()=>{setMental(-1);}, next:"home_night_age6"},
  ]},

basement_thing_age6: { maxRepeats:1, bg:"basement", text:`Оно смотрит. У него нет лица. Но ты знаешь: оно улыбается.\n\nКак ты это знаешь? Ты не можешь объяснить.`,
  choices:[
    {text:"— Кто ты?", effects:()=>{state.fear+=5;}, next:"basement_answer_age6"},
    {text:"Ударить.", effects:()=>{state.karma-=3;die("thing_take",6);}},
    {text:"Обнять.", effects:()=>{state.flags.hugged_it=true;setMental(-2);}, next:"next_day"},
  ]},

basement_answer_age6: { maxRepeats:1, bg:"basement", text:`— Я — то, что останется, когда все уйдут.\n\nГолос тихий. Спокойный. Как будто говорит о погоде. Как будто это самая обычная вещь на свете.\n\n— Ты тоже останешься. Потом.`,
  next:"home_night_age6"},

mother_kitchen_age6: { maxRepeats:1, bg:"home", text:`Мать обнимает. От неё пахнет мукой и потом — тёплым, живым.\n\n— Всё хорошо, милый.\n\nОна врёт. Ты чувствуешь это. Но не говоришь.`,
  choices:[
    {text:"Поверить.", effects:()=>{setRel("mother",+2);}, next:"home_night_age6"},
    {text:"Спросить про подвал.", effects:()=>{state.fear+=2;setRel("mother",-1);}, next:"mother_lies_age6"},
  ]},

mother_lies_age6: { maxRepeats:1, bg:"home", text:`— Там ничего нет.\n\nЕё руки дрожат над раковиной. Она моет одну и ту же тарелку третий раз.\n\nТы видишь это в отражении окна. Она думает, что ты не видишь.`,
  next:"home_night_age6"},

home_night_age6: { maxRepeats:1, bg:"home", text:`Ночь. Ты не спишь.\n\nСлышишь шаги на лестнице. Медленные. Тяжёлые.`,
  choices:[
    {text:"Выйти в коридор.", effects:()=>{state.fear+=3;}, next:"stairs_age6"},
    {text:"Закрыть глаза.", effects:()=>{state.fear+=1;}, next:"next_day"},
  ]},

stairs_age6: { maxRepeats:1, bg:"home", text:`На лестнице никого.\n\nНо на верхней ступеньке — мокрый след. Босой. Маленький.\n\nКак у ребёнка.`,
  next:"next_day"},

dogs_pack: { maxRepeats:1, bg:"street", when:()=>state.age>=7 && state.age<=45 && !flag("dogs_met"),
  text:`Ты возвращаешься домой. У гаражей — стая собак. Четыре или пять. Они не лают. Просто смотрят.\n\nВожак — большой пёс с белым пятном на боку. Делает шаг вперёд. Останавливается. Ждёт.\n\nТы слышишь, как где-то далеко лает другая собака. Но эта стая молчит.`,
  choices:[
    {text:"Замахнуться.", effects:()=>{state.flags.dogs_met=true;state.flags.dogs_aggressive=true;}, next:"dogs_chase"},
    {text:"Покормить.", when:()=>!flag("dogs_fed"), effects:()=>{state.flags.dogs_met=true;state.flags.dogs_fed=true;state.flags.dogs_friendly=true;setRel("dogs",+3);setRep(+1);}, next:"dogs_feed"},
    {text:"Пройти мимо.", effects:()=>{state.flags.dogs_met=true;}, next:"next_day"},
  ]},

dogs_feed: { maxRepeats:1, bg:"street", text:`Вожак берёт хлеб из твоих рук. Остальные ждут. Ты делишь остатки — по кусочку каждому.\n\nКогда ты уходишь, стая идёт за тобой до подъезда. Не близко. Просто идут.`,
  next:"next_day"},

dogs_chase: { maxRepeats:1, bg:"street", text:`Ты бежишь. За спиной — топот лап и дыхание. Ты уже не думаешь. Просто бежишь.`,
  choices:[
    {text:"Бежать к подъезду.", effects:()=>{ if(seeded(makeSeed()) < 0.6) return "dogs_escaped"; die("dogs_attack", state.age, "стая собак"); }},
    {text:"Залезть на дерево.", effects:()=>{ if(seeded(makeSeed()) < 0.5) return "dogs_escaped_tree"; die("dogs_attack", state.age, "стая собак"); }},
    {text:"Крикнуть на них.", effects:()=>{ if(seeded(makeSeed()) < 0.3) return "dogs_escaped_shout"; state.stamina -= 3; die("dogs_attack", state.age, "стая собак"); }},
  ]},

dogs_escaped: { maxRepeats:1, bg:"street", text:`Ты влетаешь в подъезд. Захлопываешь дверь.\n\nСобаки остаются снаружи. Слышно, как они скребут лапами. Потом стихают.`,
  next:"next_day"},
dogs_escaped_tree: { maxRepeats:1, bg:"street", text:`Ты забираешься на тополь. Ветки тонкие, но держат.\n\nСобаки сидят внизу. Смотрят. Через полчаса уходят. Ты спускаешься, дрожа.`,
  next:"next_day"},
dogs_escaped_shout: { maxRepeats:1, bg:"street", text:`Ты разворачиваешься и кричишь.\n\nВожак останавливается. Смотрит. Потом садится. Вся стая садится.\n\nИ они просто смотрят, как ты уходишь.`,
  next:"next_day"},

dogs_rescue: { maxRepeats:1, bg:"street", when:()=>flag("dogs_friendly") && !flag("dogs_rescue_done"),
  text:`Двое незнакомых парней преграждают тебе путь. Один — с ножом.\n\n— Телефон. Быстро.\n\nТы слышишь, как за спиной кто-то рычит.`,
  choices:[
    {text:"Позвать собак.", effects:()=>{state.flags.dogs_rescue_done=true;setMental(+2);setRep(+2);}, next:"dogs_rescue_happens"},
    {text:"Отдать телефон.", effects:()=>{state.flags.dogs_rescue_done=true;setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

dogs_rescue_happens: { maxRepeats:1, bg:"street", text:`Собаки окружают парней. Не бросаются. Просто стоят. Рычат тихо.\n\nВожак смотрит прямо на нож. Через минуту парни уходят. Быстро.\n\nВожак оборачивается к тебе. Ложится у твоих ног.`,
  next:"next_day"},

neighbor_bab_valya: { maxRepeats:1, bg:"neighbor", when:()=>state.age>=7 && state.age<=14 && !flag("bab_valya_met") && !flag("orphan") && !flag("moved"),
  text:`Ты возвращаешься из школы. У подъезда сидит соседка. Баба Валя. Старая, в платке, с клюкой.\n\nОна смотрит на тебя долго. Потом машет рукой:\n\n— Подойди.`,
  choices:[
    {text:"Подойти.", effects:()=>{state.flags.bab_valya_met=true;}, next:"bab_valya_talk"},
    {text:"Пройти мимо.", effects:()=>{}, next:"next_day"},
  ]},

bab_valya_talk: { maxRepeats:1, bg:"neighbor", text:`Она берёт тебя за руку. Её пальцы сухие, как бумага.\n\n— Ты из квартиры четырнадцать? Из той, где подвал?\n\nТы киваешь. Она вздыхает. Долго. Как будто выпускает из себя весь воздух.\n\n— Я тут живу шестьдесят лет. До вас там жила семья. Тоже с ребёнком. Мальчик был. Хороший. Тихий. А потом…\n\nОна замолкает.`,
  choices:[
    {text:"— Что потом?", effects:()=>{state.fear+=2;}, next:"bab_valya_warning"},
    {text:"— Не хочу знать.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

bab_valya_warning: { maxRepeats:1, bg:"neighbor", text:`Она наклоняется ближе. Голос шёпотом.\n\n— Если услышишь его — не отвечай. Не зови. И матери скажи, чтоб съезжали. Пока не поздно.`,
  next:"next_day"},

neighbor_dog_lover: { maxRepeats:1, bg:"neighbor", when:()=>!flag("dog_lover_met"),
  text:`У подъезда сидит старик. Рядом — пожилая овчарка. Он кормит её с ладони.\n\n— Собаки — они всё помнят, — говорит он, не поднимая головы. — И добро, и зло. Ты это запомни.`,
  choices:[
    {text:"Спросить про собак.", effects:()=>{state.flags.dog_lover_met=true;}, next:"dog_lover_talk"},
    {text:"Погладить овчарку.", effects:()=>{state.flags.dog_lover_met=true;setMental(+1);}, next:"next_day"},
    {text:"Пройти мимо.", effects:()=>{state.flags.dog_lover_met=true;}, next:"next_day"},
  ]},

dog_lover_talk: { maxRepeats:1, bg:"neighbor", text:`— В моё время у меня было двенадцать собак. Всех помню по имени. И они меня помнят. Там, где сейчас.\n\nОн гладит овчарку по голове.`,
  next:"next_day"},

stray_kitten: { maxRepeats:1, bg:"street", when:()=>!flag("kitten_found") && state.age>=6,
  text:`В подвале под твоим домом мяукает котёнок. Он маленький, мокрый и дрожит.`,
  choices:[
    {text:"Взять домой.", effects:()=>{state.flags.kitten_found=true;state.flags.has_cat=true;setMental(+2);setRel("mother",-1);setRep(+1);}, next:"kitten_home"},
    {text:"Покормить.", effects:()=>{state.flags.kitten_found=true;setMental(+1);}, next:"next_day"},
    {text:"Пройти мимо.", effects:()=>{state.flags.kitten_found=true;setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

kitten_home: { maxRepeats:1, bg:"home", text:`Котёнок сидит на твоей кровати. Он ещё дрожит. Но уже мурлычет.\n\nТы гладишь его.\n\nВпервые за долгое время в доме тихо. По-хорошему тихо.`,
  next:"next_day"},

dima_bully: { maxRepeats:1, bg:"school", when:()=>state.age>=7 && state.age<=14 && !flag("dima_met"),
  text:`Дима — самый высокий в классе. Подходит к твоей парте на перемене. Кладёт ладонь на твой учебник.\n\n— ${g("Новенький","Новенькая")}. Ты чё так${g("ой","ая")} тих${g("ой","ая")}?`,
  choices:[
    {text:"Молчать.", effects:()=>{setMental(-1);state.flags.dima_met=true;setRep(-1);}, next:"next_day"},
    {text:"— Отойди.", effects:()=>{state.flags.dima_met=true;state.karma-=1;setRep(+1);}, next:"dima_fight"},
    {text:`Позвать ${F()}.`, effects:()=>{state.flags.dima_met=true;if(flag("lena_friend"))setRel("lena",+1);setRep(+1);}, next:"next_day"},
    {text:"Позвать собак.", when:()=>flag("dogs_friendly"), effects:()=>{state.flags.dima_met=true;state.flags.dogs_rescue_done=true;setRel("dogs",+1);setRep(+3);}, next:"dima_dogs"},
  ]},

dima_dogs: { maxRepeats:1, bg:"school", text:`Собака входит в школьный двор. Дима замирает.\n\nВожак садится рядом с тобой. Смотрит на него.`,
  next:"next_day"},

dima_fight: { maxRepeats:1, bg:"school", text:`Он толкает тебя в плечо. Не сильно. Проверяет.\n\n— Чё сказал${g("","а")}?`,
  choices:[
    {text:"Толкнуть в ответ.", effects:()=>{state.karma-=3;if(state.stamina>5)state.stamina-=2;else die("beaten",state.age);}, next:"next_day"},
    {text:"Отступить.", effects:()=>{setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

school_age12: { maxRepeats:1, bg:"school", when:()=>!flag("school_age12_seen"),
  text:`Тебе двенадцать. Пятый класс. Новый классный руководитель, новые предметы.\n\nИ Аня. Тихая девочка с длинными волосами. Сидит одна у окна. Её никто не любит. Ты не знаешь почему.\n\nМарина Павловна смотрит выжидающе. Куда сядешь?`,
  choices:[
    {text:"Сесть с Аней.", effects:()=>{setRel("anya",+2);state.flags.school_age12_seen=true;setRep(-1);}, next:"school_anya_friend"},
    {text:"Сесть с другими.", effects:()=>{setRel("anya",-1);state.flags.school_age12_seen=true;setRep(+1);}, next:"school_crowd"},
    {text:"Сесть одному.", effects:()=>{state.flags.loner=true;state.flags.school_age12_seen=true;setRep(-1);}, next:"school_alone"},
  ]},

school_anya_friend: { maxRepeats:1, bg:"school", text:`Аня улыбается. Вы говорите весь урок. О книгах, о кошках, о чём-то ещё.\n\nОна умная.\n\nПочему её никто не любит?`,
  choices:[
    {text:"Пригласить гулять.", effects:()=>{setRel("anya",+3);}, next:"street_age12"},
    {text:"Молчать.", effects:()=>{setRel("anya",+1);}, next:"next_day"},
  ]},

school_crowd: { maxRepeats:1, bg:"school", text:`Они смеются над Аней. Тихо, чтобы не слышала учительница.\n\nДима показывает на неё пальцем. Кто-то прыскает.\n\nТы смеёшься с ними.`,
  choices:[
    {text:"Остановиться.", effects:()=>{setRel("anya",+1);state.guilt+=2;}, next:"next_day"},
    {text:"Продолжать.", effects:()=>{setRel("anya",-3);setRep(-1);}, next:"next_day"},
  ]},

school_alone: { maxRepeats:1, bg:"school", text:`Ты один. В коридоре — зеркало.\n\nВ отражении — кто-то позади тебя.`,
  choices:[
    {text:"Обернуться.", effects:()=>{state.fear+=3;}, next:"next_day"},
    {text:"Не смотреть.", effects:()=>{state.fear+=1;}, next:"next_day"},
    {text:"Разбить зеркало.", effects:()=>{state.karma-=3;state.fear+=4;setRep(-2);}, next:"next_day"},
  ]},

school_corridor_age13: { maxRepeats:1, bg:"corridor", when:()=>!flag("corridor_seen"),
  text:`Перемена. Ты случайно толкаешь Аню. Она падает. Учебники рассыпаются.\n\nКласс замирает. Потом — смех.\n\nАня смотрит на тебя снизу вверх.`,
  choices:[
    {text:"Помочь встать.", effects:()=>{setRel("anya",+3);state.flags.kind=true;state.flags.corridor_seen=true;setRep(+2);}, next:"next_day"},
    {text:"Нагрубить.", effects:()=>{setRel("anya",-5);state.flags.grudge=true;state.flags.corridor_seen=true;setRep(-2);schedule(84,"anya_revenge");}, next:"next_day"},
    {text:"Толкнуть сильнее.", effects:()=>{setRel("anya",-8);state.flags.corridor_seen=true;setRep(-3);if(seeded(makeSeed())<0.3)die("anya_push",13,"anya");}, next:"next_day"},
  ]},

school_crush: { maxRepeats:1, bg:"school", when:()=>!flag("school_crush_done") && state.age>=13 && state.age<=16,
  text:`На перемене к тебе подходит ${g("девочка","мальчик")} из параллельного класса. Улыбается.\n\n— Ты ведь ${state.name}? Я слышал${g("","а")}, ты хорошо рисуешь.`,
  choices:[
    {text:"Поговорить.", effects:()=>{state.flags.school_crush_done=true;setMental(+2);setRep(+1);}, next:"next_day"},
    {text:"Уйти.", effects:()=>{state.flags.school_crush_done=true;setMental(-1);setRep(-1);}, next:"next_day"},
    {text:"Смутиться и убежать.", effects:()=>{state.flags.school_crush_done=true;setMental(-1);setRep(-1);}, next:"next_day"},
  ]},

school_bully_age12: { maxRepeats:1, bg:"school", when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead")&&!flag("school_bully_done"),
  text:`Старшеклассник отобрал твой рюкзак. Держит его высоко над головой и смеётся.\n\n${F()} рядом. Сжав кулаки.`,
  choices:[
    {text:`Позвать ${F()}.`, effects:()=>{state.flags.school_bully_done=true;const r=lenaProtect();if(r)return r;setRep(+1);}, next:"next_day"},
    {text:"Дать сдачи.", effects:()=>{state.flags.school_bully_done=true;if(state.stamina>5)state.stamina-=2;else die("beaten",12);setRep(+2);}, next:"next_day"},
    {text:"Отдать рюкзак.", effects:()=>{state.flags.school_bully_done=true;setMental(-2);setRep(-1);}, next:"next_day"},
  ]},

    {text:"Молчать.", effects:()=>{setRel("uni",-1);}, next:"next_day"},
  ]},

uni_romance_yes: { maxRepeats:1, bg:"park", text:`${uHeCap()} берёт тебя за руку. Пальцы тёплые.\n\n— Знаешь, — говорит ${uHe()}, — я не верил${uA()} в это. Думал${uA()}, так бывает только в кино.`,
  choices:[
    {text:"— Бывает.", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:`— Я тоже не верил${g("","а")}.`, effects:()=>{setMental(+1);}, next:"next_day"},
  ]},

uni_proposal: { maxRepeats:1, bg:"home", when:()=>flag("uni_romance") && !flag("married_uni") && state.age>=20 && rel("uni")>=7 && !flag("uni_proposal_seen"),
  text:`Вам по двадцать с лишним.\n\n${U()} сидит на диване. Ты — рядом. По телевизору — что-то старое. ${uHeCap()} смеётся над шуткой, которую слышал${uA()} сто раз.\n\nТы смотришь на ${uE()}. И понимаешь: вот оно.`,
  choices:[
    {text:"Сделать предложение.", effects:()=>{state.flags.uni_proposal_seen=true;state.flags.married_uni=true;state.flags.married=true;setMental(+3);setRel("uni",+3);}, next:"uni_wedding"},
    {text:"Подождать ещё год.", effects:()=>{state.flags.uni_proposal_seen=true;}, next:"next_day"},
  ]},

uni_wedding: { maxRepeats:1, bg:"park", text:`Свадьба — маленькая. Тридцать человек. В парке, у пруда, где вы гуляли после универа.\n\n${U()} в ${state.gender==="girl"?"костюме":"платье"}. ${uHeCap()} плачет. Мать плачет. Даже кто-то из универа пришёл. Стоит в сторонке, снимает на телефон.\n\n— Соглас${state.gender==="girl"?"ен":"на"}, — говорит ${U()}.\n\nГолос дрожит.`,
  choices:[
    {text:`— Соглас${g("ен","на")}.`, effects:()=>{setMental(+3);}, next:"first_night"},
    {text:"Молчать от счастья.", effects:()=>{setMental(+2);}, next:"first_night"},
  ]},

first_night: { maxRepeats:1, bg:"home", when:()=>(flag("married_lena") || flag("married_uni")) && !flag("first_night_done"),
  text:`Ночь. Комната. За окном — фонарь. Тени на потолке.\n\n${spouseName()} сидит на краю кровати. Смотрит на тебя. Улыбается. Немного нервно.\n\n— Я волнуюсь, — говорит ${spouseHe()} тихо.`,
  choices:[
    {text:"— Я тоже.", effects:()=>{setMental(+2);setRel(spouseRelName(),+2);state.flags.first_night_done=true;}, next:"next_day"},
    {text:"— Давай просто полежим.", effects:()=>{setMental(+1);setRel(spouseRelName(),+2);state.flags.first_night_done=true;}, next:"next_day"},
  ]},

child_talk: { maxRepeats:1, bg:"home", when:()=>(flag("married_lena") || flag("married_uni")) && !flag("child") && state.age>=22 && !flag("child_seen"),
  text:`${spouseName()} держит в руках тест. Две полоски.\n\n${spouseHeCap()} смотрит на тебя. Испуганно и радостно одновременно.\n\n— Что будем делать? — спрашивает ${spouseHe()}.`,
  choices:[
    {text:"— Рожать.", effects:()=>{state.flags.child_seen=true;state.flags.child=true;setRel(spouseRelName(),+3);setMental(+2);setRel("child",+3);}, next:"next_day"},
    {text:"— А ты как хочешь?", effects:()=>{state.flags.child_seen=true;setRel(spouseRelName(),+2);}, next:"child_decide"},
    {text:"— Может, не сейчас?", effects:()=>{state.flags.child_seen=true;setRel(spouseRelName(),-5);setMental(-2);}, next:"next_day"},
  ]},

child_decide: { maxRepeats:1, bg:"home", text:`${spouseHeCap()} смотрит на тест. Потом на тебя. Потом снова на тест.\n\n— Я хочу. Если ты рядом.`,
  choices:[
    {text:"— Я рядом.", effects:()=>{state.flags.child=true;setRel("child",+3);}, next:"next_day"},
    {text:"— Мне нужно подумать.", effects:()=>{setRel(spouseRelName(),-3);}, next:"next_day"},
  ]},

family_life: { maxRepeats:2, bg:"home", when:()=>flag("child") && (flag("married_lena") || flag("married_uni")),
  text:`Утро.\n\n${spouseName()} на кухне. Гремит посудой. Ребёнок плачет в комнате. Пахнет молоком и кофе.\n\nТы сидишь за столом. Смотришь в окно.\n\nВспоминаешь, как всё начиналось.`,
  choices:[
    {text:`Помочь ${spouseName()}.`, effects:()=>{setRel(spouseRelName(),+1);setMental(+1);}, next:"next_day"},
    {text:"Уйти на работу.", effects:()=>{}, next:"next_day"},
    {text:"Сидеть и смотреть.", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

old_age65: { maxRepeats:1, bg:"home", when:()=>state.age>=65 && !flag("old_done"),
  text:`Тебе шестьдесят пять.\n\nВыход на пенсию. Внуки играют во дворе.\n\nТы смотришь в окно.`,
  choices:[
    {text:"Позвать их.", effects:()=>{state.flags.old_done=true;setMental(+1);}, next:"next_day"},
    {text:"Закрыть шторы.", effects:()=>{state.flags.old_done=true;setMental(-1);}, next:"next_day"},
  ]},

old_age_loop: { maxRepeats:3, bg:"home", when:()=>state.age>=65 && flag("old_done"),
  text:`${glance()}Ещё год.\n\nВопрос — зачем?`,
  choices:[
    {text:"Продолжать.", effects:()=>{ if(state.age>=80){ die("old_age",state.age); return null; } state.age += 5; }, next:"next_day"},
    {text:"Закончить самому.", effects:()=>{die("pills",state.age);}},
  ]},

psych_ward: { maxRepeats:1, bg:"psych", text:`Тебя забрали.\n\nБелые стены. Решётки.\n\nВрач:\n\n— Мы поможем тебе забыть.`,
  choices:[
    {text:"Сотрудничать.", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Бунтовать.", effects:()=>{setMental(-3);if(seeded(makeSeed())<0.5)die("psych_kill",state.age,"персонал");}, next:"next_day"},
    {text:"Притвориться здоровым.", effects:()=>{if(state.mental>=6){state.flags.psych_ward=false;state.flags.psych_kill_done=true;state.flags.psych_healthy=true;setMental(+2);}else setMental(-2);}, next:"next_day"},
  ]},

psych_final_choice: { maxRepeats:1, bg:"psych", text:`Прошло двенадцать дней.\n\nВрач заходит в палату с папкой. Смотрит в бумаги. Потом на тебя.\n\n— ${state.name}. Завтра — последняя процедура. После неё — либо поправишься, либо...\n\nОн не договаривает.\n\nНочью окно в коридоре приоткрыто. Решётка ослаблена. Санитар спит на посту.`,
  choices:[
    {text:"Остаться. Пройти лечение.", next:"psych_treatment_result"},
    {text:"Сбежать.", effects:()=>{
      if(seeded(makeSeed()) < 0.5){
        state.flags.psych_ward = false;
        state.flags.psych_escaped = true;
        state.flags.psych_kill_done = true;
        setMental(+2);
        return "psych_escape_success";
      } else {
        state.flags.psych_start_day = state.day;
        setMental(-3);
        return "psych_escape_fail";
      }
    }},
  ]},

psych_treatment_result: { maxRepeats:1, bg:"psych", text:`Кабинет. Ремни на руках. Аппарат с проводами. Врач с холодными пальцами.\n\n— Считай до десяти, — говорит он.`,
  choices:[
    {text:"Считать.", effects:()=>{
      if(seeded(makeSeed()) < 0.05){ die("psych_kill", state.age, "персонал"); return null; }
      state.flags.psych_ward = false;
      state.flags.psych_healthy = true;
      state.flags.psych_kill_done = true;
      state.flags.killed_someone = false;
      setMental(+4);
      return "psych_healthy_exit";
    }},
  ]},

psych_escape_success: { maxRepeats:1, bg:"street", text:`Ты бежишь босиком по холодному асфальту. За спиной — крики. Но они стихают.\n\nЧерез час ты у своей двери. Мать открывает. Вскрикивает. Обнимает так крепко, что рёбра трещат.\n\n— Я думала, тебя больше нет.`,
  choices:[
    {text:"Обнять в ответ.", effects:()=>{setRel("mother",+3);setMental(+2);state.flags.killed_someone=false;}, next:"next_day"},
    {text:"Молча войти.", effects:()=>{state.flags.killed_someone=false;}, next:"next_day"},
  ]},

psych_escape_fail: { maxRepeats:1, bg:"psych", text:`Ты добегаешь до двери. Она заперта. Новый замок, блестящий.\n\nСзади — шаги. Рука санитара хватает тебя за плечо.\n\n— Куда собрал${g("ся","ась")}?\n\nТебя возвращают в палату. Врач делает пометку: «Попытка побега. Продлить срок».`,
  choices:[
    {text:"Смириться.", effects:()=>{}, next:"next_day"},
    {text:"Кричать.", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

psych_healthy_exit: { maxRepeats:1, bg:"hospital", text:`Ты просыпаешься в белой палате. Но это не психушка. Обычная больница.\n\nЗа окном — утро. Настоящее. С птицами.\n\nВрач улыбается. Впервые по-настоящему.\n\n— Ты справил${g("ся","ась")}. Все анализы в норме. Ты здоров${g("","а")}.\n\nМать сидит рядом. Она плачет. Но от облегчения.`,
  choices:[
    {text:"Встать.", effects:()=>{setMental(+3);}, next:"next_day"},
    {text:"Полежать ещё.", effects:()=>{setMental(+1);}, next:"next_day"},
  ]},

orphan_home: { maxRepeats:1, bg:"orphanage", text:`Детский дом. Восемь детей в комнате. Воспитательница — Валентина Петровна, полная, с усталыми глазами.\n\n— ${state.name}, вот твоя койка. У окна.\n\nЗа столом — трое старших. Один из них, Гриша, смотрит на тебя, не отрываясь.`,
  choices:[
    {text:"Подойти к Грише.", effects:()=>{state.flags.orphan_met_gosha=true;setRel("gosha",0);}, next:"orphan_gosha_first"},
    {text:"Лечь на койку.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Спросить у Валентины про родителей.", effects:()=>{state.flags.orphan_asked=true;}, next:"orphan_ask_parents"},
  ]},

orphan_gosha_first: { maxRepeats:1, bg:"orphanage", text:`Гриша — высокий, лет четырнадцати. Он не улыбается.\n\n— Новенький? — говорит он без вопроса в голосе. — Тут правило: не стучишь — не получаешь.\n\nОн ждёт реакции.`,
  choices:[
    {text:"— Понял.", effects:()=>{setRel("gosha",+1);}, next:"next_day"},
    {text:"— А если постучу?", effects:()=>{setRel("gosha",-1);}, next:"orphan_gosha_push"},
    {text:"Молча уйти.", effects:()=>{setRel("gosha",-2);state.flags.orphan_grudge=true;}, next:"next_day"},
  ]},

orphan_gosha_push: { maxRepeats:1, bg:"orphanage", text:`Гриша усмехается.\n\n— Смелый. Тут такие долго не задерживаются.\n\nОн отворачивается. Больше не говорит.`,
  next:"next_day"},

orphan_ask_parents: { maxRepeats:1, bg:"orphanage", text:`Валентина Петровна смотрит на тебя долго. Потом садится рядом.\n\n— Не знаю, милый. Правда не знаю. В бумагах — только что ты остался один.\n\nОна гладит тебя по голове. Рука у неё тёплая.`,
  next:"next_day"},

orphan_adopt_try1: { maxRepeats:1, bg:"orphanage", when:()=>flag("orphan") && !flag("orphan_adopt_try1_done") && state.day >= 30,
  text:`Приехала пара. Молодые, улыбчивые. Женщина смотрит на тебя долго.\n\n— Какой тихий, — говорит она мужу. — Наверное, напуган.\n\nВалентина Петровна шепчет тебе:\n\n— Улыбнись. Просто улыбнись.`,
  choices:[
    {text:"Улыбнуться.", effects:()=>{state.flags.orphan_adopt_try1_done=true;}, next:"orphan_adopt_fail1"},
    {text:"Отвернуться.", effects:()=>{state.flags.orphan_adopt_try1_done=true;}, next:"orphan_adopt_fail1"},
    {text:"Сказать правду про подвал.", effects:()=>{state.flags.orphan_adopt_try1_done=true;}, next:"orphan_adopt_fail1"},
  ]},

orphan_adopt_fail1: { maxRepeats:1, bg:"orphanage", text:`Пара уходит. Женщина оглядывается. Но не возвращается.\n\nВалентина Петровна:\n\n— Не в этот раз, милый. В следующий раз получится.`,
  next:"next_day"},

orphan_adopt_try2: { maxRepeats:1, bg:"orphanage", when:()=>flag("orphan") && flag("orphan_adopt_try1_done") && !flag("orphan_adopt_try2_done") && state.day >= 90,
  text:`Ещё одна пара. Старше. Без улыбок.\n\nЖенщина с папкой. Мужчина с блокнотом.\n\n— ${state.name}, — говорит женщина. — Расскажи, что ты любишь.`,
  choices:[
    {text:"— Собак.", effects:()=>{state.flags.orphan_adopt_try2_done=true;}, next:"orphan_adopt_fail2"},
    {text:"— Ничего.", effects:()=>{state.flags.orphan_adopt_try2_done=true;setMental(-1);}, next:"orphan_adopt_fail2"},
    {text:`— ${F()}.`, effects:()=>{state.flags.orphan_adopt_try2_done=true;}, next:"orphan_adopt_fail2"},
  ]},

orphan_adopt_fail2: { maxRepeats:1, bg:"orphanage", text:`Валентина Петровна заходит в комнату. Вид у неё странный.\n\n— Милый. Они сказали… они сказали, что хотят ребёнка «без прошлого».\n\nОна садится на койку рядом.\n\n— Прости.`,
  choices:[
    {text:"— Я понимаю.", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"— Это из-за подвала?", effects:()=>{setMental(-1);state.fear+=2;}, next:"next_day"},
  ]},

orphan_reject: { maxRepeats:1, bg:"orphanage", when:()=>flag("orphan") && flag("orphan_adopt_try2_done") && !flag("orphan_adopt_final_done") && state.day >= 180,
  text:`Тебя больше не зовут в кабинет. Другие дети ходят — ты нет.\n\nГриша:\n\n— Заметил? Тебя списали. Теперь ты — «сложный случай».\n\nОн не издевается. Просто говорит как есть.`,
  choices:[
    {text:"— И что теперь?", effects:()=>{state.flags.orphan_adopt_final_done=true;}, next:"orphan_final_choice"},
    {text:"— Мне всё равно.", effects:()=>{state.flags.orphan_adopt_final_done=true;setMental(-1);}, next:"orphan_final_choice"},
    {text:"— Я сам уйду.", effects:()=>{state.flags.orphan_adopt_final_done=true;}, next:"orphan_final_choice"},
  ]},

orphan_final_choice: { maxRepeats:1, bg:"orphanage", text:`Тебе исполняется ${state.age}.\n\nДо выпуска — считанные месяцы. Или годы.\n\nВалентина Петровна:\n\n— ${state.name}. Ты уже взрослый. Почти. Что ты хочешь?\n\nЭто первый раз, когда тебя спрашивают. По-настоящему.`,
  choices:[
    {text:"— Остаться до выпуска.", effects:()=>{state.flags.orphan_stay=true;state.flags.orphan_free=true;}, next:"next_day"},
    {text:"— Учиться. Поступить.", effects:()=>{state.flags.orphan_study=true;state.flags.orphan_free=true;setRep(+2);}, next:"next_day"},
    {text:"— Убежать.", effects:()=>{state.flags.orphan_free=true;state.flags.orphan_runaway=true;if(seeded(makeSeed())<0.4){state.flags.orphan_caught=true;setMental(-3);return "orphan_runaway_fail";}}, next:"orphan_runaway"},
  ]},

orphan_runaway: { maxRepeats:1, bg:"street", text:`Ты бежишь через двор. Холодный асфальт. Звёзды.\n\nНикто не гонится.`,
  next:"next_day"},

orphan_runaway_fail: { maxRepeats:1, bg:"orphanage", text:`Валентина Петровна ловит тебя у ворот. Она не кричит. Просто держит за плечи.\n\n— Ну куда ты, глупый. Куда.\n\nВедёт обратно.`,
  next:"next_day"},

thing_event_1: { maxRepeats:1, bg:"home", text:`Ночью просыпаешься от холода. Одеяло сброшено на пол.\n\nВ углу комнаты — тень. Слишком густая. Не как от шкафа.`,
  choices:[
    {text:"Смотреть.", effects:()=>{state.fear+=3;}, next:"next_day"},
    {text:"Закрыть глаза.", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Позвать мать.", effects:()=>{setRel("mother",+1);}, next:"thing_warn_1"},
  ]},

thing_warn_1: { maxRepeats:1, bg:"home", text:`Мать приходит. Включает свет. Она в халате. Волосы растрёпаны.\n\nСадится на край кровати.\n\n— Что ты видел${g("","а")}?`,
  choices:[
    {text:"Рассказать правду.", effects:()=>{setRel("mother",+1);}, next:"next_day"},
    {text:"Соврать.", effects:()=>{setRel("mother",-1);}, next:"next_day"},
  ]},

thing_event_2: { maxRepeats:1, bg:"home", text:`Ты находишь в подвале старую фотографию. В углу за полкой. Затянутую паутиной.\n\nНа ней — семья. Не твоя.\n\nУ всех стёрты лица. Будто кто-то долго тёр их пальцем.`,
  choices:[
    {text:"Взять себе.", effects:()=>{state.fear+=2;}, next:"next_day"},
    {text:"Показать матери.", next:"thing_warn_2"},
    {text:"Сжечь самому.", effects:()=>{state.fear-=1;}, next:"next_day"},
  ]},

thing_warn_2: { maxRepeats:1, bg:"home", text:`Мать стоит у окна. За стеклом — сумерки. Фонарь. Кто-то идёт по улице.\n\n— Ты давно видишь… его? — спрашивает она, не оборачиваясь.`,
  choices:[
    {text:"— Да. С шести лет.", effects:()=>{state.flags.mother_believes=true;}, next:"next_day"},
    {text:"— Нет. Просто фото.", next:"next_day"},
  ]},

thing_event_3: { maxRepeats:1, bg:"basement", text:`Ты спускаешься в подвал за банкой варенья.\n\nНа стене — новая надпись. Свежая краска. Капает на пол.\n\n«ОН РАСТЁТ».`,
  choices:[
    {text:"Сфотографировать.", next:"next_day"},
    {text:"Показать отцу.", effects:()=>{setRel("father",-1);}, next:"thing_warn_father"},
    {text:"Стереть.", effects:()=>{state.fear+=2;}, next:"next_day"},
  ]},

thing_warn_father: { maxRepeats:1, bg:"home", text:`Отец сидит на кухне. Перед ним — стакан. Наполовину пустой.\n\nСмотрит на тебя.\n\n— Мать говорит, ты видишь вещи.`,
  choices:[
    {text:"Рассказать всё.", effects:()=>{if(flag("mother_believes"))state.flags.father_believes=true;}, next:"next_day"},
    {text:"Отпереться.", effects:()=>{setRel("father",-2);}, next:"next_day"},
  ]},

thing_event_4: { maxRepeats:1, bg:"home", text:`Ночью слышишь крик.\n\nМать стоит в коридоре. Перед ней — дверь подвала. Открытая.\n\nОна не двигается. Смотрит внутрь.`,
  choices:[
    {text:"Закрыть дверь.", effects:()=>{state.fear+=3;setRel("mother",+2);}, next:"next_day"},
    {text:"Заглянуть внутрь.", effects:()=>{
      state.fear+=5; setMental(-2);
      if(seeded(makeSeed()) < 0.3){ state.flags.parents_taken = true; return "thing_parents_taken"; }
    }, next:"thing_face"},
    {text:"Разбудить отца.", effects:()=>{}, next:"next_day"},
  ]},

thing_face: { maxRepeats:1, bg:"basement", text:`Не тень. Существо. Сидит на нижней ступеньке.\n\nУ него твоё лицо. Но взрослое.`,
  choices:[
    {text:"— Что тебе надо?", effects:()=>{state.fear+=3;}, next:"thing_answer"},
    {text:"Убежать.", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

thing_answer: { maxRepeats:1, bg:"basement", text:`— Тебя. Когда останешься один${g("","а")}.\n\nТвои родители… они мешают.`,
  choices:[
    {text:"— Не тронь их.", effects:()=>{state.fear+=2;}, next:"next_day"},
    {text:"Молчать.", effects:()=>{setMental(-3);}, next:"next_day"},
  ]},

thing_parents_taken: { maxRepeats:1, bg:"basement", text:`Утром родители не выходят из комнаты.\n\nТы стучишь. Тишина.\n\nОткрываешь дверь. На кровати — два мокрых следа. Формой человека.\n\nРодителей нет.`,
  choices:[

const POOL_6  = ["home_age6","neighbor_bab_valya","dima_bully","dogs_pack","stray_kitten","neighbor_dog_lover"];
const POOL_12 = ["school_age12","school_bully_age12","school_corridor_age13","dima_bully","neighbor_bab_valya","dogs_pack","stray_kitten","school_trip","school_crush"];
const POOL_16 = ["club_age16","forest_age17","lena_needs_help_age14","lena_protect_serious_age15","push_from_roof_age16","school_trip","school_crush","teen_rebellion","dogs_rescue"];
const POOL_19 = ["uni_age19","love_age20","alcohol_age19","accident_age22","job_age22","found_money","dogs_rescue","teen_rebellion"];
const POOL_23 = ["career_age25","marriage_age28","child_birth_age30","midlife_age40","found_money","dogs_rescue"];
const POOL_35 = ["family_age35","parents_die_age45","health_age50","divorce_age52","dogs_rescue"];
const POOL_50 = ["health_age50","divorce_age52"];
const POOL_65 = ["old_age65","old_age_loop"];
const ORPHAN_POOL = ["orphan_adopt_try1","orphan_adopt_try2","orphan_reject"];

function getPool(){
  const a = state.age;
  if(a<12) return POOL_6;
  if(a<16) return POOL_12;
  if(a<19) return POOL_16;
  if(a<23) return POOL_19;
  if(a<35) return POOL_23;
  if(a<50) return POOL_35;
  if(a<65) return POOL_50;
  return POOL_65;
}

function checkHoliday(){
  const key = `${state.y}_${state.m}_${state.d}`;
  if(state.usedHolidays[key]) return null;

  if(state.m === 12 && state.d === 31 && state.age >= 5){ state.usedHolidays[key] = true; return "new_year"; }
  if(state.m === 3 && state.d === 8 && state.age >= 5){ state.usedHolidays[key] = true; return "march_8"; }
  if(state.m === 2 && state.d === 23 && state.age >= 5){ state.usedHolidays[key] = true; return "feb_23"; }
  if(state.m === 5 && state.d === 9 && state.age >= 5){ state.usedHolidays[key] = true; return "may_9"; }
  if(state.m === 4 && state.d >= 12 && state.d <= 20 && !state.usedHolidays[`${state.y}_easter`] && state.age >= 5){
    state.usedHolidays[`${state.y}_easter`] = true; return "easter";
  }
  return null;
}

const app = document.getElementById("app");

function shake(){
  const el = document.querySelector(".scene") || app;
  el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),800);
}

function die(cause, atAge, killer=null){
  const pair = DEATHS[cause];
  state.deathCause = pair ? (state.gender === "girl" ? pair[1] : pair[0]) : cause;
  state.deathAge = atAge;
  state.killer = killer;
  showDeath();
}

function buildEpilogue(){
  const parts = [`Ты ${g("умер","умерла")} в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  const r = n => state.relations[n] ?? 0;

  if(state.killer && r(state.killer)<=-5) parts.push("Это сделал тот, кого ты когда-то обидел.");
  if(r("mother")>=5) parts.push("Мать не пережила. Она приходила на могилу каждый день.");
  else if(r("mother")<=-3) parts.push("Мать узнала слишком поздно. Она даже не пришла.");
  if(r("anya")>=3) parts.push("Аня пришла на похороны. Она плакала.");
  else if(r("anya")<=-5) parts.push("Аня не пришла. Она знала, что так будет.");
  if(r("lena")>=5) parts.push(`${F()} был${fA()} рядом до конца.`);
  else if(r("lena")<=-5) parts.push(`${F()} не приш${fA()}. Ты сам${g("","а")} оттолкнул${g("","а")}.`);
  if(r("uni")>=5) parts.push(`${U()} был${uA()} рядом до конца.`);
  if(r("child")>=3) parts.push("Твой ребёнок держал тебя за руку.");
  if(r("dogs")>=3) parts.push("Собаки приходили на твою могилу ещё долго.");
  if(r("gosha")>=3) parts.push("Гриша из детдома приехал. Он не плакал. Но остался до конца.");

  if(state.reputation >= 6) parts.push(`Тебя помнили как ${repLabel()}.`);
  else if(state.reputation <= -6) parts.push(`Тебя помнили как ${repLabel()}. Немногие пришли.`);

  if(state.mental<=2) parts.push("Психика была разрушена задолго до конца.");
  if(flag("kind")) parts.push(`Кто-то вспомнил, что ты был${g("","а")} добр${g("","а")}.`);
  if(flag("mother_believes")) parts.push("Мать верила тебе. До конца.");
  if(flag("moved")) parts.push("Вы переехали. И оно не пошло за вами.");
  if(flag("psych_healthy")) parts.push("Ты вышел из психушки здоровым. Но помнил всё.");
  if(flag("psych_escaped")) parts.push("Ты сбежал. Они так и не нашли тебя.");
  if(flag("psych_ward")&&!flag("psych_healthy")&&!flag("psych_escaped")) parts.push("Тебя держали в психушке. Ты умер там.");
  if(flag("killed_ever")) parts.push("Ты убил человека. Это осталось с тобой.");
  if(flag("lena_dead")) parts.push(`${F()} умер, защищая тебя.`);
  if(flag("lena_left")) parts.push(`${F()} отвернулся от тебя.`);

  if(state.guilt>5) parts.push("Последнее, что ты чувствовал — вина.");
  if(state.fear>10) parts.push("Последнее, что ты чувствовал — страх.");

  const key=[
    state.deathCause,state.deathAge,state.killer||"-",
    flag("kind")?"k":"-",flag("moved")?"m":"-",
    flag("lena_dead")?"ld":"-",flag("lena_left")?"ll":"-",
    flag("married_lena")?"ml":"-",flag("married_uni")?"mu":"-",
    flag("psych_healthy")?"ph":"-",flag("psych_escaped")?"pe":"-",
    flag("killed_ever")?"ks":"-",
    state.mental<=2?"m2":"-",
    state.reputation>=6?"rh":"-",state.reputation<=-6?"rl":"-",
  ].join("_");
  state.seenEndings.add(key);
  return parts.join(" ");
}

function showDeath(){
  clearBackButtons();
  const ep = buildEpilogue();
  playSfx("heartbeat");
  app.classList.add("fade-out");
  setTimeout(()=>{
    const canReturn = state._history && state._history.length >= 1;
    app.innerHTML=`
      <div class="death-screen">
        <p>${ep}</p>
        <p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge}</p>
        ${canReturn ? `<button id="backToChoice" style="border-color:#8a6a2a">↩ Вернуться к последнему выбору</button>` : ""}
        <button id="restart">Начать заново</button>
      </div>`;
    document.getElementById("restart").onclick=()=>location.reload();
    if(canReturn){
      document.getElementById("backToChoice").onclick = ()=>{
        state.deathCause = null;
        state.deathAge = null;
        state.killer = null;
        if(state._history.length){
          const prev = state._history[state._history.length - 1];
          restoreState(prev.snap);
          state._history.pop();
          state.deathCause = null;
          state.deathAge = null;
          state.killer = null;
          render(prev.sceneObj);
        }
      };
    }
    app.classList.remove("fade-out");
  },150);
}

function playScene(id){
  if(!id || id==="next_day" || id==="auto_day" || id==="day_start") return advanceDay();
  let scene = scenes[id];
  if(!scene){
    state._skipCount = (state._skipCount || 0) + 1;
    if(state._skipCount > 3){ state._skipCount = 0; return showMontage(30); }
    return advanceDay();
  }
  state._skipCount = 0;

  if(typeof scene === "function") scene = scene();

  const due = checkTimers();
  if(due.length && !id.startsWith("event_")) return playScene("event_"+due[0].event);

  if(scene.when && !scene.when()) return playScene("next_day");

  if(flag("killed_someone") && !flag("psych_ward") && !flag("psych_checked") && !flag("psych_escaped") && !flag("psych_healthy") && !flag("psych_kill_done")){
    state.flags.psych_checked = true;
    state.flags.psych_ward = true;
    state.flags.psych_start_day = state.day;
    setMental(-5);
    return playScene("psych_ward");
  }

  if(flag("orphan") && !flag("orphan_done") && !id.startsWith("orphan_")){
    state.flags.orphan_done = true;
    return playScene("orphan_home");
  }

  markScenePlayed(id);
  state._currentSceneId = id;
  render(scene);
}

function render(scene){
  state._chain = 0;
  clearBackButtons();
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    const rep = state.reputation;
    const repPercent = ((rep + 10) / 20) * 100;
    app.innerHTML=`
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${mentClass}">${starStr(state.mental)}</span>
          </div>
          <div class="reputation-bar">
            <span>Репутация:</span>
            <div class="rep-track"><div class="rep-fill ${repClass()}" style="width:${repPercent}%"></div></div>
            <span>${repLabel()}</span>
          </div>
          <p class="text">${scene.text}</p>
          <div class="choices"></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG[scene.bg] || BG.home;

    const box = app.querySelector(".choices");
    if(scene.choices){
      const alreadyPushed = state._history && state._history.length && state._history[state._history.length-1].sceneObj === scene;
      if(!alreadyPushed){
        pushHistory(state._currentSceneId || "unknown", scene);
      }

      scene.choices.forEach(c=>{
        if(c.when && !c.when()) return;
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = ()=>{
          getCtx();
          const jumpTo = c.effects?.();
          if(state.deathCause) return;
          if(c.after){ showAfter(c.after, jumpTo || c.next || "next_day"); return; }
          playScene(jumpTo || c.next || "next_day");
        };
        box.appendChild(b);
      });
    } else {
      const b = document.createElement("button");
      b.textContent = "Дальше";
      b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");};
      box.appendChild(b);
    }
    app.classList.remove("fade-out");

    if(state._history && state._history.length >= 2){
      const back = document.createElement("button");
      back.className = "back-btn";
      back.textContent = "← Назад";
      back.onclick = ()=>{ goBack(); };
      document.body.appendChild(back);
    }
  },150);
}

function showAfter(text, next){
  state._chain = 0;
  clearBackButtons();
  app.classList.add("fade-out");
  setTimeout(()=>{
    const rep = state.reputation;
    const repPercent = ((rep + 10) / 20) * 100;
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
          </div>
          <div class="reputation-bar">
            <span>Репутация:</span>
            <div class="rep-track"><div class="rep-fill ${repClass()}" style="width:${repPercent}%"></div></div>
            <span>${repLabel()}</span>
          </div>
          <p class="text after-text">${text}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;

      app.classList.remove("fade-out");
      playScene(next);
    };
    app.classList.remove("fade-out");

    if(state._history && state._history.length >= 2){
      const back = document.createElement("button");
      back.className = "back-btn";
      back.textContent = "← Назад";
      back.onclick = ()=>{ goBack(); };
      document.body.appendChild(back);
    }
  },150);

function showMontage(days){
  state._chain = 0;
  clearBackButtons();
  const lines = pickMontageArc(days);

  let tempY = state.y, tempM = state.m, tempD = state.d;
  for(let i=0;i<days;i++){
    tempD += 1;
    const dim = new Date(tempY, tempM, 0).getDate();
    if(tempD > dim){ tempD = 1; tempM += 1; }
    if(tempM > 12){ tempM = 1; tempY += 1; }
  }
  state.y = tempY; state.m = tempM; state.d = tempD;
  state.day += days;
  state.dailySeed = state.day * 7919 + state.y * 104729 + state.m * 1299709 + state.d * 15485863;

  if(state.m === 11 && state.d >= 28){
    if(!state.flags["_bd_"+state.y]){ state.flags["_bd_"+state.y]=true; state.age += 1; }
  } else {
    const ageByYears = state.y - 2015;
    if(ageByYears + 5 > state.age && state.m >= 11) state.age = ageByYears + 5;
  }

  if(state.age >= 50) state.dementia = Math.min(10, state.dementia + Math.floor(days/30));
  if(state.reputation <= -4 && state.age >= 10) setMental(-1);

  const holiday = checkHoliday();
  const due = checkTimers();
  let nextEvent = null;
  if(due.length) nextEvent = "event_"+due[0].event;

  if(!nextEvent && holiday) nextEvent = holiday;
  if(!nextEvent && state.age>=15 && !flag("exam9_done")) nextEvent = "exam9_choice";
  if(!nextEvent && state.age>=17 && flag("school_10_11") && !flag("exam11_done")) nextEvent = "exam11_choice";

  if(!nextEvent && state.age >= 7 && state.age < 16 && state.thingLevel < 5 && !flag("moved") && !flag("orphan") && !flag("psych_ward") && !flag("parents_taken")){
    const thresholds = {1:7, 2:9, 3:11, 4:13, 5:15};
    const nextAge = thresholds[state.thingLevel+1];
    if(nextAge && state.age >= nextAge){
      state.thingLevel += 1;
      nextEvent = "thing_event_" + state.thingLevel;
    }
  }

  if(!nextEvent && flag("psych_ward") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 12){ state.flags.psych_start_day = state.day; nextEvent = "psych_final_choice"; }
  }

  if(!nextEvent && flag("orphan") && !flag("orphan_free")){
    if(!flag("orphan_adopt_try1_done") && state.day >= 30) nextEvent = "orphan_adopt_try1";
    else if(!flag("orphan_adopt_try2_done") && state.day >= 90) nextEvent = "orphan_adopt_try2";
    else if(!flag("orphan_adopt_final_done") && state.day >= 180) nextEvent = "orphan_reject";
  }

  if(!nextEvent && state.age >= 65 && !flag("old_done")){ state.flags.old_done = true; nextEvent = "old_age65"; }

  app.classList.add("fade-out");
  setTimeout(()=>{
    const rep = state.reputation;
    const repPercent = ((rep + 10) / 20) * 100;
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
          </div>
          <div class="reputation-bar">
            <span>Репутация:</span>
            <div class="rep-track"><div class="rep-fill ${repClass()}" style="width:${repPercent}%"></div></div>
            <span>${repLabel()}</span>
          </div>
          <p class="text after-text">${lines.join("\n\n")}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG.montage;
    document.getElementById("contBtn").onclick = ()=>{
      app.classList.remove("fade-out");
      if(nextEvent) return playScene(nextEvent);
      const pick = pickScene(getPool());
      if(pick) return playScene(pick);
      return showMontage(60);
    };
    app.classList.remove("fade-out");

    if(state._history && state._history.length >= 2){
      const back = document.createElement("button");
      back.className = "back-btn";
      back.textContent = "← Назад";
      back.onclick = ()=>{ goBack(); };
      document.body.appendChild(back);
    }
  },150);
}

function advanceDay(){
  state._chain = (state._chain || 0) + 1;
  if(state._chain > 200){ state._chain = 0; return showMontage(60); }

  state.d += 1;
  const dim = new Date(state.y, state.m, 0).getDate();
  if(state.d > dim){ state.d = 1; state.m += 1; }
  if(state.m > 12){ state.m = 1; state.y += 1; }
  state.day += 1;
  state.dailySeed = state.day * 7919 + state.y * 104729 + state.m * 1299709 + state.d * 15485863;

  if(flag("psych_ward") || flag("orphan")) return autoDay();

  if(state.m === 11 && state.d === 28 && !state.flags["_bd_"+state.y]){
    state.flags["_bd_"+state.y] = true;
    state.age += 1;
    if(state.age<12) return playScene("birthday_kid");
    if(state.age<19) return playScene("birthday_teen");
    if(state.age<65) return playScene("birthday_adult");
    return playScene("birthday_old");
  }

  const holiday = checkHoliday();
  if(holiday) return playScene(holiday);

  if(state.age >= 7 && state.age <= 17){
    const lastTeacher = state.flags.teacherLastDay || 0;
    if(state.day - lastTeacher >= 14 && seeded(makeSeed()) < 0.15){
      state.flags.teacherLastDay = state.day;
      return render(buildTeacherScene());
    }
  }

  if(state.reputation <= -4 && state.age >= 10 && seeded(makeSeed()) < 0.4) setMental(-1);

  if(state.age >= 50){
    state.dementia = Math.min(10, state.dementia + (seeded(makeSeed())<.3?1:0));
    if(state.dementia >= 8 && seeded(makeSeed()) < .25) return playScene("dementia_crisis");
  }

  if(state.age >= 7 && state.age < 16 && state.thingLevel < 5 && !flag("moved") && !flag("orphan") && !flag("psych_ward") && !flag("parents_taken")){
    const thresholds = {1:7, 2:9, 3:11, 4:13, 5:15};
    const nextAge = thresholds[state.thingLevel+1];
    if(nextAge && state.age >= nextAge){
      state.thingLevel += 1;
      return playScene("thing_event_" + state.thingLevel);
    }
  }

  if(state.age>=15 && !flag("exam9_done")) return playScene("exam9_choice");
  if(state.age>=17 && flag("school_10_11") && !flag("exam11_done")) return playScene("exam11_choice");

  autoDay();
}

function autoDay(){
  if(flag("psych_ward") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 12){ state.flags.psych_start_day = state.day; return playScene("psych_final_choice"); }
    return playScene("psych_final_choice");
  }

  if(flag("orphan") && !flag("orphan_free")){
    if(!flag("orphan_intro_done")){ state.flags.orphan_intro_done = true; return playScene("orphan_home"); }
    if(!flag("orphan_adopt_try1_done") && state.day >= 30) return playScene("orphan_adopt_try1");
    if(!flag("orphan_adopt_try2_done") && state.day >= 90) return playScene("orphan_adopt_try2");
    if(!flag("orphan_adopt_final_done") && state.day >= 180) return playScene("orphan_reject");
    return playScene(pickScene(ORPHAN_POOL));
  }

  if(state.age >= 7 && state.age < 46 && !flag("dogs_met") && state.day >= 3) return playScene("dogs_pack");

  if(flag("grudge") && rel("anya")<-3 && state.age>=16 && state.age<45 && !flag("revenge_done")){
    state.flags.revenge_done = true;
    return playScene("event_anya_revenge");
  }

  if(flag("lena_friend") && !flag("lena_dead") && !flag("lena_left")
     && rel("lena")>=5 && state.age>=18 && !flag("lena_romance") && !flag("married") && !flag("partner")
     && (state.day - (state.flags._romanceCooldown || 0) > 30)){
    state.flags._romanceCooldown = state.day;
    return playScene("lena_romance_start");
  }

  if(flag("lena_romance") && !flag("married_lena") && state.age>=20 && rel("lena")>=7
     && !flag("lena_proposal_seen") && seeded(makeSeed())<.4
     && (state.day - (state.flags._proposalCooldown || 0) > 60)){
    state.flags._proposalCooldown = state.day;
    return playScene("lena_proposal");
  }

  if((flag("married_lena") || flag("married_uni")) && !flag("first_night_done") && seeded(makeSeed())<.4) return playScene("first_night");
  if((flag("married_lena") || flag("married_uni")) && !flag("child") && state.age>=22 && !flag("child_seen") && seeded(makeSeed())<.25) return playScene("child_talk");
  if((flag("married_lena") || flag("married_uni")) && flag("child") && seeded(makeSeed())<.3) return playScene("family_life");

  if((flag("lena_dead") || flag("lena_left") || rel("lena")<3 || !flag("lena_friend"))
     && !flag("uni_friend") && state.age>=18 && !flag("married") && !flag("partner")
     && (state.day - (state.flags._uniCooldown || 0) > 20)){
    if(seeded(makeSeed()) < .5){ state.flags._uniCooldown = state.day; return playScene("uni_meet"); }
  }

  if(flag("uni_friend") && !flag("uni_romance") && state.age>=19 && rel("uni")>=5
     && !flag("married") && !flag("partner")
     && (state.day - (state.flags._uniRomanceCooldown || 0) > 30)){
    state.flags._uniRomanceCooldown = state.day;
    return playScene("uni_romance_start");
  }

  if(flag("uni_romance") && !flag("married_uni") && state.age>=20 && rel("uni")>=7
     && !flag("uni_proposal_seen") && seeded(makeSeed())<.4
     && (state.day - (state.flags._uniProposalCooldown || 0) > 60)){
    state.flags._uniProposalCooldown = state.day;
    return playScene("uni_proposal");
  }

  if(state.age>=65){
    if(!flag("old_done")){ state.flags.old_done = true; return playScene("old_age65"); }
    return playScene("old_age_loop");
  }

  // МОНТАЖ — раз в 30-60 дней
  const lastMontage = state.flags._lastMontageDay || 0;
  const montageCooldown = 30 + Math.floor(seeded(state.dailySeed + 5) * 31);
  if(state.day - lastMontage >= montageCooldown){
    state.flags._lastMontageDay = state.day;
    const skipDays = 30 + Math.floor(seeded(state.dailySeed+6) * 31);
    return showMontage(skipDays);
  }

  const pick = pickScene(getPool());
  if(pick) return playScene(pick);
  return showMontage(60);
}

function startScreen(){
  app.classList.remove("fade-out");
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Новая жизнь</span></div>
        <p class="text">Как тебя зовут?</p>
        <input id="nameInput" class="name-input" maxlength="20" placeholder="Имя" autocomplete="off">
        <div class="choices"><button id="btnOk">Дальше</button></div>
      </div>
    </div>`;
  const input = document.getElementById("nameInput");
  input.focus();
  const go = () => {
    const v = input.value.trim();
    if(v.length < 1){ input.placeholder = "Введи имя"; input.focus(); return; }
    state.name = v;
    genderScreen();
  };
  document.getElementById("btnOk").onclick = go;
  input.onkeydown = e => { if(e.key === "Enter") go(); };
}

function genderScreen(){
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Имя: ${state.name}</span></div>
        <p class="text">Ты девочка или мальчик?</p>
        <div class="choices">
          <button data-g="girl">Девочка</button>
          <button data-g="boy">Мальчик</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      state.gender = b.dataset.g;
      scenes = initScenes();
      playScene("first_day_school");
    };
  });
}

startScreen();
